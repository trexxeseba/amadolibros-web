name: Admin web - connect Checkly monitors
on:
  push:
    branches: [codex/admin-web-observability]
    paths:
      - '.github/workflows/admin-web-monitor-connect.yml'
      - 'scripts/admin-web-monitor-connect.mjs'
      - 'scripts/admin-web-checkly-browser.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-web-private-data
  cancel-in-progress: false
jobs:
  connect:
    if: github.repository == 'trexxeseba/amadolibros-web' && github.ref == 'refs/heads/codex/admin-web-observability'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verify receiver, private panel and connection guards
        run: node --experimental-sqlite --test functions/__tests__/admin-web*.test.js
      - name: Connect isolated resources and prove real provider delivery before activation
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/admin-web-monitor-connect.mjs
      - name: Prepare owner-only panel with verified monitor connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_WEB_OWNER_EMAIL: undiaes@gmail.com
        run: node scripts/admin-web-preview.mjs
      - name: Update the isolated private panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.107.0 deploy --config worker-admin/wrangler.preview.json
      - name: Verify private login remains enforced
        run: node scripts/admin-web-preview-check.mjs
      - name: Pause integration checks if setup failed or was cancelled
        if: failure() || cancelled()
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
        run: node scripts/admin-web-monitor-connect.mjs --pause-owned
