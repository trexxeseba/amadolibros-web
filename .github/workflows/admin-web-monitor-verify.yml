name: Admin web - verify live monitor connection
on:
  push:
    branches: [codex/admin-web-observability]
    paths:
      - '.github/workflows/admin-web-monitor-verify.yml'
      - 'scripts/admin-web-monitor-verify.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-web-private-data
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'trexxeseba/amadolibros-web' && github.ref == 'refs/heads/codex/admin-web-observability'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verify actual private bindings and source-backed panel sections
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/admin-web-monitor-verify.mjs
