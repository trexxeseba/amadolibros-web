name: Admin web - hourly Analytics refresh
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: admin-web-private-data
  cancel-in-progress: false
jobs:
  refresh:
    # Los cron de GitHub sólo corren tras incorporar el workflow a main.
    # Este archivo en la rama de revisión no activa el calendario.
    if: github.repository == 'trexxeseba/amadolibros-web' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/admin-web-observability'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Authenticate existing GA4 reader
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - name: Refresh existing private Analytics storage
        env:
          GA4_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/admin-web-refresh.mjs
