name: AI measurement baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-measurement-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-measurement-baseline
  cancel-in-progress: false

jobs:
  crawl:
    name: LOGS-3 baseline
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Query aggregated D1 rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p artifacts/seo
          npx wrangler@3.114.17 d1 execute ORDERS_DB --env production --remote --json \
            --command "SELECT date, pattern, status, verified, ua_googlebot, request_count, bytes_sum, bytes_known_count, duration_ms_sum FROM crawl_stats WHERE date >= '2026-08-09' AND date <= '2026-08-10' ORDER BY date, pattern, status, verified, ua_googlebot" \
            > artifacts/seo/crawl-stats-raw.json
      - name: Build crawl report
        env:
          CRAWL_REPORT_INPUT: artifacts/seo/crawl-stats-raw.json
          CRAWL_REPORT_OUTPUT_DIR: artifacts/seo
        run: node scripts/seo/crawl-report.mjs
      - name: Upload crawl baseline
        uses: actions/upload-artifact@v4
        with:
          name: ai-baseline-logs-2026-08-09-2026-08-10
          path: artifacts/seo/
          if-no-files-found: error
          retention-days: 30

  ga4:
    name: GA4 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate GA4 secrets
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          test -n "$GA4_SERVICE_ACCOUNT_JSON" || { echo "::error::Falta GA4_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -n "$GA4_PROPERTY_ID" || { echo "::error::Falta GA4_PROPERTY_ID"; exit 1; }
      - name: Authenticate with Google Analytics
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
      - name: Extract GA4 reports
        env:
          GA4_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_START_DATE: '2026-07-01'
          GA4_END_DATE: '2026-08-11'
          GA4_OUTPUT_DIR: artifacts/ga4
        run: node scripts/ga4-export.js
      - name: Upload GA4 baseline
        uses: actions/upload-artifact@v4
        with:
          name: ai-baseline-ga4-2026-07-01-2026-08-11
          path: artifacts/ga4/
          if-no-files-found: error
          retention-days: 30

  gsc:
    name: GSC baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate Search Console secret
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::Falta GA4_SERVICE_ACCOUNT_JSON"; exit 1; }
      - name: Authenticate with Search Console
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
      - name: Extract Search Analytics
        env:
          GSC_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          GSC_SITE_URL: https://www.amadolibros.com/
          GSC_START_DATE: '2026-05-11'
          GSC_END_DATE: '2026-08-08'
          GSC_OUTPUT_DIR: artifacts/gsc
        run: node scripts/seo/gsc-export.mjs
      - name: Upload GSC baseline
        uses: actions/upload-artifact@v4
        with:
          name: ai-baseline-gsc-2026-05-11-2026-08-08
          path: artifacts/gsc/
          if-no-files-found: error
          retention-days: 30
