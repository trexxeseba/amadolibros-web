name: Apply real editorial enrichment pilot

on:
  push:
    branches:
      - b11/editorial-real-pilot-disney-9791388034435
    paths:
      - scripts/seo/apply-editorial-real-pilot.mjs
      - .github/workflows/apply-editorial-real-pilot.yml

permissions:
  contents: write

concurrency:
  group: editorial-real-pilot
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: b11/editorial-real-pilot-disney-9791388034435
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Apply deterministic source changes
        run: node scripts/seo/apply-editorial-real-pilot.mjs

      - name: Validate syntax and focused behavior
        run: |
          node --check functions/_shared/book-editorial-upgrades.js
          node --check functions/_shared/book-enrichment-registry.js
          node --check 'functions/libro/[[path]].js'
          node --test \
            functions/__tests__/book-enrichment-333.test.js \
            functions/__tests__/book-editorial-upgrades.test.js \
            functions/__tests__/book-enrichment-live-check.test.js
          git diff --check

      - name: Remove one-off migration files
        run: |
          rm scripts/seo/apply-editorial-real-pilot.mjs
          rm .github/workflows/apply-editorial-real-pilot.yml

      - name: Commit validated implementation
        run: |
          git config user.name 'trexxeseba'
          git config user.email 'undiaes@gmail.com'
          git add -A
          git commit -m 'B11: convertir ficha Disney en enriquecimiento editorial real'
          git push origin HEAD:b11/editorial-real-pilot-disney-9791388034435
