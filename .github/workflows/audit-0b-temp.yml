name: Audit 0B live indexability temporary

on:
  push:
    branches:
      - agent/audit-0b-live-indexability

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Audit live cohort isolation and latency
        run: |
          mkdir -p artifacts/audit-0b
          node <<'NODE'
          const fs = require('node:fs');
          const { performance } = require('node:perf_hooks');

          const BASE = 'https://www.amadolibros.com';
          const UA = 'AmadoLibros-Audit0B/1.0';
          const CONCURRENCY = 8;

          function idsFromXml(xml) {
            const rows = [];
            for (const m of String(xml).matchAll(/<loc>([^<]+)<\/loc>/gi)) {
              const id = m[1].match(/\/libro\/(MLU\d+)\//i)?.[1]?.toUpperCase();
              if (id) rows.push({ id, url: m[1].replaceAll('&amp;', '&') });
            }
            return rows;
          }
          function linksFromHtml(html) {
            const out = [];
            const seen = new Set();
            for (const m of String(html).matchAll(/href=["']([^"']*\/libro\/(MLU\d+)\/[^"']*)["']/gi)) {
              const id = m[2].toUpperCase();
              if (seen.has(id)) continue;
              seen.add(id);
              const href = m[1].startsWith('http') ? m[1] : `${BASE}${m[1]}`;
              out.push({ id, url: href });
            }
            return out;
          }
          function pageCount(html) {
            const direct = html.match(/Página\s+\d+\s+de\s+(\d+)/i);
            if (direct) return Number(direct[1]);
            let max = 1;
            for (const m of html.matchAll(/[?&]page=(\d+)/gi)) max = Math.max(max, Number(m[1]));
            return max;
          }
          async function getText(url, headers={}) {
            const res = await fetch(url, { headers: { 'user-agent': UA, ...headers }, redirect: 'follow', signal: AbortSignal.timeout(45000) });
            const text = await res.text();
            if (!res.ok) throw new Error(`${url} HTTP ${res.status}`);
            return { res, text };
          }
          async function mapLimit(rows, fn) {
            const out = new Array(rows.length);
            let cursor = 0;
            async function worker() {
              while (cursor < rows.length) {
                const i = cursor++;
                try { out[i] = await fn(rows[i], i); }
                catch (error) { out[i] = { error: String(error?.message || error), input: rows[i] }; }
              }
            }
            await Promise.all(Array.from({length: Math.min(CONCURRENCY, rows.length || 1)}, worker));
            return out;
          }
          function percentile(values, p) {
            const v = values.filter(Number.isFinite).sort((a,b)=>a-b);
            if (!v.length) return null;
            const idx = Math.min(v.length - 1, Math.max(0, Math.ceil(p * v.length) - 1));
            return Math.round(v[idx]);
          }
          function robotsMeta(html) {
            return [...String(html).matchAll(/<meta[^>]+name=["']robots["'][^>]+content=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1].toLowerCase()).join(' | ')
              || [...String(html).matchAll(/<meta[^>]+content=["']([^"']+)["'][^>]+name=["']robots["'][^>]*>/gi)].map(m=>m[1].toLowerCase()).join(' | ');
          }
          function canonical(html) {
            return String(html).match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["'][^>]*>/i)?.[1]
              || String(html).match(/<link[^>]+href=["']([^"']+)["'][^>]+rel=["']canonical["'][^>]*>/i)?.[1]
              || '';
          }
          function idFromUrl(url) { return String(url).match(/\/libro\/(MLU\d+)\//i)?.[1]?.toUpperCase() || ''; }
          async function inspect(row) {
            const started = performance.now();
            const res = await fetch(row.url, {
              headers: { 'user-agent': UA, 'cache-control': 'no-cache' },
              redirect: 'follow', signal: AbortSignal.timeout(45000)
            });
            const headerMs = performance.now() - started;
            const html = await res.text();
            const totalMs = performance.now() - started;
            const metaRobots = robotsMeta(html);
            const xRobots = (res.headers.get('x-robots-tag') || '').toLowerCase();
            const canon = canonical(html);
            const noindex = metaRobots.includes('noindex') || xRobots.includes('noindex');
            const indexable = !noindex;
            const canonicalId = idFromUrl(canon);
            let pass = res.status === 200 && canonicalId === row.id;
            if (row.segment === 'outside_cohort') pass = pass && noindex;
            else pass = pass && indexable;
            return {
              ...row,
              finalUrl: res.url,
              status: res.status,
              ttfbMs: Math.round(headerMs),
              totalMs: Math.round(totalMs),
              metaRobots,
              xRobots,
              canonical: canon,
              canonicalId,
              cfCacheStatus: res.headers.get('cf-cache-status') || '',
              age: res.headers.get('age') || '',
              cacheControl: res.headers.get('cache-control') || '',
              serverTiming: res.headers.get('server-timing') || '',
              pass,
            };
          }
          function segmentSummary(rows) {
            const valid = rows.filter(r => !r.error);
            const cache = {};
            for (const r of valid) cache[r.cfCacheStatus || '(none)'] = (cache[r.cfCacheStatus || '(none)'] || 0) + 1;
            return {
              requested: rows.length,
              completed: valid.length,
              pass: valid.filter(r=>r.pass).length,
              failures: valid.filter(r=>!r.pass).length + rows.filter(r=>r.error).length,
              ttfbP50Ms: percentile(valid.map(r=>r.ttfbMs), .50),
              ttfbP95Ms: percentile(valid.map(r=>r.ttfbMs), .95),
              totalP95Ms: percentile(valid.map(r=>r.totalMs), .95),
              cacheStatuses: cache,
            };
          }

          (async () => {
            const [pausedXml, activeXml] = await Promise.all([
              getText(`${BASE}/sitemap-books-paused.xml`),
              getText(`${BASE}/sitemap-books-active.xml`),
            ]);
            const cohortRows = idsFromXml(pausedXml.text);
            const cohortIds = new Set(cohortRows.map(r=>r.id));
            const activeRows = idsFromXml(activeXml.text);

            const first = await getText(`${BASE}/catalogo?disponibilidad=encargo`);
            const pages = pageCount(first.text);
            const pagesData = [{page:1, text:first.text}, ...(await mapLimit(
              Array.from({length: Math.max(0, pages-1)}, (_,i)=>i+2),
              async page => ({page, text:(await getText(`${BASE}/catalogo?disponibilidad=encargo&page=${page}`)).text})
            )).filter(x=>!x.error)];
            const publicMap = new Map();
            for (const p of pagesData) for (const row of linksFromHtml(p.text)) if (!publicMap.has(row.id)) publicMap.set(row.id,row.url);
            const outside = [...publicMap].filter(([id])=>!cohortIds.has(id)).map(([id,url])=>({id,url,segment:'outside_cohort'}));
            const insideVisible = [...publicMap].filter(([id])=>cohortIds.has(id)).map(([id,url])=>({id,url,segment:'cohort'}));
            const insideMap = new Map(insideVisible.map(r=>[r.id,r]));
            for (const row of cohortRows) if (!insideMap.has(row.id)) insideMap.set(row.id,{...row,segment:'cohort'});
            const inside = [...insideMap.values()];
            const active = activeRows.map(r=>({...r,segment:'active'}));

            // Deterministic spread across each universe, not just first IDs.
            function spread(rows, n) {
              if (rows.length <= n) return rows;
              const out=[];
              for (let i=0;i<n;i++) out.push(rows[Math.floor(i*(rows.length-1)/(n-1))]);
              return out;
            }
            const sample = [
              ...spread(outside, 60),
              ...spread(inside, 60),
              ...spread(active, 40),
            ];
            const inspected = await mapLimit(sample, inspect);
            const bySegment = {};
            for (const segment of ['outside_cohort','cohort','active']) bySegment[segment] = segmentSummary(inspected.filter(r=>(r.segment || r.input?.segment)===segment));
            const failures = inspected.filter(r=>r.error || !r.pass).slice(0,25);
            const report = {
              generatedAt:new Date().toISOString(),
              universes:{ publicByRequest:publicMap.size, cohort:cohortIds.size, publicOutsideCohort:outside.length, publicInsideCohort:insideVisible.length, catalogPages:pages },
              sampleSize:sample.length,
              bySegment,
              failures,
            };
            fs.writeFileSync('artifacts/audit-0b/report.json', JSON.stringify(report,null,2));
            const lines=[
              '# Auditoría 0B — aislamiento SEO y TTFB', '',
              `Generado: ${report.generatedAt}`, '',
              `- Por encargo visibles en /catalogo: **${publicMap.size}**`,
              `- Cohorte sitemap: **${cohortIds.size}**`,
              `- Visibles fuera de cohorte: **${outside.length}**`,
              `- Visibles dentro de cohorte: **${insideVisible.length}**`,
              `- Páginas del catálogo por encargo: **${pages}**`,
              `- URLs inspeccionadas live: **${sample.length}**`, '',
              '| Segmento | Pass | Fallos | TTFB p50 | TTFB p95 | total p95 | CF cache |',
              '| --- | ---: | ---: | ---: | ---: | ---: | --- |',
            ];
            for (const [seg,s] of Object.entries(bySegment)) lines.push(`| ${seg} | ${s.pass}/${s.requested} | ${s.failures} | ${s.ttfbP50Ms} ms | ${s.ttfbP95Ms} ms | ${s.totalP95Ms} ms | ${Object.entries(s.cacheStatuses).map(([k,v])=>`${k}:${v}`).join(', ')} |`);
            lines.push('', '## Criterio', '', '- outside_cohort: HTTP 200 + canonical al mismo MLU + noindex live.', '- cohort/active: HTTP 200 + canonical al mismo MLU + sin noindex.', '');
            if (failures.length) {
              lines.push('## Fallos / excepciones', '');
              for (const r of failures) lines.push(`- ${r.id || r.input?.id || '?'} [${r.segment || r.input?.segment || '?'}]: ${r.error || `HTTP ${r.status}; robots=${r.metaRobots || r.xRobots || '(none)'}; canonical=${r.canonical || '(none)'}`}`);
            } else lines.push('## Resultado', '', '**0 fallos en la muestra live.**');
            fs.writeFileSync('artifacts/audit-0b/report-summary.md', lines.join('\n'));
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-0b-${{ github.run_id }}
          path: artifacts/audit-0b/
          if-no-files-found: error
          retention-days: 30

      - name: Comment issue 172
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s artifacts/audit-0b/report-summary.md ]; then
            gh issue comment 172 --repo "$GITHUB_REPOSITORY" --body-file artifacts/audit-0b/report-summary.md
          else
            gh issue comment 172 --repo "$GITHUB_REPOSITORY" --body "0B no generó resumen; revisar run $GITHUB_RUN_ID."
          fi
