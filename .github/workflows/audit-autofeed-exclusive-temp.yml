name: Audit AUTOFEED exclusive coverage temporary

on:
  push:
    branches:
      - agent/audit-autofeed-exclusive

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Authenticate Merchant API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/content
          create_credentials_file: false

      - name: Classify AUTOFEED-only offer IDs
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          mkdir -p artifacts/autofeed-exclusive
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { dedupeByGtinAndCondition, isBookProduct } from './functions/feed.xml.js';

          const TOKEN=process.env.TOKEN;
          const ACCOUNT='5330457716';
          const API='https://merchantapi.googleapis.com';
          const BASE='https://www.amadolibros.com';
          const RAW='https://pub-b2b408811ae24e3da04cda79c6ff084d.r2.dev/catalog.json';
          const parent=`accounts/${ACCOUNT}`;
          const UA='AmadoLibros-AutofeedExclusive/1.0';

          async function api(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${TOKEN}`,Accept:'application/json','user-agent':UA},signal:AbortSignal.timeout(60000)});const t=await r.text();const d=t?JSON.parse(t):{};if(!r.ok)throw new Error(d?.error?.message||`HTTP ${r.status}`);return d;}
          async function list(endpoint,field,size=1000){const out=[];let token='';for(let i=0;i<30;i++){const u=new URL(endpoint);u.searchParams.set('pageSize',String(size));if(token)u.searchParams.set('pageToken',token);const d=await api(u);if(Array.isArray(d[field]))out.push(...d[field]);token=String(d.nextPageToken||'');if(!token)return out;}throw new Error('paginación excedida');}
          function id(v){const s=String(v||'').trim().toUpperCase();return /^MLU\d+$/.test(s)?s:'';}
          function sourceBucket(source,byName){const m=byName.get(String(source||''))||{};const input=String(m.input||'').toUpperCase();const display=String(m.displayName||'').toUpperCase();if(input==='AUTOFEED'||display==='AMADOLIBROS.COM')return 'AUTOFEED';if(input==='FILE'||display.includes('PRODUCTS SOURCE 3'))return 'FILE';if(input==='API'||display.includes('CONTENT API'))return 'API';return 'OTHER';}
          function sitemapIds(xml){const s=new Set();for(const m of String(xml).matchAll(/\/libro\/(MLU\d+)\//gi))s.add(m[1].toUpperCase());return s;}
          function feedIds(xml){const s=new Set();for(const m of String(xml).matchAll(/<g:id>(MLU\d+)<\/g:id>/gi))s.add(m[1].toUpperCase());return s;}
          function rawEligibility(item){
            if(!item?.id||!item?.permalink)return 'missing_id_or_permalink';
            if(item.status!=='active')return 'not_active';
            if(!(Number(item.available_quantity)>0))return 'no_stock';
            if(!(Number(item.price)>0))return 'missing_or_invalid_price';
            const currency=String(item.currency||item.currency_id||'').trim().toUpperCase();
            if(currency!=='UYU')return 'currency_not_uyu_or_missing';
            if(!isBookProduct(item))return 'not_verified_book';
            return 'eligible_pre_dedupe';
          }
          function bump(map,key,id){if(!map[key])map[key]={count:0,examples:[]};map[key].count++;if(map[key].examples.length<12)map[key].examples.push(id);}

          const [sources,products,raw,activeXml,pausedXml,feedXml]=await Promise.all([
            list(`${API}/datasources/v1/${parent}/dataSources`,'dataSources',250),
            list(`${API}/products/v1/${parent}/products`,'products',1000),
            fetch(RAW,{headers:{'user-agent':UA}}).then(r=>r.json()),
            fetch(`${BASE}/sitemap-books-active.xml`,{headers:{'user-agent':UA}}).then(r=>r.text()),
            fetch(`${BASE}/sitemap-books-paused.xml`,{headers:{'user-agent':UA}}).then(r=>r.text()),
            fetch(`${BASE}/feed.xml`,{headers:{'user-agent':UA}}).then(r=>r.text()),
          ]);

          const sourceMeta=sources.map(s=>({name:String(s.name||''),input:String(s.input||''),displayName:String(s.displayName||'')}));const byName=new Map(sourceMeta.map(s=>[s.name,s]));
          const auto=new Set(), file=new Set();
          for(const p of products){const offer=id(p.offerId);if(!offer)continue;const b=sourceBucket(p.dataSource,byName);if(b==='AUTOFEED')auto.add(offer);else if(b==='FILE')file.add(offer);}
          const autoOnly=[...auto].filter(x=>!file.has(x)).sort();
          const rawItems=Array.isArray(raw.items)?raw.items:[];const rawMap=new Map(rawItems.map(x=>[id(x.id),x]).filter(([k])=>k));
          const paused=sitemapIds(pausedXml);const active=sitemapIds(activeXml);const liveFeed=feedIds(feedXml);
          const eligible=rawItems.filter(x=>rawEligibility(x)==='eligible_pre_dedupe');
          const representatives=new Set(dedupeByGtinAndCondition(eligible).map(x=>id(x.id)).filter(Boolean));

          const classes={}; const rows=[];
          for(const offer of autoOnly){
            const item=rawMap.get(offer);let classification='';
            if(!item){
              classification=paused.has(offer)?'by_request_cohort':'not_in_current_active_catalog';
            }else if(liveFeed.has(offer)){
              classification='already_in_live_file_processing_lag';
            }else{
              const reason=rawEligibility(item);
              if(reason!=='eligible_pre_dedupe')classification=reason;
              else if(!representatives.has(offer))classification='duplicate_gtin_condition';
              else classification='eligible_representative_not_in_live_file';
            }
            bump(classes,classification,offer);
            rows.push({offerId:offer,classification,rawActive:rawMap.has(offer),sitemapActive:active.has(offer),sitemapByRequest:paused.has(offer),liveFile:liveFeed.has(offer)});
          }
          const commercialCandidates=rows.filter(r=>['eligible_representative_not_in_live_file','already_in_live_file_processing_lag'].includes(r.classification));
          const report={generatedAt:new Date().toISOString(),merchant:{autofeed:auto.size,file:file.size,autoOnly:autoOnly.length,overlap:[...auto].filter(x=>file.has(x)).length},rawActive:rawMap.size,liveFeed:liveFeed.size,classes,commercialCandidateCount:commercialCandidates.length,rows};
          fs.writeFileSync('artifacts/autofeed-exclusive/report.json',JSON.stringify(report,null,2));
          const lines=['# AUTOFEED — clasificación de cobertura exclusiva','',`- AUTOFEED IDs: **${auto.size}**`,`- FILE IDs procesados: **${file.size}**`,`- AUTOFEED-only: **${autoOnly.length}**`,`- Candidatos que podrían representar cobertura comercial única: **${commercialCandidates.length}**`,'','## Clasificación AUTOFEED-only','', '| Clase | IDs | Ejemplos |','| --- | ---: | --- |'];
          for(const [key,value] of Object.entries(classes).sort((a,b)=>b[1].count-a[1].count))lines.push(`| ${key} | ${value.count} | ${value.examples.join(', ')} |`);
          lines.push('','## Lectura','', '- `duplicate_gtin_condition`: AUTOFEED reintroduce una publicación que FILE excluye deliberadamente porque otra oferta representa el mismo GTIN+condition.', '- `not_verified_book` / moneda / precio / stock: no cumplen el contrato comercial del FILE.', '- `by_request_cohort` o fuera del catálogo activo: no deben considerarse cobertura activa equivalente.', '- Sólo `eligible_representative_not_in_live_file` requiere investigar una posible pérdida comercial real antes de modificar AUTOFEED.');
          fs.writeFileSync('artifacts/autofeed-exclusive/report-summary.md',lines.join('\n'));
          NODE

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: autofeed-exclusive-${{ github.run_id }}
          path: artifacts/autofeed-exclusive/
          retention-days: 30

      - name: Comment issue 179
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 179 --repo "$GITHUB_REPOSITORY" --body-file artifacts/autofeed-exclusive/report-summary.md
