name: Audit demand 130 quality temporary

on:
  push:
    branches:
      - agent/audit-demand-130-quality

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Audit 130 demand pages
        run: |
          mkdir -p artifacts/demand-130
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { PAUSED_SEO_COHORT } from './functions/_shared/paused-seo-cohort.js';

          const BASE='https://www.amadolibros.com';
          const UA='AmadoLibros-Demand130/1.0';
          const demand=PAUSED_SEO_COHORT.filter(r=>r.source==='gsc-demand');
          const cohortById=new Map(demand.map(r=>[String(r.id).toUpperCase(),r]));

          function pct(a,b){ return b ? Math.round(a*1000/b)/10 : 0; }
          function sitemapMap(xml){
            const m=new Map();
            for(const x of String(xml).matchAll(/<loc>([^<]+)<\/loc>/gi)){
              const url=x[1].replaceAll('&amp;','&');
              const id=url.match(/\/libro\/(MLU\d+)\//i)?.[1]?.toUpperCase();
              if(id) m.set(id,url);
            }
            return m;
          }
          function parseJsonLd(html){
            const nodes=[];
            for(const m of String(html).matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)){
              try { nodes.push(JSON.parse(m[1])); } catch {}
            }
            return nodes;
          }
          function flatten(value,out=[]){
            if(!value || typeof value!=='object') return out;
            if(Array.isArray(value)){ for(const v of value) flatten(v,out); return out; }
            out.push(value);
            if(Array.isArray(value['@graph'])) for(const v of value['@graph']) flatten(v,out);
            return out;
          }
          function typeHas(node,type){ const t=node?.['@type']; return Array.isArray(t)?t.includes(type):t===type; }
          function nonEmpty(v){ if(Array.isArray(v)) return v.length>0; if(v && typeof v==='object') return Object.keys(v).length>0; return String(v??'').trim().length>0; }
          function val(node,...keys){ for(const k of keys) if(nonEmpty(node?.[k])) return node[k]; return null; }
          function metaDescription(html){ return String(html).match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']*)["']/i)?.[1] || String(html).match(/<meta[^>]+content=["']([^"']*)["'][^>]+name=["']description["']/i)?.[1] || ''; }
          async function inspect(row,url){
            try{
              const res=await fetch(url,{headers:{'user-agent':UA,'cache-control':'no-cache'},redirect:'follow',signal:AbortSignal.timeout(35000)});
              const html=await res.text();
              const nodes=parseJsonLd(html).flatMap(x=>flatten(x,[]));
              const book=nodes.find(n=>typeHas(n,'Book')) || {};
              const product=nodes.find(n=>typeHas(n,'Product')) || {};
              const title=val(book,'name','headline') || val(product,'name') || '';
              const author=val(book,'author');
              const isbn=val(book,'isbn') || val(product,'gtin13','gtin');
              const publisher=val(book,'publisher');
              const pages=val(book,'numberOfPages');
              const language=val(book,'inLanguage');
              const format=val(book,'bookFormat');
              const edition=val(book,'bookEdition');
              const published=val(book,'datePublished');
              const genre=val(book,'genre');
              const translator=val(book,'translator');
              const illustrator=val(book,'illustrator');
              const image=val(book,'image') || val(product,'image');
              const description=val(book,'description') || val(product,'description') || metaDescription(html);
              const fields={title,author,isbn,publisher,pages,language,format,edition,published,genre,translator,illustrator,image,description};
              const coreKeys=['title','author','isbn','image','description'];
              const enrichKeys=['publisher','pages','language','format','edition','published','genre'];
              const corePresent=coreKeys.filter(k=>nonEmpty(fields[k])).length;
              const enrichPresent=enrichKeys.filter(k=>nonEmpty(fields[k])).length;
              return {
                id:row.id,isbnCohort:row.isbn,impressions:Number(row.impressions)||0,clicks:Number(row.clicks)||0,
                url,resolvedUrl:res.url,status:res.status,
                corePresent,enrichPresent,
                missingCore:coreKeys.filter(k=>!nonEmpty(fields[k])),
                missingEnrichment:enrichKeys.filter(k=>!nonEmpty(fields[k])),
                fields:Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,nonEmpty(v)])),
                metaDescriptionChars:metaDescription(html).trim().length,
              };
            }catch(e){return {id:row.id,url,error:String(e?.message||e),impressions:Number(row.impressions)||0,clicks:Number(row.clicks)||0};}
          }
          async function mapLimit(rows,fn,n=8){ const out=new Array(rows.length);let c=0;async function w(){while(c<rows.length){const i=c++;out[i]=await fn(rows[i],i);}}await Promise.all(Array.from({length:Math.min(n,rows.length||1)},w));return out; }

          const sm=await fetch(`${BASE}/sitemap-books-paused.xml`,{headers:{'user-agent':UA}}).then(r=>r.text());
          const urls=sitemapMap(sm);
          const targets=demand.map(row=>({row,url:urls.get(String(row.id).toUpperCase()) || `${BASE}/libro/${row.id}/`}));
          const results=await mapLimit(targets,({row,url})=>inspect(row,url));
          const ok=results.filter(r=>!r.error && r.status===200);
          const countField=k=>ok.filter(r=>r.fields?.[k]).length;
          const fieldNames=['author','isbn','publisher','pages','language','format','edition','published','genre','image','description'];
          const coverage=Object.fromEntries(fieldNames.map(k=>[k,{count:countField(k),pct:pct(countField(k),ok.length)}]));
          const opportunities=[...ok].sort((a,b)=>{
            const missA=(5-a.corePresent)+(7-a.enrichPresent);
            const missB=(5-b.corePresent)+(7-b.enrichPresent);
            const demandA=a.impressions + 5*a.clicks;
            const demandB=b.impressions + 5*b.clicks;
            return (demandB*missB)-(demandA*missA) || b.impressions-a.impressions;
          }).slice(0,30);
          const summary={generatedAt:new Date().toISOString(),demandRows:demand.length,completed:ok.length,errors:results.filter(r=>r.error||r.status!==200).length,coverage,topOpportunities:opportunities};
          fs.writeFileSync('artifacts/demand-130/report.json',JSON.stringify({summary,results},null,2));
          const lines=['# SEO-DEMAND-130 — calidad bibliográfica live','',`- Filas gsc-demand: **${demand.length}**`,`- Fichas 200 inspeccionadas: **${ok.length}**`,`- Errores/no-200: **${summary.errors}**`,'','## Cobertura','', '| Campo | Con dato | Cobertura |','| --- | ---: | ---: |'];
          for(const k of fieldNames) lines.push(`| ${k} | ${coverage[k].count}/${ok.length} | ${coverage[k].pct}% |`);
          lines.push('','## Top 20 oportunidades por demanda × campos faltantes','', '| MLU | Imp. | Clics | Core | Enriq. | Faltantes |','| --- | ---: | ---: | ---: | ---: | --- |');
          for(const r of opportunities.slice(0,20)) lines.push(`| ${r.id} | ${r.impressions} | ${r.clicks} | ${r.corePresent}/5 | ${r.enrichPresent}/7 | ${[...r.missingCore,...r.missingEnrichment].join(', ')} |`);
          fs.writeFileSync('artifacts/demand-130/report-summary.md',lines.join('\n'));
          NODE

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: demand-130-${{ github.run_id }}
          path: artifacts/demand-130/
          retention-days: 30

      - name: Comment issue 174
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 174 --repo "$GITHUB_REPOSITORY" --body-file artifacts/demand-130/report-summary.md
