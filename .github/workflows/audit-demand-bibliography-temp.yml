name: Audit demand bibliography temporary

on:
  push:
    branches:
      - agent/audit-gsc-demand-bibliography

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verify 130 demand ISBNs across public sources
        env:
          OUT_DIR: artifacts/demand-bibliography
          CONCURRENCY: '4'
        run: node scripts/seo/audit-demand-bibliography.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: demand-bibliography-${{ github.run_id }}
          path: artifacts/demand-bibliography/
          retention-days: 30
      - name: Comment issue 182
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 182 --repo "$GITHUB_REPOSITORY" --body-file artifacts/demand-bibliography/summary.md
