name: Audit demand bibliography temporary

on:
  push:
    branches:
      - agent/audit-gsc-demand-bibliography

permissions:
  contents: write
  id-token: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Authenticate with Google Cloud for API enablement
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable Books API on analytics project
        run: gcloud services enable books.googleapis.com --project=amado-libros-analytics --quiet

      - name: Authenticate for Google Books
        id: books_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/books
          create_credentials_file: false

      - name: Verify 130 demand ISBNs across independent sources
        env:
          GOOGLE_BOOKS_ACCESS_TOKEN: ${{ steps.books_auth.outputs.access_token }}
          OUT_DIR: artifacts/demand-bibliography
          CONCURRENCY: '4'
        run: node scripts/seo/audit-demand-bibliography.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: demand-bibliography-${{ github.run_id }}
          path: artifacts/demand-bibliography/
          retention-days: 30
      - name: Persist verified candidate evidence on audit branch
        run: |
          mkdir -p audit-results
          cp artifacts/demand-bibliography/verified-candidates.json audit-results/demand-bibliography-verified.json
          cp artifacts/demand-bibliography/report.json audit-results/demand-bibliography-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/demand-bibliography-verified.json audit-results/demand-bibliography-report.json
          if git diff --cached --quiet; then
            echo 'No evidence changes to persist.'
          else
            git commit -m 'audit: persist demand bibliography evidence [skip ci]'
            git push
          fi
      - name: Comment summary and verified candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 182 --repo "$GITHUB_REPOSITORY" --body-file artifacts/demand-bibliography/summary.md
          {
            echo '## Verified candidates — exact ISBN, ≥2 sources';
            echo;
            echo '```json';
            cat artifacts/demand-bibliography/verified-candidates.json;
            echo;
            echo '```';
          } > /tmp/candidates.md
          gh issue comment 182 --repo "$GITHUB_REPOSITORY" --body-file /tmp/candidates.md
