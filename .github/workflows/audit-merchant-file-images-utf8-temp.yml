name: Audit Merchant FILE images UTF8 temporary

on:
  push:
    branches:
      - agent/audit-merchant-file-images-utf8

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Authenticate Merchant API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/content
          create_credentials_file: false

      - name: Diagnose FILE image endpoints and UTF8
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          mkdir -p artifacts/merchant-file-images-utf8
          node <<'NODE'
          const fs=require('node:fs');
          const API='https://merchantapi.googleapis.com';
          const ACCOUNT='5330457716';
          const TOKEN=process.env.TOKEN;
          const parent=`accounts/${ACCOUNT}`;
          const BASE='https://www.amadolibros.com';
          const UA='AmadoLibros-MerchantFileImageUTF8/1.0';
          const CODES=new Set(['image_too_small_for_high_resolution','image_link_internal_error_fallback','low_image_quality','image_link_pending_crawl','utf8_encoding_error']);

          async function api(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${TOKEN}`,Accept:'application/json','user-agent':UA},signal:AbortSignal.timeout(60000)});const t=await r.text();const d=t?JSON.parse(t):{};if(!r.ok)throw new Error(d?.error?.message||`HTTP ${r.status}`);return d;}
          async function list(endpoint,field,size=1000){const out=[];let token='';for(let i=0;i<30;i++){const u=new URL(endpoint);u.searchParams.set('pageSize',String(size));if(token)u.searchParams.set('pageToken',token);const d=await api(u);if(Array.isArray(d[field]))out.push(...d[field]);token=String(d.nextPageToken||'');if(!token)return out;}throw new Error('paginación excedida');}
          function id(v){const s=String(v||'').toUpperCase().trim();return /^MLU\d+$/.test(s)?s:'';}
          function uy(issue){const c=issue?.applicableCountries;return !Array.isArray(c)||!c.length||c.some(x=>String(x).toUpperCase()==='UY');}
          function sourceBucket(source,byName){const m=byName.get(String(source||''))||{};const input=String(m.input||'').toUpperCase();const display=String(m.displayName||'').toUpperCase();if(input==='FILE'||display.includes('PRODUCTS SOURCE 3'))return 'FILE';if(input==='AUTOFEED'||display==='AMADOLIBROS.COM')return 'AUTOFEED';return input||'OTHER';}

          function imageDimensions(buf){
            if(buf.length>=24 && buf.slice(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]))) return {format:'png',width:buf.readUInt32BE(16),height:buf.readUInt32BE(20)};
            if(buf.length>=10 && buf.slice(0,2).toString('ascii')==='BM') return {format:'bmp',width:buf.readUInt32LE(18),height:Math.abs(buf.readInt32LE(22))};
            if(buf.length>=10 && (buf.slice(0,6).toString('ascii')==='GIF87a'||buf.slice(0,6).toString('ascii')==='GIF89a')) return {format:'gif',width:buf.readUInt16LE(6),height:buf.readUInt16LE(8)};
            if(buf.length>=4 && buf[0]===0xff && buf[1]===0xd8){let i=2;while(i+9<buf.length){if(buf[i]!==0xff){i++;continue;}const marker=buf[i+1];if(marker===0xd8||marker===0xd9){i+=2;continue;}if(i+4>buf.length)break;const len=buf.readUInt16BE(i+2);if([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf].includes(marker) && i+8<buf.length){return {format:'jpeg',height:buf.readUInt16BE(i+5),width:buf.readUInt16BE(i+7)};}if(len<2)break;i+=2+len;}return {format:'jpeg',width:null,height:null};}
            if(buf.length>=30 && buf.slice(0,4).toString('ascii')==='RIFF' && buf.slice(8,12).toString('ascii')==='WEBP'){
              const kind=buf.slice(12,16).toString('ascii');
              if(kind==='VP8X' && buf.length>=30){const w=1+buf[24]+(buf[25]<<8)+(buf[26]<<16);const h=1+buf[27]+(buf[28]<<8)+(buf[29]<<16);return {format:'webp',width:w,height:h};}
              return {format:'webp',width:null,height:null};
            }
            return {format:'unknown',width:null,height:null};
          }
          async function mapLimit(rows,fn,n=10){const out=new Array(rows.length);let c=0;async function w(){while(c<rows.length){const i=c++;try{out[i]=await fn(rows[i]);}catch(e){out[i]={...rows[i],error:String(e?.message||e)};}}}await Promise.all(Array.from({length:Math.min(n,rows.length||1)},w));return out;}
          async function inspectImage(row){const url=`${BASE}/book-cover/${row.offerId}/cover.jpg`;const res=await fetch(url,{headers:{'user-agent':UA,'cache-control':'no-cache'},redirect:'follow',signal:AbortSignal.timeout(30000)});const buf=Buffer.from(await res.arrayBuffer());const dim=imageDimensions(buf);return {...row,url,status:res.status,contentType:res.headers.get('content-type')||'',bytes:buf.length,cfCacheStatus:res.headers.get('cf-cache-status')||'',...dim,minSide:Number.isFinite(dim.width)&&Number.isFinite(dim.height)?Math.min(dim.width,dim.height):null};}
          function xmlBadCodepoints(text){const bad=[];for(const ch of text){const cp=ch.codePointAt(0);const valid=cp===0x9||cp===0xA||cp===0xD||(cp>=0x20&&cp<=0xD7FF)||(cp>=0xE000&&cp<=0xFFFD)||(cp>=0x10000&&cp<=0x10FFFF);if(!valid||cp===0xFFFD||(cp&0xFFFF)===0xFFFE||(cp&0xFFFF)===0xFFFF)bad.push(`U+${cp.toString(16).toUpperCase().padStart(4,'0')}`);}return [...new Set(bad)];}

          (async()=>{
            const [sources,products,feedRes]=await Promise.all([
              list(`${API}/datasources/v1/${parent}/dataSources`,'dataSources',250),
              list(`${API}/products/v1/${parent}/products`,'products',1000),
              fetch(`${BASE}/feed.xml`,{headers:{'user-agent':UA}}),
            ]);
            const sourceMeta=sources.map(s=>({name:String(s.name||''),displayName:String(s.displayName||''),input:String(s.input||'')}));const byName=new Map(sourceMeta.map(s=>[s.name,s]));
            const affected=new Map();
            for(const p of products){const offerId=id(p.offerId);if(!offerId||sourceBucket(p.dataSource,byName)!=='FILE')continue;for(const issue of (p.productStatus?.itemLevelIssues||[])){const code=String(issue.code||'');if(!CODES.has(code)||!uy(issue))continue;if(!affected.has(offerId))affected.set(offerId,{offerId,codes:new Set()});affected.get(offerId).codes.add(code);}}
            const imageTargets=[...affected.values()].filter(r=>[...r.codes].some(c=>c.startsWith('image_')||c==='low_image_quality')).map(r=>({offerId:r.offerId,codes:[...r.codes].filter(c=>c!=='utf8_encoding_error')}));
            const imageRows=await mapLimit(imageTargets,inspectImage,10);
            const dimCounts={lt500:0,between500and1023:0,gte1024:0,unknown:0,httpError:0};
            for(const r of imageRows){if(r.status!==200){dimCounts.httpError++;continue;}if(!Number.isFinite(r.minSide)){dimCounts.unknown++;continue;}if(r.minSide<500)dimCounts.lt500++;else if(r.minSide<1024)dimCounts.between500and1023++;else dimCounts.gte1024++;}

            const feedBuf=Buffer.from(await feedRes.arrayBuffer());const feedText=new TextDecoder('utf-8',{fatal:false}).decode(feedBuf);const targetId='MLU617911511';const itemRe=new RegExp(`<item>[\\s\\S]*?<g:id>${targetId}<\\/g:id>[\\s\\S]*?<\\/item>`,'i');const segment=feedText.match(itemRe)?.[0]||'';const bad=xmlBadCodepoints(segment);const replacementCount=[...segment].filter(ch=>ch.codePointAt(0)===0xFFFD).length;
            const utf8={offerId:targetId,foundInLiveFeed:Boolean(segment),segmentLength:segment.length,badCodepoints:bad,replacementCount,hasXmlDeclaration:/encoding=["']UTF-8["']/i.test(feedText.slice(0,200)),contentType:feedRes.headers.get('content-type')||''};

            const report={generatedAt:new Date().toISOString(),fileAffectedOfferIds:affected.size,imageTargets:imageTargets.length,dimensionCounts:dimCounts,utf8,imageRows};fs.writeFileSync('artifacts/merchant-file-images-utf8/report.json',JSON.stringify(report,null,2));
            const lines=['# MERCHANT-IMAGE-UTF8 — diagnóstico FILE live','',`- Offer IDs FILE afectados por códigos objetivo: **${affected.size}**`,`- Portadas comprobadas: **${imageRows.length}**`,'', '## Dimensiones reales servidas por /book-cover','',`- lado corto <500: **${dimCounts.lt500}**`,`- 500–1023: **${dimCounts.between500and1023}**`,`- >=1024: **${dimCounts.gte1024}**`,`- dimensión no decodificada: **${dimCounts.unknown}**`,`- HTTP !=200: **${dimCounts.httpError}**`,'','## UTF-8 MLU617911511','',`- Presente en feed live: **${utf8.foundInLiveFeed}**`,`- XML declara UTF-8: **${utf8.hasXmlDeclaration}**`,`- caracteres U+FFFD: **${utf8.replacementCount}**`,`- codepoints XML inválidos detectados: **${utf8.badCodepoints.length?utf8.badCodepoints.join(', '):'ninguno'}**`,'','## Casos de imagen no 200 o <500',''];
            const problematic=imageRows.filter(r=>r.status!==200||(Number.isFinite(r.minSide)&&r.minSide<500));if(!problematic.length)lines.push('- Ninguno.');else for(const r of problematic.slice(0,50))lines.push(`- ${r.offerId}: HTTP ${r.status}; ${r.width||'?'}x${r.height||'?'}; ${r.bytes} bytes; códigos=${r.codes.join(',')}`);
            lines.push('','## Muestra 500–1023 (warning high-res)','');for(const r of imageRows.filter(r=>r.minSide>=500&&r.minSide<1024).slice(0,20))lines.push(`- ${r.offerId}: ${r.width}x${r.height}; ${r.bytes} bytes; códigos=${r.codes.join(',')}`);
            fs.writeFileSync('artifacts/merchant-file-images-utf8/report-summary.md',lines.join('\n'));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: merchant-file-images-utf8-${{ github.run_id }}
          path: artifacts/merchant-file-images-utf8/
          retention-days: 30

      - name: Comment issue 176
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 176 --repo "$GITHUB_REPOSITORY" --body-file artifacts/merchant-file-images-utf8/report-summary.md
