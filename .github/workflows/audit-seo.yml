name: Auditoria SEO externa manual (solo lectura)

# BRIEF-AUDITORIA-EXTERNA-25AGO2026, Bloque 2. Corre los scripts de
# scripts/audit/ (Bloque 1) contra produccion real y sube los reportes como
# artifact. Se mantiene manual mientras no exista una versión liviana para
# monitoreo frecuente: la primera corrida completa duró aproximadamente 94
# minutos. No escribe nada en el repo, no toca deploy.yml, no depende de
# ningún secreto de despliegue.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base a auditar'
        required: false
        default: 'https://www.amadolibros.com'

permissions:
  contents: read

concurrency:
  group: audit-seo
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # 180 min, no 30: se descubrió corriendo esta misma validación que
    # sitemap.xml combina activos + pausados + categorías + páginas, hoy más
    # de 10.000 URLs. 1.1 hace HEAD a cada una respetando el límite
    # del brief (concurrencia 5, 200 ms entre requests) — eso solo ya puede
    # superar los 30 min. No se sube la concurrencia ni se baja la pausa
    # para acelerarlo: es la salvaguarda de produccion que pide el brief,
    # no un parametro de performance a ajustar.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Fecha del reporte
        id: fecha
        run: echo "valor=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # No se usa `&&` entre pasos ni se detiene el job ante el primer fallo:
      # run-block1.mjs ya corre los seis puntos en secuencia y continua aunque
      # alguno falle (ver commit del Bloque 1) — el fallo de uno solo no debe
      # impedir que los reportes de los demas se generen y se suban.
      - name: Bloque 1 — diagnostico SEO
        id: bloque1
        continue-on-error: true
        env:
          AUDIT_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.amadolibros.com' }}
          SEO_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.amadolibros.com' }}
          AUDIT_DATE: ${{ steps.fecha.outputs.valor }}
          AUDIT_OUTPUT_DIR: reports/auditoria-${{ steps.fecha.outputs.valor }}
          SEO_OUTPUT_DATE: ${{ steps.fecha.outputs.valor }}
        run: node scripts/audit/run-block1.mjs

      - name: Listar reportes generados
        if: always()
        run: |
          echo "## Reportes — ${{ steps.fecha.outputs.valor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "reports/auditoria-${{ steps.fecha.outputs.valor }}" ]; then
            ls -la "reports/auditoria-${{ steps.fecha.outputs.valor }}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó ningún reporte — ver el log del paso anterior." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # if-no-files-found: warn (no error) — si run-block1.mjs falló ANTES de
      # escribir el primer archivo, el job igual debe cerrar con evidencia de
      # que corrió, no con un paso de upload rojo que oculte el log real.
      - name: Subir reportes como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-seo-${{ steps.fecha.outputs.valor }}
          path: reports/auditoria-${{ steps.fecha.outputs.valor }}/
          if-no-files-found: warn
          retention-days: 90

      - name: Fallar el job si el Bloque 1 falló
        if: steps.bloque1.outcome == 'failure'
        run: |
          echo "El Bloque 1 terminó con al menos un script fallido. Reportes disponibles como artifact igual." >&2
          exit 1
