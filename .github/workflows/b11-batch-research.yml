name: B11 lote — investigar y commitear evidencia bibliográfica

# Ejecuta la investigación real (Google Books, Open Library, BNE) para un
# lote de N ISBN todavía no enriquecidos y deja el resultado *commiteado en
# el repo* (no solo como artifact efímero), para que quede accesible desde
# cualquier sesión que sólo tenga salida de red hacia GitHub.
#
# No publica nada: sólo genera functions/_shared/book-enrichment-facts-*.js
# (mismo formato que los lotes de 1000/333 ISBN ya existentes) más la
# evidencia cruda (manifest + source-cache) para trazabilidad. El wiring al
# registry (functions/_shared/book-enrichment-registry.js) y la redacción
# de sinopsis donde corresponda se hacen en un commit separado, revisado.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Cantidad de ISBN nuevos a investigar en este lote
        required: true
        default: '200'
        type: string
      output_dir:
        description: Directorio donde queda la evidencia (manifest/cache)
        required: true
        default: artifacts/book-intelligence/lote-01
        type: string
      facts_output:
        description: Módulo final de hechos verificados a commitear
        required: true
        default: functions/_shared/book-enrichment-facts-lote-01.js
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: b11-batch-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-and-commit:
    name: Research batch and commit verified facts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIMIT: ${{ inputs.limit }}
      OUTPUT_DIR: ${{ inputs.output_dir }}
      FACTS_OUTPUT: ${{ inputs.facts_output }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Validate research pipeline without network
        run: |
          node --check scripts/seo/book-intelligence-research-run.mjs
          node --check scripts/seo/book-intelligence-project.mjs

      - name: Authenticate Google Books through Workload Identity
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/books
          create_credentials_file: false

      - name: Research N exact ISBN editions
        # Tope propio, más corto que el del job. Si el job entero agota su
        # timeout, GitHub lo cancela y los pasos `if: always()` NO corren, así
        # que la evidencia se perdería igual. Acotando el paso, la corrida
        # termina por las suyas y el commit del caché siempre ocurre.
        timeout-minutes: 70
        env:
          GOOGLE_BOOKS_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          OPEN_LIBRARY_CONTACT: https://www.amadolibros.com
          BOOK_INTELLIGENCE_LIMIT: ${{ env.LIMIT }}
          BOOK_INTELLIGENCE_CANDIDATE_LIMIT: '0'
          BOOK_INTELLIGENCE_OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
          # Caché COMPARTIDO entre lotes, no uno por lote: está indexado por
          # ISBN y es resumible, así que un lote nuevo no vuelve a pedir lo que
          # otro ya trajo. También hace barata una corrida perdida.
          BOOK_INTELLIGENCE_CACHE_PATH: artifacts/book-intelligence/b12-source-cache.json
          # Google Books agotó su cuota diaria en la corrida 34035961388:
          # 20 x HTTP 429 y el circuit breaker cortó los 1.474 pedidos
          # restantes. Se baja el presupuesto para no quemar la cuota de golpe
          # y se reparte entre lotes; las bibliotecas nacionales cubren de
          # sobra mientras tanto.
          GOOGLE_BOOKS_BUDGET: '400'
          GOOGLE_BOOKS_CONCURRENCY: '1'
          GOOGLE_BOOKS_DELAY_MS: '2000'
          GOOGLE_BOOKS_RETRY_ATTEMPTS: '4'
          BNE_BUDGET: '2276'
          BNE_CONCURRENCY: '3'
          BNE_DELAY_MS: '500'
          OPEN_LIBRARY_BUDGET: '2276'
          OPEN_LIBRARY_CONCURRENCY: '2'
          # Bibliotecas nacionales adicionales. Son la fuente OFICIAL que
          # desbloquea los ISBN con una sola familia de evidencia, así que
          # reciben presupuesto para todo el cohorte. La sonda 34031761113
          # midió LoC en ~120-300 ms y DNB en ~530-650 ms por consulta.
          # LoC dio 720 "fetch failed" y 73 HTTP 500 con concurrencia 3 y
          # 300 ms: el SRU del puerto 210 no aguanta ese ritmo. Se afloja.
          LOC_BUDGET: '7000'
          LOC_CONCURRENCY: '1'
          LOC_DELAY_MS: '900'
          DNB_BUDGET: '7000'
          DNB_CONCURRENCY: '2'
          DNB_DELAY_MS: '600'
        run: node scripts/seo/book-intelligence-research-run.mjs --limit "$LIMIT"

      - name: Project verified facts module
        run: |
          set -euo pipefail
          EXPECTED="$(node -e "console.log(require('./${OUTPUT_DIR}/isbn-1000-manifest.json').entries.length)")"
          echo "Entradas con evidencia suficiente: $EXPECTED / $LIMIT solicitados."
          echo "qualified_count=$EXPECTED" >> "$GITHUB_OUTPUT"
          # book-intelligence-project.mjs reescribe FACTS_OUTPUT desde cero con
          # solo las entradas de esta corrida. Si el archivo ya traía hechos de
          # una corrida anterior del mismo lote, se preservan aparte y se
          # fusionan después: cada corrida acumula, nunca pisa la anterior.
          PREVIOUS_FACTS=""
          if [ -f "$FACTS_OUTPUT" ]; then
            PREVIOUS_FACTS="$(mktemp)"
            cp "$FACTS_OUTPUT" "$PREVIOUS_FACTS"
          fi
          export PREVIOUS_FACTS
          node scripts/seo/book-intelligence-project.mjs \
            --manifest "$OUTPUT_DIR/isbn-1000-manifest.json" \
            --cache artifacts/book-intelligence/b12-source-cache.json \
            --output "$FACTS_OUTPUT" \
            --expected "$EXPECTED"
          if [ -n "$PREVIOUS_FACTS" ]; then
            node -e "
              const fs = require('node:fs');
              const path = require('node:path');
              (async () => {
                const projectMod = await import(path.resolve('scripts/seo/book-intelligence-project.mjs'));
                const previousUrl = 'file://' + path.resolve(process.env.PREVIOUS_FACTS);
                const currentUrl = 'file://' + path.resolve(process.env.FACTS_OUTPUT);
                const previous = (await import(previousUrl)).BOOK_FACT_ENRICHMENTS;
                const current = (await import(currentUrl)).BOOK_FACT_ENRICHMENTS;
                const currentIsbns = new Set(current.map(entry => entry.isbn));
                const carriedOver = previous.filter(entry => !currentIsbns.has(entry.isbn));
                const merged = [...carriedOver, ...current].sort((a, b) => a.isbn.localeCompare(b.isbn));
                fs.writeFileSync(process.env.FACTS_OUTPUT, projectMod.renderFactsModule(merged));
                console.log(\`Fusionadas \${carriedOver.length} entradas previas + \${current.length} nuevas = \${merged.length} totales.\`);
              })();
            "
          fi
        id: project

      - name: Sanity-check generated module has no commercial data
        run: |
          set -euo pipefail
          node --check "$FACTS_OUTPUT"
          if grep -Eq '"(price|available_quantity|total_stock|permalink|canonical|pictures|thumbnail|condition)"\s*:' "$FACTS_OUTPUT"; then
            echo "El módulo generado contiene datos comerciales prohibidos." >&2
            exit 1
          fi

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# B11 lote — investigación bibliográfica"
            echo
            echo "- Solicitados: $LIMIT"
            echo "- Con evidencia suficiente (publicables): ${{ steps.project.outputs.qualified_count || 'N/D' }}"
            echo
            if [ -f "$OUTPUT_DIR/report-summary.md" ]; then
              cat "$OUTPUT_DIR/report-summary.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # La evidencia se sube como artefacto ANTES de intentar el push: si el
      # push falla —por ejemplo porque alguien empujó a la rama mientras el
      # lote corría, que fue lo que pasó en la corrida 34039355129— la hora de
      # llamadas a las fuentes no se pierde y se puede recuperar.
      - name: Subir la evidencia como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b12-evidencia-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_DIR }}/
            artifacts/book-intelligence/b12-source-cache.json
            ${{ env.FACTS_OUTPUT }}
          if-no-files-found: warn
          retention-days: 30

      # `if: always()` a propósito: la corrida 34032150352 gastó 53 minutos de
      # llamadas a las fuentes y perdió TODO porque la proyección falló
      # después. La evidencia cruda es cara de obtener y el caché es
      # resumible, así que se commitea aunque el paso anterior falle.
      - name: Commit evidence and verified facts module
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_DIR"
          [ -f "$FACTS_OUTPUT" ] && git add "$FACTS_OUTPUT" || true
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
            exit 0
          fi
          COMMIT_MSG=$'b11(lote): investigacion real '"${LIMIT}"$' ISBN + hechos verificados\n\nGenera evidencia bibliografica (Google Books, Open Library, BNE) y el\nmodulo de hechos verificados para este lote. No modifica el registry ni\npublica nada; queda para wiring y redaccion en un commit revisado aparte.'
          git commit -m "$COMMIT_MSG"
          # Otro push a la misma rama durante la corrida dejaba el commit sin
          # publicar y tiraba la hora de investigación. Se reintenta sobre lo
          # que haya llegado en el medio.
          for intento in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Evidencia publicada en el intento $intento."
              exit 0
            fi
            echo "Push rechazado; reintegrando lo que llegó a la rama (intento $intento)."
            git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "No se pudo publicar la evidencia tras 3 intentos; queda en el artefacto de la corrida." >&2
          exit 1
