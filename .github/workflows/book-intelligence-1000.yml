name: FICHAS enrich 1000 ISBN

on:
  push:
    branches:
      - agent/fichas-enrichment-1000-isbn-1
    paths:
      - '.github/workflows/book-intelligence-1000.yml'
      - 'scripts/seo/book-intelligence-*.mjs'
      - 'functions/_shared/book-intelligence-evidence.js'
      - 'functions/_shared/book-enrichment-facts-*.js'
      - 'functions/_shared/book-enrichment-registry.js'
      - 'functions/__tests__/book-intelligence-*.test.js'
      - 'functions/__tests__/book-enrichment-*.test.js'
  pull_request:
    paths:
      - '.github/workflows/book-intelligence-1000.yml'
      - 'scripts/seo/book-intelligence-*.mjs'
      - 'functions/_shared/book-intelligence-evidence.js'
      - 'functions/_shared/book-enrichment-facts-*.js'
      - 'functions/_shared/book-enrichment-registry.js'
      - 'functions/__tests__/book-intelligence-*.test.js'
      - 'functions/__tests__/book-enrichment-*.test.js'
  workflow_dispatch:
    inputs:
      limit:
        description: ISBN unicos a investigar en esta corrida
        required: true
        default: '1000'
        type: string
      bne_budget:
        description: Consultas BNE con throttling
        required: true
        default: '4000'
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: fichas-enrichment-1000-${{ github.ref }}
  # Cada actualización del mismo PR invalida la corrida anterior. Mantenerla
  # viva sólo gastaría cuota sobre un SHA que ya no puede mergearse.
  cancel-in-progress: true

jobs:
  research:
    name: Investigate 1000 unique ISBN editions
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Detect completed 1000-ISBN publication
        id: published
        shell: bash
        run: |
          count="$(node --input-type=module - <<'NODE'
          import { BOOK_FACT_ENRICHMENTS } from './functions/_shared/book-enrichment-facts-1000.js';
          process.stdout.write(String(BOOK_FACT_ENRICHMENTS.length));
          NODE
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "1000" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate pipeline without network
        run: |
          node --check scripts/seo/book-intelligence-research-run.mjs
          node --check scripts/seo/book-intelligence-sources.mjs
          node --check scripts/seo/book-intelligence-bne.mjs
          node --test \
            functions/__tests__/book-intelligence-evidence.test.js \
            functions/__tests__/book-intelligence-sources.test.js \
            functions/__tests__/book-intelligence-bne.test.js \
            functions/__tests__/book-intelligence-research-run.test.js

      - name: Authenticate Google Books through Workload Identity
        if: steps.published.outputs.complete != 'true'
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/books
          create_credentials_file: false

      - name: Restore the latest resumable source cache
        if: steps.published.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p artifacts/book-intelligence/isbn-1000
          # Una corrida puede cerrar roja porque todavía no llegó a 1.000 y,
          # aun así, su caché es progreso válido. Restauramos la última
          # completada, no sólo la última verde.
          previous_run="$(gh run list \
            --workflow book-intelligence-1000.yml \
            --branch "$RESEARCH_BRANCH" \
            --status completed \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -n "$previous_run" ] && [ "$previous_run" != "${{ github.run_id }}" ]; then
            seed_dir="$(mktemp -d)"
            gh run download "$previous_run" \
              --pattern 'fichas-enrichment-1000-*' \
              --dir "$seed_dir"
            seed_cache="$(find "$seed_dir" -name source-cache.json -type f -print -quit)"
            if [ -n "$seed_cache" ]; then
              cp "$seed_cache" artifacts/book-intelligence/isbn-1000/source-cache.json
            fi
          fi

      - name: Execute resumable ISBN research
        if: steps.published.outputs.complete != 'true'
        id: research
        continue-on-error: true
        env:
          GOOGLE_BOOKS_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          OPEN_LIBRARY_CONTACT: https://www.amadolibros.com
          BOOK_INTELLIGENCE_LIMIT: ${{ inputs.limit || '1000' }}
          BOOK_INTELLIGENCE_CANDIDATE_LIMIT: '0'
          GOOGLE_BOOKS_BUDGET: '1000'
          GOOGLE_BOOKS_CONCURRENCY: '1'
          GOOGLE_BOOKS_DELAY_MS: '1100'
          GOOGLE_BOOKS_RETRY_ATTEMPTS: '2'
          BNE_BUDGET: ${{ inputs.bne_budget || '4000' }}
          BNE_CONCURRENCY: '2'
          BNE_DELAY_MS: '500'
          OPEN_LIBRARY_BUDGET: '4000'
          OPEN_LIBRARY_CONCURRENCY: '2'
          BOOK_INTELLIGENCE_OUTPUT_DIR: artifacts/book-intelligence/isbn-1000
          BOOK_INTELLIGENCE_CACHE_PATH: artifacts/book-intelligence/isbn-1000/source-cache.json
        run: node scripts/seo/book-intelligence-research-run.mjs --limit "$BOOK_INTELLIGENCE_LIMIT"

      - name: Validate the 1000-ISBN artifact
        if: steps.published.outputs.complete != 'true' && steps.research.outcome == 'success'
        env:
          EXPECTED_LIMIT: ${{ inputs.limit || '1000' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'artifacts/book-intelligence/isbn-1000/isbn-1000-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const expected = Number(process.env.EXPECTED_LIMIT || 1000);
          const entries = manifest.entries || [];
          const isbns = new Set(entries.map(entry => entry.isbn));
          const decisions = new Set(['GREEN_FULL', 'GREEN_FACTS', 'REVIEW', 'NO_EVIDENCE']);
          if (entries.length !== expected || isbns.size !== expected || !manifest.metrics?.target_reached) {
            throw new Error(`Meta no alcanzada: esperados ${expected} ISBN actualizados; recibidos ${entries.length}/${isbns.size}`);
          }
          if (entries.some(entry => !decisions.has(entry.decision) || !entry.facts || !Object.keys(entry.facts).length)) {
            throw new Error('El manifiesto contiene una decisión sin mejora factual.');
          }
          const forbidden = /"(?:price|available_quantity|stock|slug|canonical|pictures|thumbnail)"\s*:/;
          if (forbidden.test(JSON.stringify(manifest))) throw new Error('El manifiesto contiene datos comerciales prohibidos.');
          NODE

      - name: Upload report, manifest and resumable cache
        if: steps.published.outputs.complete != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: fichas-enrichment-1000-${{ github.run_id }}
          path: artifacts/book-intelligence/isbn-1000/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish summary
        if: steps.published.outputs.complete != 'true' && always()
        run: |
          if [ -f artifacts/book-intelligence/isbn-1000/report-summary.md ]; then
            cat artifacts/book-intelligence/isbn-1000/report-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No se genero el reporte de 1.000 ISBN.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if research did not complete
        if: steps.published.outputs.complete != 'true' && steps.research.outcome != 'success'
        run: exit 1

      - name: Validate published 1333-ISBN factual registry
        if: steps.published.outputs.complete == 'true'
        run: |
          node --test \
            functions/__tests__/book-enrichment-1000.test.js \
            functions/__tests__/book-enrichment-333.test.js \
            functions/__tests__/book-intelligence-coverage-audit.test.js

      - name: Measure complete active catalog coverage
        if: steps.published.outputs.complete == 'true'
        run: node scripts/seo/book-intelligence-coverage-audit.mjs
