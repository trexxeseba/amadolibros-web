name: Lo que pidieron clientes reales, listado por correo (solo lectura)

# Lee de D1 (solo lectura) los pedidos del formulario "Pedir un libro", los avisos de stock
# (solo el libro) y las búsquedas sin resultados, y le manda a Seba, por correo, el listado
# completo para estudiarlo. El repo es público: nada de esto se imprime en el log ni en el
# resumen del job.
#
# Sólo manual.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: busquedas-export
  cancel-in-progress: false

jobs:
  exportar:
    name: Exportar y mandar por correo
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Leer D1 y armar el listado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/busquedas-export.mjs

      - name: Mandar el correo
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_FROM: Amado Libros <web@notificaciones.amadolibros.com>
          REPORT_EMAIL_TO: undiaes@gmail.com
          REPORT_EMAIL_SUBJECT: Amado Libros — listado de lo que pidieron clientes reales
          REPORT_EMAIL_FILES: artifacts/busquedas/lo-que-pidieron-clientes.md
        run: node scripts/ops/send-report-email.mjs
