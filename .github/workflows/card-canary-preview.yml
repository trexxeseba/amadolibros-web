name: Ten-card WebP canary and active coverage - Preview only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/card-canary-preview.yml'
      - 'worker-sync/card-canary-preview*'
      - 'scripts/images/card-canary-preview-check.mjs'
permissions:
  contents: read
concurrency:
  group: card-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  canary:
    if: github.event.pull_request.number == 441 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci --prefix scripts/images --no-audit --no-fund
      - name: Deploy authenticated temporary Preview and perform read-only acceptance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INCIDENT_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKER_NAME: amado-cover-fix-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/card-canary
          INCIDENT_TOKEN=$(openssl rand -hex 32)
          export INCIDENT_TOKEN
          echo "::add-mask::$INCIDENT_TOKEN"
          cleanup() {
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
              > artifacts/card-canary/temporary-preview-cleanup.json
          }
          trap cleanup EXIT
          OUTPUT=$(bash scripts/deploy-cover-preview.sh --config worker-sync/card-canary-preview.wrangler.toml --var "INCIDENT_BUILD_SHA:$INCIDENT_BUILD_SHA")
          INCIDENT_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' | tail -1)
          test -n "$INCIDENT_URL"
          export INCIDENT_URL
          printf '%s' "$INCIDENT_TOKEN" | npx wrangler@3.114.17 secret put INCIDENT_TOKEN --config worker-sync/card-canary-preview.wrangler.toml --name "$WORKER_NAME"
          node scripts/images/card-canary-preview-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-canary-${{ github.run_id }}
          path: artifacts/card-canary/
          if-no-files-found: error
          retention-days: 30
