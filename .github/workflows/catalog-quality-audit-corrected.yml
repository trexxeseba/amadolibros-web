name: Catalog quality audit corrected

on:
  push:
    branches:
      - agent/catalog-quality-audit-1
    paths:
      - '.github/workflows/catalog-quality-audit-corrected.yml'

permissions:
  contents: write

jobs:
  audit-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-quality-audit-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Run corrected catalog quality audit
        env:
          SEO_OUTPUT_DATE: '2026-08-09-corrected'
          SEO_OUTPUT_DIR: artifacts/seo
        run: |
          node --check scripts/seo/catalog-quality-audit.mjs
          node scripts/seo/catalog-quality-audit.mjs
          git diff --check
      - name: Remove helper and push permanent audit script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/catalog-quality-audit-corrected.yml
          git commit -m 'SEO data: remove temporary corrected audit helper'
          git push origin HEAD:agent/catalog-quality-audit-1
