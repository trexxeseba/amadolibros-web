name: Check GSC BigQuery export temporary

on:
  push:
    branches:
      - agent/check-gsc-bigquery-export
    paths:
      - '.github/workflows/check-gsc-bigquery-export-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check Search Console BigQuery export readiness
        shell: bash
        run: |
          set -u
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT=/tmp/gsc-bq-check.txt
          exec > >(tee "$OUT") 2>&1

          echo '### DATASET'
          if ! bq show --project_id="$PROJECT" --format=prettyjson "$PROJECT:$DATASET"; then
            echo 'RESULT=NOT_READY_DATASET_MISSING'
            exit 0
          fi

          echo '### TABLES'
          bq ls --project_id="$PROJECT" --format=prettyjson "$PROJECT:$DATASET" || true

          echo '### PARTITIONS'
          bq query --project_id="$PROJECT" --use_legacy_sql=false --format=prettyjson \
            "SELECT table_name, SUM(total_rows) AS total_rows, MAX(partition_id) AS latest_partition FROM \`$PROJECT.$DATASET.INFORMATION_SCHEMA.PARTITIONS\` WHERE table_name IN ('ExportLog','searchdata_url_impression','searchdata_site_impression') GROUP BY table_name ORDER BY table_name" || true

          ready=0
          for t in ExportLog searchdata_url_impression searchdata_site_impression; do
            echo "### TABLE $t"
            if bq show --project_id="$PROJECT" --format=prettyjson "$PROJECT:$DATASET.$t" >/tmp/${t}.json 2>/tmp/${t}.err; then
              echo "EXISTS $t"
              if bq head --project_id="$PROJECT" -n 1 "$PROJECT:$DATASET.$t"; then
                if [[ "$t" == 'searchdata_url_impression' || "$t" == 'searchdata_site_impression' ]]; then
                  rows=$(bq query --project_id="$PROJECT" --use_legacy_sql=false --format=csv --headless "SELECT COUNT(1) FROM \`$PROJECT.$DATASET.$t\`" 2>/dev/null | tr -d '\r' | tail -n1)
                  echo "ROWCOUNT $t=$rows"
                  if [[ "$rows" =~ ^[1-9][0-9]*$ ]]; then ready=1; fi
                fi
              fi
            else
              echo "MISSING $t"
              cat /tmp/${t}.err || true
            fi
          done

          if [[ "$ready" == '1' ]]; then
            echo 'RESULT=READY'
          else
            echo 'RESULT=NOT_READY_NO_IMPRESSION_ROWS'
          fi
      - name: Report check to tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## GSC BigQuery readiness check'; echo; echo '```'; tail -n 120 /tmp/gsc-bq-check.txt 2>/dev/null || echo 'check output unavailable'; echo '```'; } >/tmp/gsc-comment.md
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-comment.md
