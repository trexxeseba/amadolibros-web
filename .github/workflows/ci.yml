name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate:
    name: Syntax & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      # Diagnóstico temporal de HOME-V2: cada contrato modificado corre en un
      # paso nombrado para identificar con precisión cualquier expectativa
      # obsoleta. Se retira antes de considerar el PR listo.
      - name: Diagnose — home commercial fold
        run: node --experimental-sqlite --test functions/__tests__/home-commercial-fold.test.js

      - name: Diagnose — manual book discovery
        if: always()
        run: node --experimental-sqlite --test functions/__tests__/manual-book-discovery.test.js

      - name: Diagnose — SEO commercial intents
        if: always()
        run: node --experimental-sqlite --test functions/__tests__/seo-commercial-intents.test.js

      - name: Diagnose — SEO AI quick wins
        if: always()
        run: node --experimental-sqlite --test functions/__tests__/seo-ai-quick-wins.test.js

      - name: Diagnose — delivery coordination
        if: always()
        run: node --experimental-sqlite --test functions/__tests__/delivery-coordination.test.js

      - name: Diagnose — V2 editorial assets
        if: always()
        run: node --experimental-sqlite --test functions/__tests__/home-v2-editorial-assets.test.js

      - name: Validate (shared script — syntax, tests, both checkout builds)
        if: always()
        run: bash scripts/validate-ci.sh

      - name: Check pull request diff
        if: always() && github.event_name == 'pull_request'
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Confirm tracked files remain unchanged
        if: always()
        run: git diff --exit-code
