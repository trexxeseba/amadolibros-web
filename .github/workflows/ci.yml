name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate:
    name: Syntax & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      # Diagnóstico temporal de HOME-V2. El fallo ya quedó acotado a D–F;
      # esta pasada identifica la letra exacta. Se elimina al terminar.
      - name: Diagnose unit tests D
        run: |
          mapfile -t files < <(find functions/__tests__ -maxdepth 1 -type f -name '[dD]*.test.js' | sort)
          printf 'Running %s files\n' "${#files[@]}"
          ((${#files[@]} == 0)) || node --experimental-sqlite --test "${files[@]}"

      - name: Diagnose unit tests E
        if: always()
        run: |
          mapfile -t files < <(find functions/__tests__ -maxdepth 1 -type f -name '[eE]*.test.js' | sort)
          printf 'Running %s files\n' "${#files[@]}"
          ((${#files[@]} == 0)) || node --experimental-sqlite --test "${files[@]}"

      - name: Diagnose unit tests F
        if: always()
        run: |
          mapfile -t files < <(find functions/__tests__ -maxdepth 1 -type f -name '[fF]*.test.js' | sort)
          printf 'Running %s files\n' "${#files[@]}"
          ((${#files[@]} == 0)) || node --experimental-sqlite --test "${files[@]}"

      - name: Validate (shared script — syntax, tests, both checkout builds)
        if: always()
        run: bash scripts/validate-ci.sh

      - name: Check pull request diff
        if: always() && github.event_name == 'pull_request'
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Confirm tracked files remain unchanged
        if: always()
        run: git diff --exit-code
