name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate:
    name: Syntax & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      # Diagnóstico temporal de HOME-V2. La primera división ubicó el fallo en
      # A–F; esta segunda pasada lo reduce a A–C o D–F. Se elimina al terminar.
      - name: Diagnose unit tests A–C
        run: |
          mapfile -t files < <(find functions/__tests__ -maxdepth 1 -type f -name '*.test.js' -printf '%f\n' | sort | awk 'tolower(substr($0,1,1)) >= "a" && tolower(substr($0,1,1)) <= "c" { print "functions/__tests__/" $0 }')
          printf 'Running %s files\n' "${#files[@]}"
          ((${#files[@]} == 0)) || node --experimental-sqlite --test "${files[@]}"

      - name: Diagnose unit tests D–F
        if: always()
        run: |
          mapfile -t files < <(find functions/__tests__ -maxdepth 1 -type f -name '*.test.js' -printf '%f\n' | sort | awk 'tolower(substr($0,1,1)) >= "d" && tolower(substr($0,1,1)) <= "f" { print "functions/__tests__/" $0 }')
          printf 'Running %s files\n' "${#files[@]}"
          ((${#files[@]} == 0)) || node --experimental-sqlite --test "${files[@]}"

      - name: Validate (shared script — syntax, tests, both checkout builds)
        if: always()
        run: bash scripts/validate-ci.sh

      - name: Check pull request diff
        if: always() && github.event_name == 'pull_request'
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Confirm tracked files remain unchanged
        if: always()
        run: git diff --exit-code
