name: Authorized image cost containment
on:
  push:
    branches: [codex/r2-card-inventory-29c5dce]
    paths: ['.github/workflows/cloudflare-image-containment.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-image-containment
  cancel-in-progress: false
jobs:
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Inspect existing redirect configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CONTAINMENT_MODE: inspect
          CF_USAGE_OUTPUT: ${{ runner.temp }}/cf-containment.encrypted.json
        run: node scripts/images/cf-image-containment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-containment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cf-containment.encrypted.json
          if-no-files-found: error
          retention-days: 1
