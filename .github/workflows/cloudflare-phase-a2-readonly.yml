name: Cloudflare requested follow-up evidence - read only
# Use the verified AccountWorkersInvocationsAdaptive schema node.
on:
  push:
    branches: [codex/r2-card-inventory-29c5dce]
    paths: ['.github/workflows/cloudflare-phase-a2-readonly.yml']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: card-readiness-39045624433
          run-id: 39045624433
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/readiness
      - name: Read metrics and decrypt existing verified index without R2 writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CARD_READINESS_ARTIFACT: ${{ runner.temp }}/readiness
          CF_USAGE_OUTPUT: ${{ runner.temp }}/phase-a2.encrypted.json
        run: node scripts/images/cf-phase-a2-readonly.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-phase-a2-${{ github.run_id }}
          path: ${{ runner.temp }}/phase-a2.encrypted.json
          if-no-files-found: error
          retention-days: 1
