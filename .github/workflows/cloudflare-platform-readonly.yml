name: Cloudflare platform assessment - read only
on:
  push:
    branches: [codex/r2-card-inventory-29c5dce]
    paths: ['.github/workflows/cloudflare-platform-readonly.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Read platform configuration without secrets or content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CF_USAGE_OUTPUT: ${{ runner.temp }}/cf-platform.encrypted.json
        run: node scripts/images/cf-platform-assessment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-platform-${{ github.run_id }}
          path: ${{ runner.temp }}/cf-platform.encrypted.json
          if-no-files-found: error
          retention-days: 1
