name: Cloudflare usage and billing - read only encrypted report
on:
  push:
    branches: [codex/r2-card-inventory-29c5dce]
    paths: ['.github/workflows/cloudflare-usage-readonly.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Read documented billing endpoints without mutations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_USAGE_OUTPUT: ${{ runner.temp }}/cf-usage.encrypted.json
        run: node scripts/images/cf-usage-readonly.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-usage-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/cf-usage.encrypted.json
          if-no-files-found: error
          retention-days: 1
