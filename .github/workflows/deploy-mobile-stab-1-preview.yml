name: Deploy MOBILE-STAB-1 Preview

on:
  push:
    branches:
      - agent/mobile-stab-1-deploy-preview

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Build Preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_CHECKOUT_ENABLED: 'false'
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify MOBILE-STAB-1 and Preview safeguards
        run: |
          test -f astro-front/dist/index.html
          grep -q "noindex, nofollow" astro-front/dist/index.html
          test -f astro-front/dist/images/logo-amado.webp
          grep -q 'src="/images/logo-amado.webp"' 'functions/libro/[[path]].js'
          grep -q '@media(max-width:499px)' functions/catalogo.js
          grep -q '@media(min-width:500px)' functions/catalogo.js
          grep -q 'overflow-x:hidden' functions/catalogo.js

      - name: Deploy isolated Cloudflare Preview
        run: >
          npx wrangler@3.114.17 pages deploy ./astro-front/dist
          --project-name amadolibros-web
          --branch mobile-stab-1-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
