name: Deploy PERF-H1 Preview

on:
  push:
    branches:
      - agent/perf-h1-deploy-preview

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Build Preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify Preview safeguards
        run: |
          test -f astro-front/dist/index.html
          grep -q "noindex, nofollow" astro-front/dist/index.html
          ! grep -q "fonts.bunny.net" astro-front/dist/index.html
          grep -q "playfair-display" astro-front/dist/index.html
          test -f astro-front/dist/images/logo-amado-header.webp

      - name: Deploy isolated Cloudflare Preview
        run: >
          npx wrangler@3.114.17 pages deploy ./astro-front/dist
          --project-name amadolibros-web
          --branch perf-h1-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
