name: Deploy and audit every PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Install Astro dependencies
        working-directory: astro-front
        run: npm ci --no-audit --no-fund

      - name: Build protected Preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_GA_ID: ''
          PUBLIC_CHECKOUT_ENABLED: 'false'
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAD6E9kz8K3comwjj'
          PUBLIC_TURNSTILE_ALLOWED_HOSTS: '.amadolibros-web.pages.dev'
        run: npm run build

      - name: Deploy isolated PR Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          OUTPUT=$(npx wrangler@3.114.17 pages deploy ./astro-front/dist \
            --project-name amadolibros-web --branch "$PREVIEW_BRANCH")
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "ERROR: Wrangler no devolvió URL de Preview."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for Preview propagation
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            HOME_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PREVIEW_URL/")
            FEED_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PREVIEW_URL/feed.xml")
            [ "$HOME_CODE" = "200" ] && [ "$FEED_CODE" = "200" ] && exit 0
            echo "Preview propagándose: intento $attempt/8, home HTTP $HOME_CODE, feed HTTP $FEED_CODE."
            sleep 10
          done
          exit 1

      - name: Audit protected Preview
        env:
          COMMERCE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          COMMERCE_OUTPUT_DIR: artifacts/commerce-preview
          COMMERCE_IMAGE_LIMIT: '80'
          COMMERCE_PAGE_LIMIT: '80'
          COMMERCE_CONCURRENCY: '10'
          COMMERCE_EXPECT_INDEXABLE: 'false'
          COMMERCE_FAIL_ON_CRITICAL: 'true'
        run: node scripts/commerce/full-commerce-audit.mjs

      - name: Audit showcase product samples
        env:
          SHOWCASE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SHOWCASE_EXPECT_INDEXABLE: 'false'
          SHOWCASE_OUTPUT_DIR: artifacts/showcase-preview
          SHOWCASE_CONCURRENCY: '5'
        run: node scripts/seo/showcase-live-audit.mjs

      # FICHAS-QUALITY-GUARD-1: comprobación HTTP real contra el Preview.
      # Los tests corren en memoria; esto mira lo que el servidor devuelve.
      - name: Check generic author on ficha and feed
        env:
          FICHAS_CHECK_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          FICHAS_CHECK_OUTPUT_DIR: artifacts/fichas-quality
        run: node scripts/seo/fichas-generic-author-live-check.mjs

      # FICHAS-ENRICHMENT-BIBLIAS-1: cada ISBN versionado debe aparecer de
      # verdad en su ficha y en Merchant; no alcanza con un test en memoria.
      - name: Verify ISBN enrichments on ficha and Merchant
        env:
          BOOK_ENRICHMENT_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          BOOK_ENRICHMENT_OUTPUT_DIR: artifacts/fichas-quality
        run: node scripts/seo/book-enrichment-live-check.mjs

      # Auditoría de la cohorte real de fichas enriquecidas. El runner sí
      # alcanza R2, a diferencia del entorno de desarrollo.
      - name: Audit fichas quality cohort
        env:
          FICHAS_AUDIT_OUTPUT_DIR: artifacts/fichas-quality
          FICHAS_AUDIT_SAMPLE: '30'
        run: node scripts/seo/fichas-quality-audit.mjs

      - name: Audit by-request hub link graph
        env:
          SEO_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SEO_EXPECT_INDEXABLE: 'false'
          SEO_OUTPUT_DIR: artifacts/seo-order-hub-preview
          SEO_CONCURRENCY: '8'
        run: node scripts/seo/order-hub-live-audit.mjs

      # RADAR AMADO PR1: prueba real y deliberadamente read-only. Usa sólo
      # catalog.json productivo público; no toca D1, KV, secretos ni ML auth.
      - name: Run RADAR against real production catalog (read-only)
        env:
          RADAR_CATALOG_URL: 'https://pub-b2b408811ae24e3da04cda79c6ff084d.r2.dev/catalog.json'
          RADAR_LIVE_OUTPUT: 'artifacts/radar-live-readonly.json'
        run: node scripts/ops/radar-live-readonly.mjs

      - name: Upload RADAR live read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-live-readonly-pr-${{ github.event.pull_request.number }}
          path: artifacts/radar-live-readonly.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload fichas quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fichas-quality-pr-${{ github.event.pull_request.number }}
          path: artifacts/fichas-quality/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-preview-pr-${{ github.event.pull_request.number }}
          path: artifacts/commerce-preview/
          if-no-files-found: error
          retention-days: 30

      - name: Upload showcase report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-preview-pr-${{ github.event.pull_request.number }}
          path: artifacts/showcase-preview/
          if-no-files-found: error
          retention-days: 30

      - name: Upload by-request SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-hub-seo-preview-pr-${{ github.event.pull_request.number }}
          path: artifacts/seo-order-hub-preview/
          if-no-files-found: error
          retention-days: 30
