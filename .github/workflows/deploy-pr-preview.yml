name: Deploy and audit every PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Install Astro dependencies
        working-directory: astro-front
        run: npm ci --no-audit --no-fund

      - name: Build protected Preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_GA_ID: ''
          PUBLIC_CHECKOUT_ENABLED: 'false'
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAD6E9kz8K3comwjj'
          PUBLIC_TURNSTILE_ALLOWED_HOSTS: '.amadolibros-web.pages.dev'
        run: npm run build

      - name: Deploy isolated PR Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          OUTPUT=$(npx wrangler@3.114.17 pages deploy ./astro-front/dist \
            --project-name amadolibros-web --branch "$PREVIEW_BRANCH")
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "ERROR: Wrangler no devolvió URL de Preview."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for Preview propagation
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            HOME_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PREVIEW_URL/")
            FEED_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PREVIEW_URL/feed.xml")
            [ "$HOME_CODE" = "200" ] && [ "$FEED_CODE" = "200" ] && exit 0
            echo "Preview propagándose: intento $attempt/8, home HTTP $HOME_CODE, feed HTTP $FEED_CODE."
            sleep 10
          done
          exit 1

      # TEMPORAL para #215: medición reproducible desde el mismo runner.
      # Se revierte después de capturar el gate para no dejar una auditoría
      # específica de Tarot ejecutándose en todos los PR futuros.
      - name: TAROT-FINDER-UX-2 performance gate
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PRODUCTION_URL: https://www.amadolibros.com
        run: |
          set -euo pipefail
          PATHNAME='/libros/esoterismo-tarot'

          echo '## TAROT-FINDER-UX-2 performance gate' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '> Mismo runner, mismas cabeceras y 5 muestras por entorno. TTFB = mediana de time_starttransfer.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Entorno | HTTP | HTML raw | HTML gzip transfer | TTFB mediana | Content-Encoding |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---:|---:|---:|---|' >> "$GITHUB_STEP_SUMMARY"

          measure_page() {
            base="$1"
            prefix="$2"

            raw_body="/tmp/${prefix}.raw"
            raw_headers="/tmp/${prefix}.raw.headers"
            gzip_body="/tmp/${prefix}.gzip"
            gzip_headers="/tmp/${prefix}.gzip.headers"
            ttfb_file="/tmp/${prefix}.ttfb"

            raw_metrics=$(curl -sS -L --raw --max-time 60 \
              -H 'Accept-Encoding: identity' \
              -D "$raw_headers" -o "$raw_body" \
              -w '%{http_code}|%{time_starttransfer}|%{time_total}' \
              "$base$PATHNAME")
            IFS='|' read -r http _raw_ttfb _raw_total <<< "$raw_metrics"
            [ "$http" = '200' ]

            gzip_metrics=$(curl -sS -L --raw --max-time 60 \
              -H 'Accept-Encoding: gzip' \
              -D "$gzip_headers" -o "$gzip_body" \
              -w '%{http_code}|%{time_starttransfer}|%{time_total}' \
              "$base$PATHNAME")
            IFS='|' read -r gzip_http _gzip_ttfb _gzip_total <<< "$gzip_metrics"
            [ "$gzip_http" = '200' ]

            : > "$ttfb_file"
            for i in 1 2 3 4 5; do
              curl -sS -L --max-time 60 -o /dev/null \
                -H 'Accept-Encoding: gzip' \
                -w '%{time_starttransfer}\n' "$base$PATHNAME" >> "$ttfb_file"
            done

            raw_bytes=$(wc -c < "$raw_body" | tr -d ' ')
            gzip_bytes=$(wc -c < "$gzip_body" | tr -d ' ')
            median=$(sort -n "$ttfb_file" | sed -n '3p')
            encoding=$(tr -d '\r' < "$gzip_headers" | sed -n 's/^content-encoding:[[:space:]]*//Ip' | tail -1)
            [ -n "$encoding" ] || encoding='none'

            eval "${prefix}_HTTP='$http'"
            eval "${prefix}_RAW='$raw_bytes'"
            eval "${prefix}_GZIP='$gzip_bytes'"
            eval "${prefix}_TTFB='$median'"
            eval "${prefix}_ENC='$encoding'"

            echo "${prefix}: http=$http raw=$raw_bytes gzip=$gzip_bytes median_ttfb=${median}s encoding=$encoding"
            echo "| $prefix | $http | $raw_bytes B | $gzip_bytes B | ${median}s | $encoding |" >> "$GITHUB_STEP_SUMMARY"
          }

          measure_page "$PRODUCTION_URL" PROD
          measure_page "$PREVIEW_URL" PREVIEW

          DELTA=$((PREVIEW_GZIP - PROD_GZIP))
          PCT=$(awk -v p="$PREVIEW_GZIP" -v b="$PROD_GZIP" 'BEGIN { if (b == 0) print "nan"; else printf "%.1f", ((p-b)/b)*100 }')
          echo "gzip_delta_bytes=$DELTA gzip_delta_pct=$PCT"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "**Delta Preview vs Producción (gzip): ${DELTA} B (${PCT}%).**" >> "$GITHUB_STEP_SUMMARY"

          if grep -Fq 'tarot-finder-fallback-dataset' /tmp/PREVIEW.raw; then
            echo 'ERROR: el dataset pausado sigue embebido en el HTML inicial.'
            exit 1
          fi
          echo 'OK: 0 tarot-finder-fallback-dataset en HTML inicial.'

          # Red real de una visita normal: Chrome carga y ejecuta la página,
          # sin interacción. El endpoint lazy no debe aparecer en el netlog.
          if command -v google-chrome >/dev/null 2>&1; then
            rm -f /tmp/tarot-netlog.json /tmp/tarot-dom.html
            timeout 60s google-chrome --headless=new --no-sandbox --disable-gpu \
              --log-net-log=/tmp/tarot-netlog.json --net-log-capture-mode=Everything \
              --dump-dom "$PREVIEW_URL$PATHNAME" > /tmp/tarot-dom.html 2>/tmp/tarot-chrome.log || true
            if [ -s /tmp/tarot-netlog.json ] && grep -Fq '/api/tarot-finder-alternatives' /tmp/tarot-netlog.json; then
              echo 'ERROR: una visita normal disparó /api/tarot-finder-alternatives.'
              exit 1
            fi
            if [ -s /tmp/tarot-netlog.json ]; then
              echo 'OK: netlog Chrome = 0 requests al endpoint lazy durante visita normal.'
            else
              echo 'WARN: Chrome no produjo netlog; se conserva la verificación estructural/test de cliente.'
            fi
          else
            echo 'WARN: google-chrome no disponible; se conserva la verificación estructural/test de cliente.'
          fi

          ENDPOINT="$PREVIEW_URL/api/tarot-finder-alternatives?system=tarot&deckFamily=thoth&language=espanol&guide=si"
          EP_BODY=/tmp/tarot-endpoint.json
          EP_GZIP=/tmp/tarot-endpoint.gzip
          EP_HEADERS=/tmp/tarot-endpoint.headers
          EP_HEADERS2=/tmp/tarot-endpoint-2.headers
          EP_TTFB=/tmp/tarot-endpoint.ttfb

          curl -sS --max-time 60 --raw -H 'Accept-Encoding: identity' -D "$EP_HEADERS" -o "$EP_BODY" "$ENDPOINT"
          curl -sS --max-time 60 --raw -H 'Accept-Encoding: gzip' -o "$EP_GZIP" "$ENDPOINT"
          curl -sS --max-time 60 --raw -H 'Accept-Encoding: identity' -D "$EP_HEADERS2" -o /dev/null "$ENDPOINT"

          : > "$EP_TTFB"
          for i in 1 2 3 4 5; do
            curl -sS --max-time 60 -o /dev/null -w '%{time_starttransfer}\n' "$ENDPOINT" >> "$EP_TTFB"
          done

          EP_RAW_BYTES=$(wc -c < "$EP_BODY" | tr -d ' ')
          EP_GZIP_BYTES=$(wc -c < "$EP_GZIP" | tr -d ' ')
          EP_MEDIAN=$(sort -n "$EP_TTFB" | sed -n '3p')
          EP_CACHE=$(tr -d '\r' < "$EP_HEADERS2" | sed -n 's/^cache-control:[[:space:]]*//Ip' | tail -1)
          EP_ROBOTS=$(tr -d '\r' < "$EP_HEADERS2" | sed -n 's/^x-robots-tag:[[:space:]]*//Ip' | tail -1)
          EP_CF=$(tr -d '\r' < "$EP_HEADERS2" | sed -n 's/^cf-cache-status:[[:space:]]*//Ip' | tail -1)
          EP_AGE=$(tr -d '\r' < "$EP_HEADERS2" | sed -n 's/^age:[[:space:]]*//Ip' | tail -1)
          [ -n "$EP_CF" ] || EP_CF='ausente'
          [ -n "$EP_AGE" ] || EP_AGE='ausente'

          EP_COUNT=$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const c=Array.isArray(j.candidates)?j.candidates:[]; if(c.length>3) process.exit(2); for(const x of c){if(x.price!==null||x.stock!==null||x.status!=="paused") process.exit(3)}; process.stdout.write(String(c.length));' "$EP_BODY")
          [ "$EP_ROBOTS" = 'noindex, nofollow' ]
          echo "$EP_CACHE" | grep -Fq 'public'

          echo "endpoint_candidates=$EP_COUNT raw=$EP_RAW_BYTES gzip=$EP_GZIP_BYTES median_ttfb=${EP_MEDIAN}s cache='$EP_CACHE' robots='$EP_ROBOTS' cf_cache_status='$EP_CF' age='$EP_AGE'"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Endpoint lazy | Valor |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo "| candidatos | $EP_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| JSON raw | $EP_RAW_BYTES B |" >> "$GITHUB_STEP_SUMMARY"
          echo "| transfer gzip | $EP_GZIP_BYTES B |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TTFB mediana (5) | ${EP_MEDIAN}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cache-Control | \`$EP_CACHE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| X-Robots-Tag | \`$EP_ROBOTS\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CF-Cache-Status (2º request) | \`$EP_CF\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Age (2º request) | \`$EP_AGE\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Audit protected Preview
        env:
          COMMERCE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          COMMERCE_OUTPUT_DIR: artifacts/commerce-preview
          COMMERCE_IMAGE_LIMIT: '80'
          COMMERCE_PAGE_LIMIT: '80'
          COMMERCE_CONCURRENCY: '10'
          COMMERCE_EXPECT_INDEXABLE: 'false'
          COMMERCE_FAIL_ON_CRITICAL: 'true'
        run: node scripts/commerce/full-commerce-audit.mjs

      - name: Audit showcase product samples
        env:
          SHOWCASE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SHOWCASE_EXPECT_INDEXABLE: 'false'
          SHOWCASE_OUTPUT_DIR: artifacts/showcase-preview
          SHOWCASE_CONCURRENCY: '5'
        run: node scripts/seo/showcase-live-audit.mjs

      - name: Audit by-request hub link graph
        env:
          SEO_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SEO_EXPECT_INDEXABLE: 'false'
          SEO_OUTPUT_DIR: artifacts/seo-order-hub-preview
          SEO_CONCURRENCY: '8'
        run: node scripts/seo/order-hub-live-audit.mjs

      - name: Upload Preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-preview-pr-${{ github.event.pull_request.number }}
          path: artifacts/commerce-preview/
          if-no-files-found: error
          retention-days: 30

      - name: Upload showcase report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-preview-pr-${{ github.event.pull_request.number }}
          path: artifacts/showcase-preview/
          if-no-files-found: error
          retention-days: 30

      - name: Upload by-request SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-hub-seo-preview-pr-${{ github.event.pull_request.number }}
          path: artifacts/seo-order-hub-preview/
          if-no-files-found: error
          retention-days: 30
