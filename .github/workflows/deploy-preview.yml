name: Deploy PR21 WhatsApp Preview

on:
  push:
    branches: [preview/pr21-cierre-whatsapp]

permissions:
  contents: read

concurrency:
  group: preview-pr21-cierre-whatsapp
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Generate home.json
        run: node scripts/generate-home-json.js
        continue-on-error: true

      - name: Build Astro Preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_GA_ID: G-SDX45VEPP3
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify Preview build
        run: |
          set -euo pipefail
          test -f astro-front/dist/index.html
          test -f astro-front/dist/carrito/index.html
          grep -q "Finalizá tu pedido" astro-front/dist/carrito/index.html
          grep -q "Enviar pedido por WhatsApp" astro-front/dist/carrito/index.html
          grep -q "PEDIDO WEB" astro-front/dist/carrito/index.html
          ! grep -q "btn-pay-soon" astro-front/dist/carrito/index.html
          grep -q "noindex, nofollow" astro-front/dist/carrito/index.html

      - name: Deploy isolated Cloudflare Preview
        run: npx wrangler@3.114.17 pages deploy ./astro-front/dist --project-name amadolibros-web --branch pr21-cierre-whatsapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
