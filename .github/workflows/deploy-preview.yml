name: Deploy Astro Preview

on:
  push:
    branches-ignore:
      - main
  # Sin workflow_dispatch para evitar disparos manuales accidentales.

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Generate home.json
        # Genera public/home.json desde el catálogo público de R2.
        # No requiere credenciales. Si falla (R2 down), el deploy continúa
        # usando el último home.json commiteado como fallback.
        run: node scripts/generate-home-json.js
        continue-on-error: true

      - name: Test orders
        run: node --test functions/api/__tests__/orders.test.js

      - name: Test preferences
        run: node --test functions/api/__tests__/preferences.test.js

      - name: Test MP webhook
        run: node --test functions/api/__tests__/mp_webhook.test.js

      - name: Test order status
        run: node --test functions/api/__tests__/order_status.test.js

      - name: Build Astro
        run: |
          cd astro-front
          npm ci
          npm run build

      - name: Verify build output
        run: |
          test -f astro-front/dist/index.html
          grep -q "Astro build OK" astro-front/dist/index.html
          grep -q "noindex, nofollow" astro-front/dist/index.html
          test -f astro-front/dist/_headers
          # _headers ya no debe llevar la regla global de noindex/no-store:
          # esa regla se aplicaba por igual en Preview y Producción. La
          # protección de Preview la impone functions/_middleware.js
          # (condicionado por hostname *.pages.dev), no _headers.
          ! grep -q "X-Robots-Tag: noindex, nofollow" astro-front/dist/_headers
          ! grep -q "Cache-Control: no-store" astro-front/dist/_headers

      - name: Deploy preview to CF Pages
        # --branch usa el nombre real de la rama (Cloudflare Pages sanea/trunca
        # el alias resultante automáticamente, como ya ocurre hoy con ramas
        # largas: ver docs/environments.md).
        run: npx wrangler@3 pages deploy ./astro-front/dist --project-name amadolibros-web --branch "${GITHUB_REF_NAME}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
