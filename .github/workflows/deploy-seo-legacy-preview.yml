name: Deploy SEO Legacy Preview

on:
  push:
    branches:
      - agent/seo-legacy-cleanup-1

permissions:
  contents: read

concurrency:
  group: seo-legacy-cleanup-preview
  cancel-in-progress: true

jobs:
  guard:
    name: Guard Preview ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block every other branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/agent/seo-legacy-cleanup-1" ]; then
            echo "Deploy bloqueado: este workflow solo publica agent/seo-legacy-cleanup-1."
            exit 1
          fi

  validate:
    name: Validate SEO cleanup
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json
      - name: Validate shared suite
        run: bash scripts/validate-ci.sh

  deploy-preview:
    name: Deploy protected Preview
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: seo-legacy-preview
      url: https://agent-seo-legacy-cleanup-1.amadolibros-web.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Generate home.json
        run: node scripts/generate-home-json.js
        continue-on-error: true

      - name: Install Astro dependencies
        working-directory: astro-front
        run: npm ci --no-audit --no-fund

      - name: Build protected Preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_GA_ID: ''
          PUBLIC_CHECKOUT_ENABLED: 'false'
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAD6E9kz8K3comwjj'
          PUBLIC_TURNSTILE_ALLOWED_HOSTS: '.amadolibros-web.pages.dev'
        run: npm run build

      - name: Verify Preview protections
        run: |
          test -f astro-front/dist/index.html
          test -f astro-front/dist/404.html
          grep -q 'noindex, nofollow' astro-front/dist/index.html
          grep -q 'data-online-checkout="disabled"' astro-front/dist/carrito/index.html

      - name: Deploy branch to Cloudflare Pages Preview
        run: >
          npx wrangler@3.114.17 pages deploy ./astro-front/dist
          --project-name amadolibros-web
          --branch agent/seo-legacy-cleanup-1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

