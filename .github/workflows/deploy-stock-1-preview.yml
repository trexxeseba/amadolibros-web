name: Deploy STOCK-1 Preview

on:
  push:
    branches:
      - agent/stock-1-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-1-preview
  cancel-in-progress: true

jobs:
  guard:
    name: Guard Preview ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block every other branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/agent/stock-1-preview" ]; then
            echo "Deploy bloqueado: este workflow solo publica agent/stock-1-preview."
            exit 1
          fi

  validate:
    name: Validate STOCK-1
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json
      - name: Validate shared suite
        run: bash scripts/validate-ci.sh

  measure-paused:
    name: Measure paused without publishing
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Measure Mercado Libre catalog in memory
        env:
          MELI_TOKEN: ${{ secrets.MELI_TOKEN }}
        run: |
          if [ -z "$MELI_TOKEN" ]; then
            echo "ERROR: MELI_TOKEN no está configurado en GitHub Actions."
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { buildCatalog } from './worker-sync/meli-catalog.js';

          const catalog = await buildCatalog(
            { USER_ID: '440298103', MIN_ACTIVE_ITEMS: '500' },
            process.env.MELI_TOKEN
          );
          const items = Array.isArray(catalog.items) ? catalog.items : [];
          const ids = items.map(item => item.id).filter(Boolean);
          const uniqueIds = new Set(ids);
          const active = items.filter(
            item => item.status === 'active' && Number(item.available_quantity) > 0
          ).length;
          const paused = items.filter(item => item.status === 'paused').length;
          const activeWithoutStock = items.filter(
            item => item.status === 'active' && Number(item.available_quantity) <= 0
          ).length;
          const invalid = items.filter(
            item => !item.id || !item.title || !['active', 'paused'].includes(item.status)
          ).length;
          const bytes = new TextEncoder().encode(JSON.stringify(catalog)).length;

          console.log('MEASUREMENT_RESULT=' + JSON.stringify({
            total: items.length,
            active,
            paused,
            active_without_stock: activeWithoutStock,
            duplicate_ids: ids.length - uniqueIds.size,
            invalid,
            bytes,
            mebibytes: Math.round((bytes / 1024 / 1024) * 100) / 100,
            published: false
          }));
          NODE

  deploy-preview:
    name: Deploy Preview
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Install Astro dependencies
        working-directory: astro-front
        run: npm ci --no-audit --no-fund

      - name: Build protected Preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_GA_ID: ''
          PUBLIC_CHECKOUT_ENABLED: 'false'
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAD6E9kz8K3comwjj'
          PUBLIC_TURNSTILE_ALLOWED_HOSTS: '.amadolibros-web.pages.dev'
        run: npm run build

      - name: Deploy branch to Cloudflare Pages Preview
        run: >
          npx wrangler@3.114.17 pages deploy ./astro-front/dist
          --project-name amadolibros-web
          --branch agent/stock-1-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
