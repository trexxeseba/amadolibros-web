name: Deploy STOCK-1 Preview

on:
  push:
    branches:
      - agent/stock-1-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-1-preview
  cancel-in-progress: true

jobs:
  guard:
    name: Guard Preview ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block every other branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/agent/stock-1-preview" ]; then
            echo "Deploy bloqueado: este workflow solo publica agent/stock-1-preview."
            exit 1
          fi

  validate:
    name: Validate STOCK-1
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json
      - name: Validate shared suite
        run: bash scripts/validate-ci.sh

  measure-paused:
    name: Measure paused without deploying
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Upload isolated Worker version
        id: upload
        working-directory: worker-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx wrangler@4.107.0 versions upload \
            --preview-alias stock-measure \
            --keep-vars \
            --message "STOCK-1 medicion sin despliegue")
          echo "$OUTPUT"

          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "ERROR: Wrangler no devolvió la URL de Preview."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Execute measurement only
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          sleep 10
          RESPONSE=$(curl -sS --max-time 900 -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$PREVIEW_URL/measure" \
            -H "Authorization: Bearer $SYNC_SECRET")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP status: $HTTP_STATUS"
          echo "MEASUREMENT_RESULT=$BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: /measure respondió HTTP $HTTP_STATUS."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"published":false'; then
            echo "ERROR: la respuesta no confirmó published=false."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"status":"measured"'; then
            echo "ERROR: la medición no terminó en estado measured."
            exit 1
          fi

  deploy-preview:
    name: Deploy Preview
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Install Astro dependencies
        working-directory: astro-front
        run: npm ci --no-audit --no-fund

      - name: Build protected Preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_GA_ID: ''
          PUBLIC_CHECKOUT_ENABLED: 'false'
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAD6E9kz8K3comwjj'
          PUBLIC_TURNSTILE_ALLOWED_HOSTS: '.amadolibros-web.pages.dev'
        run: npm run build

      - name: Deploy branch to Cloudflare Pages Preview
        run: >
          npx wrangler@3.114.17 pages deploy ./astro-front/dist
          --project-name amadolibros-web
          --branch agent/stock-1-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
