name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  guard:
    name: Guard production ref
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Block manual deploy outside main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Deploy bloqueado: solo se permite ejecutar manualmente desde main."
          exit 1

  # Misma barrera que corre en cada PR (.github/workflows/ci.yml), invocando
  # el mismo script — nunca una copia aparte que pueda desviarse. El build
  # real de más abajo (job `deploy`) no arranca si este job falla: un PR
  # pudo haber sido aprobado hace tiempo y el checkout de main pudo cambiar
  # entretanto, así que esto vuelve a probar sintaxis, la suite completa y
  # ambos modos de checkout contra el commit que realmente se va a desplegar.
  validate:
    name: Validate before deploy
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Validate (shared script — syntax, tests, both checkout builds)
        run: bash scripts/validate-ci.sh

  # CF-R2-2-BRIDGE: publica el catálogo productivo separado (activo + pausado
  # + manifest, prefijo catalog/*) mediante una versión aislada del Worker de
  # sync — nunca la versión "current" que corre el cron. No toca catalog.json
  # ni meta.json (el mismo mecanismo, ya probado en Preview desde STOCK-1).
  # Corre en paralelo a `deploy`, no lo bloquea: si el catálogo pausado
  # fallara acá, el sitio (libros activos) igual se despliega sin problema.
  publish-production-catalog:
    name: Publish production paused catalog
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Upload isolated Worker version
        id: upload
        working-directory: worker-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx wrangler@4.107.0 versions upload \
            --preview-alias production-catalog-publish \
            --keep-vars \
            --var PRODUCTION_PAUSED_CATALOG_PUBLISH_ENABLED:true \
            --message "CF-R2-2-BRIDGE publicacion catalogo pausado productivo")
          echo "$OUTPUT"

          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "ERROR: Wrangler no devolvió la URL de la versión aislada."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish production paused/active catalog
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          CATALOG_URL="https://pub-b2b408811ae24e3da04cda79c6ff084d.r2.dev/catalog.json"
          BEFORE=$(curl -sSI "$CATALOG_URL" | tr -d '\r' | grep -Ei '^(etag|content-length|last-modified):' | sort)
          sleep 10
          RESPONSE=$(curl -sS --max-time 900 -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$PREVIEW_URL/publish-production-catalog" \
            -H "Authorization: Bearer $SYNC_SECRET")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP status: $HTTP_STATUS"
          echo "PRODUCTION_CATALOG_RESULT=$BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: /publish-production-catalog respondió HTTP $HTTP_STATUS."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"published":true'; then
            echo "ERROR: la respuesta no confirmó published=true."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"production_catalog_modified":false'; then
            echo "ERROR: no se confirmó que catalog.json quedó intacto."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"key":"catalog/manifest.json"'; then
            echo "ERROR: el Worker no confirmó el manifest fijo productivo."
            exit 1
          fi
          echo "$BODY" | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              const paused = result.paused_catalog || {};
              const active = result.active_catalog || {};
              if (!(active.total > 0 && active.index_bytes > 0)) {
                throw new Error(`Índice activo inválido: ${active.index_bytes}`);
              }
              if (!(active.index_gzip_bytes > 0 && active.index_gzip_bytes < active.index_bytes)) {
                throw new Error(`Gzip activo inválido: ${active.index_gzip_bytes}`);
              }
              if (!(paused.index_bytes > 0)) {
                throw new Error(`Índice pausado inválido: ${paused.index_bytes}`);
              }
              if (!(paused.index_gzip_bytes > 0 && paused.index_gzip_bytes < paused.index_bytes)) {
                throw new Error(`Gzip pausado inválido: ${paused.index_gzip_bytes}`);
              }
              if (!(paused.block_count >= 64 && paused.block_count <= 256)) {
                throw new Error(`Cantidad de bloques inválida: ${paused.block_count}`);
              }
            });
          '
          AFTER=$(curl -sSI "$CATALOG_URL" | tr -d '\r' | grep -Ei '^(etag|content-length|last-modified):' | sort)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ERROR: las cabeceras de catalog.json cambiaron durante la publicación."
            echo "ANTES=$BEFORE"
            echo "DESPUÉS=$AFTER"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.amadolibros.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Generate home.json
        id: home_json
        # Lee catálogo público de R2. Si falla (R2 down), el deploy continúa
        # usando el último home.json commiteado como fallback.
        run: node scripts/generate-home-json.js
        continue-on-error: true

      - name: Install Astro dependencies
        working-directory: astro-front
        run: npm ci --no-audit --no-fund

      - name: Apply production D1 migrations
        # CHECKOUT-TRANSFER-UX necesita 0005 antes de publicar el frontend:
        # la fecha y la franja dejan de ser obligatorias y pasan a coordinarse
        # por WhatsApp. Wrangler crea un backup antes de aplicar migraciones y
        # revierte la migración actual si alguna sentencia falla. El esquema
        # anterior sigue siendo compatible durante esta ventana: simplemente
        # continúa enviando fecha/franja hasta que Pages publique el build nuevo.
        run: >
          npx wrangler@3.114.17 d1 migrations apply
          ORDERS_DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Load production Turnstile config
        id: ts_config
        # Misma fuente que ya validó el job `validate` — nunca un literal
        # aparte en este YAML que pueda desviarse del que se acaba de probar.
        run: bash scripts/validate-ci.sh --print-turnstile-config >> "$GITHUB_OUTPUT"

      - name: Build Astro
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'true'
          PUBLIC_GA_ID: G-SDX45VEPP3
          # PUBLIC_CHECKOUT_ENABLED en 'true' (2-N-H1): el build renderiza el
          # flujo de pago online. El backend tiene su propio interruptor
          # (CHECKOUT_ENABLED en wrangler.toml) — los dos deben estar en true
          # para que se pueda cobrar.
          PUBLIC_CHECKOUT_ENABLED: 'true'
          PUBLIC_TURNSTILE_SITE_KEY: ${{ steps.ts_config.outputs.site_key }}
          PUBLIC_TURNSTILE_ALLOWED_HOSTS: ${{ steps.ts_config.outputs.allowed_hosts }}
        run: npm run build

      - name: Sync Resend secret to Cloudflare Pages
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::Falta el secret RESEND_API_KEY en el environment production de GitHub."
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" |
            npx wrangler@3.114.17 pages secret put RESEND_API_KEY --project-name amadolibros-web

      - name: Deploy via Wrangler
        run: npx wrangler@3.114.17 pages deploy ./astro-front/dist --project-name amadolibros-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        id: smoke
        env:
          SMOKE_BASE_URL: https://www.amadolibros.com
          SMOKE_MAX_ATTEMPTS: '6'
          SMOKE_RETRY_DELAY_MS: '10000'
          SMOKE_TIMEOUT_MS: '10000'
          # Debe reflejar el valor de PUBLIC_CHECKOUT_ENABLED de arriba: el
          # smoke verifica el HTML real de /carrito/ y falla el deploy si el
          # estado desplegado no coincide con el esperado. Si se hace rollback
          # a PUBLIC_CHECKOUT_ENABLED='false', cambiar esto a 'disabled'.
          SMOKE_EXPECT_CHECKOUT: 'enabled'
        run: node scripts/smoke-production.js

      - name: Capture first and repeated production timings
        id: perf_control
        run: |
          echo "## Performance controls" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Control sintético desde el runner de GitHub; no representa Uruguay ni sustituye RUM de usuarios reales. Comparar rutas dentro del mismo run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '| Ruta | Muestra | HTTP | TTFB externo | Total externo | Server-Timing |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---:|---:|---:|---|' >> "$GITHUB_STEP_SUMMARY"
          for path in /api/health /catalogo; do
            # Son dos solicitudes consecutivas desde el mismo runner. La primera
            # no se etiqueta "cold": Cloudflare no garantiza que el isolate o la
            # caché de borde estén fríos solo porque sea la primera de este job.
            for sample in first repeat; do
              headers="/tmp/perf-${path//\//-}-${sample}.headers"
              if metrics="$(curl -sS --max-time 60 -o /dev/null -D "$headers" \
                -w '%{http_code}|%{time_starttransfer}|%{time_total}' \
                "https://www.amadolibros.com$path")"; then
                IFS='|' read -r code ttfb total <<< "$metrics"
                timing="$(tr -d '\r' < "$headers" | sed -n 's/^server-timing:[[:space:]]*//Ip' | tail -1)"
                timing="${timing//|/\\|}"
                echo "| \`$path\` | $sample | $code | ${ttfb}s | ${total}s | \`${timing:-ausente}\` |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| \`$path\` | $sample | error | — | — | \`curl falló\` |" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done

      - name: Verify production R2 covers
        id: cover_r2_smoke
        run: |
          STATUS_CODE=""
          for attempt in 1 2 3 4 5 6 7 8; do
            STATUS_CODE="$(curl -sS --max-time 30 -o /tmp/cover-r2-status.json -w '%{http_code}' \
              'https://www.amadolibros.com/preview-cover/status')"
            [ "$STATUS_CODE" = "200" ] && break
            echo "Portadas R2 todavía propagándose (intento $attempt/8; HTTP $STATUS_CODE)."
            sleep 10
          done
          cat /tmp/cover-r2-status.json
          if [ "$STATUS_CODE" != "200" ]; then
            echo "Status R2 productivo no respondió 200."
            exit 1
          fi

          SAMPLE_ID="$(node -e '
            const s=require("/tmp/cover-r2-status.json");
            if (!(s.with_valid_copy >= 20) || !/^MLU\d+$/.test(s.sample_product_id || "")) process.exit(1);
            process.stdout.write(s.sample_product_id);
          ')"
          BOOK_CODE=""
          for attempt in 1 2 3 4 5 6 7 8; do
            BOOK_CODE="$(curl -sSL --max-time 60 -o /tmp/cover-r2-book.html -w '%{http_code}' \
              "https://www.amadolibros.com/libro/$SAMPLE_ID")"
            if [ "$BOOK_CODE" = "200" ] && grep -Fq "/book-cover/$SAMPLE_ID/cover.jpg" /tmp/cover-r2-book.html; then
              break
            fi
            echo "Ficha R2 productiva todavía propagándose (intento $attempt/8; HTTP $BOOK_CODE)."
            sleep 10
          done
          if [ "$BOOK_CODE" != "200" ]; then
            echo "La ficha productiva no respondió 200."
            exit 1
          fi
          IMAGE_PATH="/book-cover/$SAMPLE_ID/cover.jpg"
          curl -fsS --max-time 60 -D /tmp/cover-r2-image.headers \
            "https://www.amadolibros.com$IMAGE_PATH?smoke=${{ github.sha }}" -o /tmp/cover-r2-image.bin
          tr -d '\r' < /tmp/cover-r2-image.headers | grep -Eqi '^content-type: image/(jpeg|png|webp)$'
          tr -d '\r' < /tmp/cover-r2-image.headers | grep -Fqi 'x-cover-source: r2-production'
          test -s /tmp/cover-r2-image.bin
          echo "Portadas R2 productivas: manifest, ficha y bytes OK."

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **home.json** | ${{ steps.home_json.outcome == 'success' && '✅ fresh' || '⚠️ fallback (committed copy)' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Smoke test** | ${{ steps.smoke.outcome == 'success' && '✅ passed' || steps.smoke.outcome == 'skipped' && '— not run' || '❌ failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **R2 covers** | ${{ steps.cover_r2_smoke.outcome == 'success' && '✅ passed' || steps.cover_r2_smoke.outcome == 'skipped' && '— not run' || '❌ failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Performance controls** | ${{ steps.perf_control.outcome == 'success' && '✅ captured' || steps.perf_control.outcome == 'skipped' && '— not run' || '⚠️ unavailable' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Attempts** | ${{ steps.smoke.outputs.attempts_used || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | https://www.amadolibros.com |" >> "$GITHUB_STEP_SUMMARY"
