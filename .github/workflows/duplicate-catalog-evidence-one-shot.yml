name: Duplicate catalog evidence one-shot

on:
  push:
    branches:
      - agent/seo-duplicate-enrichment-1
    paths:
      - '.github/workflows/duplicate-catalog-evidence-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-duplicate-enrichment-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Add optional catalog identity evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/seo/duplicate-review.mjs')
          s=p.read_text()
          marker='export function classifyStrictDuplicateItems(items) {'
          helper='''function catalogIdentityEvidence(items) {\n  const productIds = items.map((item) => item.catalog_product_id ? String(item.catalog_product_id) : null);\n  const listingFlags = items.map((item) => item.catalog_listing === true ? true : item.catalog_listing === false ? false : null);\n  const distinctProductIds = [...new Set(productIds.filter(Boolean))].sort();\n  const completeProductIds = productIds.every(Boolean);\n  const completeListingFlags = listingFlags.every((value) => value !== null);\n  const hasCatalog = listingFlags.includes(true);\n  const hasTraditional = listingFlags.includes(false);\n  return {\n    productIds,\n    listingFlags,\n    distinctProductIds,\n    completeProductIds,\n    completeListingFlags,\n    sameCatalogProduct: completeProductIds && distinctProductIds.length === 1,\n    mixedTraditionalCatalog: completeListingFlags && hasCatalog && hasTraditional,\n  };\n}\n\n'''
          if s.count(marker)!=1: raise SystemExit('classify marker mismatch')
          if 'function catalogIdentityEvidence' not in s:
              s=s.replace(marker,helper+marker)
          old="  const dimensions = dimensionEvidence(items);\n"
          new="  const dimensions = dimensionEvidence(items);\n  const catalogIdentity = catalogIdentityEvidence(items);\n"
          if s.count(old)!=1: raise SystemExit('dimension marker mismatch')
          s=s.replace(old,new)
          old2="      dimensions,\n    },\n"
          new2="      dimensions,\n      catalogIdentity,\n    },\n"
          if s.count(old2)!=1: raise SystemExit('evidence marker mismatch')
          s=s.replace(old2,new2)
          old3="      dimensions: source.dimensions && typeof source.dimensions === 'object'\n        ? source.dimensions\n        : null,\n"
          new3="      dimensions: source.dimensions && typeof source.dimensions === 'object'\n        ? source.dimensions\n        : null,\n      catalog_listing: typeof source.catalog_listing === 'boolean' ? source.catalog_listing : null,\n      catalog_product_id: source.catalog_product_id || null,\n"
          if s.count(old3)!=1: raise SystemExit('enrich marker mismatch')
          p.write_text(s.replace(old3,new3))
          PY
          cat >> scripts/seo/__tests__/duplicate-review.test.mjs <<'EOF'

test('catalog_product_id aporta evidencia sin cambiar la decisión por sí solo', () => {
  const result = classifyStrictDuplicateItems([
    item({ id: 'MLU1', catalog_listing: false, catalog_product_id: 'MLU-P1' }),
    item({ id: 'MLU2', catalog_listing: true, catalog_product_id: 'MLU-P1' }),
  ]);
  assert.equal(result.decision, 'green_candidate');
  assert.equal(result.evidence.catalogIdentity.sameCatalogProduct, true);
  assert.equal(result.evidence.catalogIdentity.mixedTraditionalCatalog, true);
});

test('señal de catálogo ausente queda como evidencia incompleta, no como inferencia', () => {
  const result = classifyStrictDuplicateItems([
    item({ id: 'MLU1' }),
    item({ id: 'MLU2' }),
  ]);
  assert.equal(result.evidence.catalogIdentity.completeProductIds, false);
  assert.equal(result.evidence.catalogIdentity.mixedTraditionalCatalog, false);
});
EOF
          node --check scripts/seo/duplicate-review.mjs
          node --test scripts/seo/__tests__/duplicate-review.test.mjs
          git diff --check
      - name: Commit and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/seo/duplicate-review.mjs scripts/seo/__tests__/duplicate-review.test.mjs
          git commit -m 'SEO-DUPLICATE-REVIEW-1: include optional ML catalog identity evidence'
          git rm .github/workflows/duplicate-catalog-evidence-one-shot.yml
          git commit -m 'SEO duplicates: remove temporary catalog evidence helper'
          git push origin HEAD:agent/seo-duplicate-enrichment-1
