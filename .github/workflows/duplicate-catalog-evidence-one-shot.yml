name: Duplicate catalog evidence one-shot

on:
  push:
    branches:
      - agent/seo-duplicate-enrichment-1
    paths:
      - '.github/workflows/duplicate-catalog-evidence-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-duplicate-enrichment-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply catalog identity evidence patch
        run: |
          python scripts/ops/duplicate-catalog-evidence-patch.py
          node --check scripts/seo/duplicate-review.mjs
          node --test scripts/seo/__tests__/duplicate-review.test.mjs
          git diff --check
      - name: Commit and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/seo/duplicate-review.mjs scripts/seo/__tests__/duplicate-review.test.mjs
          git commit -m 'SEO-DUPLICATE-REVIEW-1: include optional ML catalog identity evidence'
          git rm .github/workflows/duplicate-catalog-evidence-one-shot.yml scripts/ops/duplicate-catalog-evidence-patch.py
          git commit -m 'SEO duplicates: remove temporary catalog evidence helpers'
          git push origin HEAD:agent/seo-duplicate-enrichment-1
