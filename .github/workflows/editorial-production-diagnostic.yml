name: Diagnostic editorial production HTML

on:
  push:
    branches: [b11/editorial-real-2000-1]
    paths: ['.github/workflows/editorial-production-diagnostic.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Inspect local registry and renderer
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { applyBookEnrichment, getBookEnrichmentByIsbn } from './functions/_shared/book-enrichment-registry.js';
          import { PRODUCT_SEO_OVERRIDES } from './functions/_shared/seo-products.js';
          import { renderPage } from './functions/libro/[[path]].js';

          const id = 'MLU1453287196';
          const isbn = '9791388034435';
          const record = getBookEnrichmentByIsbn(isbn);
          const original = {
            id,
            isbn,
            title: 'Grandes Clasicos Tomo 11 Disney Pixar para Colorear',
            author: 'Varios autores',
            description: '',
            publisher: 'Hachette',
            pages: null,
            price: 1890,
            currency_id: 'UYU',
            status: 'active',
            available_quantity: 1,
            condition: 'new',
            permalink: 'https://articulo.mercadolibre.com.uy/MLU-1453287196',
            pictures: ['https://http2.mlstatic.com/D_NQ_NP_test-O.webp'],
            dimensions: {},
            bibliographic: { publication_year: '2026' },
          };
          const item = applyBookEnrichment(original);
          const html = renderPage(
            item,
            'grandes-clasicos-tomo-11-disney-pixar-para-colorear',
            false,
            '',
            '',
            [],
          );
          console.log(JSON.stringify({
            recordDecision: record?.decision,
            editorialKeys: Object.keys(record?.editorial || {}),
            seoTitle: record?.editorial?.seo_title,
            metaDescription: record?.editorial?.meta_description,
            productOverride: PRODUCT_SEO_OVERRIDES[id] || null,
            appliedSeoTitle: item?._amadoEditorial?.seo_title,
            localTitle: html.match(/<title>([\s\S]*?)<\/title>/i)?.[1] || null,
            localMeta: html.match(/<meta name="description" content="([^"]*)"/i)?.[1] || null,
          }, null, 2));
          NODE

      - name: Inspect deployed production renderer
        shell: bash
        run: |
          set -euo pipefail
          PATHNAME='/libro/MLU1453287196/grandes-clasicos-tomo-11-disney-pixar-para-colorear'
          URL="https://www.amadolibros.com$PATHNAME?verify=$(date +%s)"
          curl -fsSL --retry 4 --retry-delay 2 --max-time 60 -H 'Cache-Control: no-cache' "$URL" -o /tmp/product.html
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/product.html', 'utf8');
          console.log(JSON.stringify({
            productionTitle: html.match(/<title>([\s\S]*?)<\/title>/i)?.[1] || null,
            productionMeta: html.match(/<meta name="description" content="([^"]*)"/i)?.[1] || null,
            bodyHasEditorial: html.includes('100 ilustraciones misteriosas') && html.includes('¿Para quién está recomendado?'),
            translator: html.match(/<dt>Traductor\/a<\/dt><dd>([^<]*)<\/dd>/i)?.[1] || null,
          }, null, 2));
          NODE
