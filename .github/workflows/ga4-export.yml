name: GA4 manual export

on:
  pull_request:
    paths:
      - '.github/workflows/ga4-export.yml'
      - 'scripts/ga4-admin-audit.mjs'
      - 'functions/__tests__/ga4-admin-audit.test.js'
  workflow_dispatch:
    inputs:
      start_date:
        description: Fecha inicial (YYYY-MM-DD)
        required: true
        default: '2026-07-01'
      end_date:
        description: Fecha final (YYYY-MM-DD)
        required: true
        default: '2026-07-31'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ga4-export
  cancel-in-progress: false

jobs:
  admin-audit:
    name: Inventory GA4 configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Authenticate with Google
        id: google_auth_admin
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Enable required read APIs
        run: |
          gcloud services enable analyticsadmin.googleapis.com analyticsdata.googleapis.com \
            --project=amado-libros-analytics --quiet

      - name: Inventory accessible GA4 properties
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google_auth_admin.outputs.access_token }}
          GA4_ADMIN_OUTPUT_DIR: artifacts/ga4-admin-audit
        run: node scripts/ga4-admin-audit.mjs

      - name: Upload read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-admin-audit-${{ github.run_id }}
          path: artifacts/ga4-admin-audit/
          if-no-files-found: error
          retention-days: 7

      - name: Write audit summary
        if: always()
        run: |
          if [ -f artifacts/ga4-admin-audit/summary.md ]; then
            cat artifacts/ga4-admin-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## GA4 admin audit failed" >> "$GITHUB_STEP_SUMMARY"
            echo "No resources were modified." >> "$GITHUB_STEP_SUMMARY"
          fi

  export:
    if: github.event_name == 'workflow_dispatch'
    name: Extract GA4 data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Validate required secret
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          test -n "$GA4_PROPERTY_ID" || { echo "::error::Falta GA4_PROPERTY_ID"; exit 1; }

      - name: Authenticate with Google
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false

      - name: Extract GA4 reports
        env:
          GA4_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_START_DATE: ${{ inputs.start_date }}
          GA4_END_DATE: ${{ inputs.end_date }}
          GA4_OUTPUT_DIR: artifacts/ga4
        run: node scripts/ga4-export.js

      - name: Upload JSON and CSV
        uses: actions/upload-artifact@v4
        with:
          name: ga4-${{ inputs.start_date }}-${{ inputs.end_date }}
          path: artifacts/ga4/
          if-no-files-found: error
          retention-days: 30

      - name: Write run summary
        if: always()
        run: |
          echo "## GA4 manual export" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Property: configured through GA4_PROPERTY_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Period: ${{ inputs.start_date }} to ${{ inputs.end_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Claude API: not called" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: not triggered" >> "$GITHUB_STEP_SUMMARY"
