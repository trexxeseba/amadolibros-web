name: GCP BigQuery domain window temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Open project-only domain window and auto-restore
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='amado-libros-analytics'
          OVERRIDE_APPLIED=0
          restore_policy() {
            if [[ "$OVERRIDE_APPLIED" == '1' ]]; then
              echo '### Restore inherited domain restriction'
              gcloud resource-manager org-policies delete iam.allowedPolicyMemberDomains \
                --project="$PROJECT" --quiet || true
            fi
          }
          trap restore_policy EXIT

          cat >/tmp/allow-all.yaml <<'YAML'
          constraint: constraints/iam.allowedPolicyMemberDomains
          listPolicy:
            allValues: ALLOW
          YAML

          echo '### Apply project-only ALLOW override'
          gcloud resource-manager org-policies set-policy /tmp/allow-all.yaml \
            --project="$PROJECT" --quiet
          OVERRIDE_APPLIED=1

          echo '### Wait until effective policy reports ALLOW'
          for attempt in $(seq 1 12); do
            EFFECTIVE=$(gcloud resource-manager org-policies describe iam.allowedPolicyMemberDomains \
              --project="$PROJECT" --effective --format='value(listPolicy.allValues)' || true)
            echo "attempt=${attempt} effective=${EFFECTIVE:-unknown}"
            if [[ "$EFFECTIVE" == 'ALLOW' ]]; then break; fi
            sleep 10
          done

          echo '### Domain window open for 8 minutes'
          sleep 480

          echo '### Normal restore'
          gcloud resource-manager org-policies delete iam.allowedPolicyMemberDomains \
            --project="$PROJECT" --quiet
          OVERRIDE_APPLIED=0

          echo '### Verify restored policy'
          gcloud resource-manager org-policies describe iam.allowedPolicyMemberDomains \
            --project="$PROJECT" --effective --format=yaml

      - name: Comment issue 181
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body "Ventana temporal de domain-restricted sharing ejecutada en run $GITHUB_RUN_ID. Override limitado al proyecto y restauración automática al finalizar."
