name: GCP BigQuery location check temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check effective resource location policy
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## GCP resource location policy'
            echo
            echo '```yaml'
            gcloud resource-manager org-policies describe gcp.resourceLocations \
              --project=amado-libros-analytics \
              --effective \
              --format=yaml 2>&1 || true
            echo '```'
          } > /tmp/location.md
          cat /tmp/location.md
      - name: Comment issue 181
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/location.md
