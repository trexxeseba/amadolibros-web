name: GCP billing diagnose temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read billing state
        shell: bash
        run: |
          set +e
          PROJECT='amado-libros-analytics'
          echo '### Project billing status'
          gcloud billing projects describe "$PROJECT" --format=yaml
          echo '### Billing accounts visible to ga4-reporter'
          gcloud billing accounts list --format='table(name,displayName,open,masterBillingAccount)'
          echo '### Organization billing-related IAM roles for ga4-reporter'
          gcloud organizations get-iam-policy 1036440070845 \
            --flatten='bindings[].members' \
            --filter='bindings.members:ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com' \
            --format='table(bindings.role,bindings.members)'
          exit 0
      - name: Comment tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body "Diagnóstico de facturación ejecutado en run $GITHUB_RUN_ID."
