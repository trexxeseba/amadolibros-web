name: GCP billing link bootstrap temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check GSC BigQuery dataset
        shell: bash
        run: |
          set +e
          echo 'GSC_BIGQUERY_READY_CHECK' > /tmp/gsc-bq-check.txt
          if bq --project_id=amado-libros-analytics show amado-libros-analytics:searchconsole >/tmp/dataset.txt 2>/tmp/dataset.err; then
            echo 'dataset_present=true' >> /tmp/gsc-bq-check.txt
            bq --project_id=amado-libros-analytics ls amado-libros-analytics:searchconsole >> /tmp/gsc-bq-check.txt 2>&1
          else
            echo 'dataset_present=false' >> /tmp/gsc-bq-check.txt
            cat /tmp/dataset.err >> /tmp/gsc-bq-check.txt
          fi
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-bq-check.txt
