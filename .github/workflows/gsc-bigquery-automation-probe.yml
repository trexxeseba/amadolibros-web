name: GSC BigQuery automation probe

on:
  push:
    branches:
      - agent/gsc-bigquery-automation-probe
    paths:
      - '.github/workflows/gsc-bigquery-automation-probe.yml'
      - '.gsc-bigquery-probe-trigger'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check Search Console export tables and rows
        shell: bash
        run: |
          set -u
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT=/tmp/gsc-bq-readiness.txt
          : > "$OUT"

          echo '## GSC BigQuery readiness' >> "$OUT"
          echo >> "$OUT"
          echo '```text' >> "$OUT"

          if bq show --project_id="$PROJECT" --format=prettyjson "$PROJECT:$DATASET" >/tmp/dataset.json 2>/tmp/dataset.err; then
            echo 'dataset_present=true' >> "$OUT"
          else
            echo 'dataset_present=false' >> "$OUT"
            sed -n '1,8p' /tmp/dataset.err >> "$OUT"
            echo 'READY=0' >> "$OUT"
            echo '```' >> "$OUT"
            cat "$OUT"
            exit 0
          fi

          if bq ls --project_id="$PROJECT" --format=csv "$PROJECT:$DATASET" >/tmp/tables.csv 2>/tmp/tables.err; then
            echo 'tables_listable=true' >> "$OUT"
          else
            echo 'tables_listable=false' >> "$OUT"
            sed -n '1,8p' /tmp/tables.err >> "$OUT"
            echo 'READY=0' >> "$OUT"
            echo '```' >> "$OUT"
            cat "$OUT"
            exit 0
          fi

          ready=1
          for T in ExportLog searchdata_url_impression searchdata_site_impression; do
            if bq show --project_id="$PROJECT" --format=prettyjson "$PROJECT:$DATASET.$T" >/tmp/${T}.json 2>/tmp/${T}.err; then
              echo "$T.present=true" >> "$OUT"
              META=$(python3 - "$T" <<'PY'
import json,sys
p=f"/tmp/{sys.argv[1]}.json"
try:
    d=json.load(open(p))
    print("numRows="+str(d.get("numRows","missing")))
except Exception as e:
    print("numRows=parse_error:"+str(e))
PY
)
              echo "$T.$META" >> "$OUT"
              if bq head --project_id="$PROJECT" --max_rows=1 --format=csv "$PROJECT:$DATASET.$T" >/tmp/${T}-head.csv 2>/tmp/${T}-head.err; then
                LINES=$(wc -l </tmp/${T}-head.csv | tr -d ' ')
                echo "$T.head_ok=true" >> "$OUT"
                echo "$T.head_lines=$LINES" >> "$OUT"
                if [[ "$LINES" -lt 2 ]]; then ready=0; fi
              else
                echo "$T.head_ok=false" >> "$OUT"
                sed -n '1,5p' /tmp/${T}-head.err >> "$OUT"
                ready=0
              fi
            else
              echo "$T.present=false" >> "$OUT"
              ready=0
            fi
          done

          echo "READY=$ready" >> "$OUT"
          echo '```' >> "$OUT"
          cat "$OUT"

      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 189 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-bq-readiness.txt
