name: GSC BigQuery bootstrap temporary

on:
  push:
    branches:
      - agent/gsc-bigquery-bootstrap

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Bootstrap prerequisites
        id: bootstrap
        shell: bash
        run: |
          set +e
          PROJECT='amado-libros-analytics'
          MEMBER='serviceAccount:search-console-data-export@system.gserviceaccount.com'
          : > /tmp/gsc-bq-result.txt

          run_cmd() {
            local label="$1"
            shift
            echo "### $label" | tee -a /tmp/gsc-bq-result.txt
            "$@" >> /tmp/gsc-bq-result.txt 2>&1
            local code=$?
            echo "exit_code=$code" | tee -a /tmp/gsc-bq-result.txt
            echo >> /tmp/gsc-bq-result.txt
            return $code
          }

          FAILED=0
          run_cmd 'Enable BigQuery API' gcloud services enable bigquery.googleapis.com --project="$PROJECT" || FAILED=1
          run_cmd 'Enable BigQuery Storage API' gcloud services enable bigquerystorage.googleapis.com --project="$PROJECT" || FAILED=1
          run_cmd 'Grant BigQuery Job User' gcloud projects add-iam-policy-binding "$PROJECT" --member="$MEMBER" --role='roles/bigquery.jobUser' --condition=None --quiet || FAILED=1
          run_cmd 'Grant BigQuery Data Editor' gcloud projects add-iam-policy-binding "$PROJECT" --member="$MEMBER" --role='roles/bigquery.dataEditor' --condition=None --quiet || FAILED=1

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          cat /tmp/gsc-bq-result.txt
          exit "$FAILED"

      - name: Comment result on tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Resultado bootstrap GSC → BigQuery'
            echo
            if [ -f /tmp/gsc-bq-result.txt ]; then
              echo '```text'
              cat /tmp/gsc-bq-result.txt
              echo '```'
            else
              echo 'La autenticación o setup falló antes de ejecutar los comandos de bootstrap.'
            fi
            echo
            echo "Workflow conclusion source: commit $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 170 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Summary
        if: always()
        run: |
          echo '## GSC BigQuery bootstrap' >> "$GITHUB_STEP_SUMMARY"
          echo '- Project: `amado-libros-analytics`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Search Console principal: `search-console-data-export@system.gserviceaccount.com`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Required roles: `roles/bigquery.jobUser`, `roles/bigquery.dataEditor`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Search Console creates the dataset on the first export; this workflow does not pre-create it.' >> "$GITHUB_STEP_SUMMARY"
