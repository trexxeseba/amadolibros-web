name: GSC BigQuery bootstrap temporary

on:
  push:
    branches:
      - agent/gsc-bigquery-bootstrap

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable BigQuery APIs
        run: |
          set -euo pipefail
          gcloud services enable \
            bigquery.googleapis.com \
            bigquerystorage.googleapis.com \
            --project=amado-libros-analytics

      - name: Grant Search Console export roles
        run: |
          set -euo pipefail
          MEMBER='serviceAccount:search-console-data-export@system.gserviceaccount.com'
          PROJECT='amado-libros-analytics'
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="$MEMBER" \
            --role='roles/bigquery.jobUser' \
            --condition=None \
            --quiet
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="$MEMBER" \
            --role='roles/bigquery.dataEditor' \
            --condition=None \
            --quiet

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          echo '=== ENABLED BIGQUERY SERVICES ==='
          gcloud services list --enabled \
            --project=amado-libros-analytics \
            --filter='name:(bigquery.googleapis.com OR bigquerystorage.googleapis.com)' \
            --format='value(name)'
          echo '=== SEARCH CONSOLE PRINCIPAL ROLES ==='
          gcloud projects get-iam-policy amado-libros-analytics \
            --flatten='bindings[].members' \
            --filter='bindings.members:search-console-data-export@system.gserviceaccount.com' \
            --format='table(bindings.role,bindings.members)'

      - name: Summary
        if: always()
        run: |
          echo '## GSC BigQuery bootstrap' >> "$GITHUB_STEP_SUMMARY"
          echo '- Project: `amado-libros-analytics`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Search Console export principal: `search-console-data-export@system.gserviceaccount.com`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Required roles: `roles/bigquery.jobUser`, `roles/bigquery.dataEditor`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Dataset is intentionally NOT pre-created: Search Console creates it on first export after destination configuration.' >> "$GITHUB_STEP_SUMMARY"
