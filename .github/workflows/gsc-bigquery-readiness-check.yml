name: GSC BigQuery readiness check

on:
  push:
    branches:
      - agent/gsc-bigquery-readiness-check
  pull_request:
    paths:
      - '.github/workflows/gsc-bigquery-readiness-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check Search Console export tables
        shell: bash
        run: |
          set -uo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          REQUIRED_TABLES='ExportLog,searchdata_site_impression,searchdata_url_impression'

          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "bq_path=$(command -v bq || true)"

          # --format es una opción global de bq: debe ir antes del subcomando.
          if ! bq --project_id="$PROJECT" --format=prettyjson show \
            "$PROJECT:$DATASET" > /tmp/dataset.json 2>/tmp/dataset.err; then
            echo 'status=NOT_READY'
            echo 'reason=dataset_unavailable'
            echo 'dataset_error_begin'
            sed -n '1,20p' /tmp/dataset.err
            echo 'dataset_error_end'
            exit 0
          fi
          echo 'dataset_present=true'

          if ! bq --project_id="$PROJECT" --format=prettyjson ls \
            "$PROJECT:$DATASET" > /tmp/tables.raw 2>/tmp/tables.err; then
            echo 'status=NOT_READY'
            echo 'reason=table_listing_failed'
            echo 'table_listing_error_begin'
            sed -n '1,20p' /tmp/tables.err
            echo 'table_listing_error_end'
            exit 0
          fi

          # Con Workload Identity, bq imprime una advertencia de --scopes en
          # stdout. Se elimina únicamente esa línea conocida antes de parsear.
          # Si no queda contenido, el dataset existe pero todavía no tiene tablas.
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/tables.raw').read_text(encoding='utf-8')
          lines = [
              line for line in source.splitlines()
              if not line.startswith('WARNING: `--scopes` flag')
          ]
          raw = '\n'.join(lines).strip()
          if not raw:
              rows = []
          else:
              try:
                  rows = json.loads(raw)
              except Exception as exc:
                  print('status=NOT_READY')
                  print('reason=table_listing_invalid_json')
                  print(f'parse_error={type(exc).__name__}')
                  print('raw_prefix=' + raw[:160].replace('\n', ' '))
                  raise SystemExit(0)

          if not isinstance(rows, list):
              print('status=NOT_READY')
              print('reason=table_listing_unexpected_shape')
              raise SystemExit(0)

          names = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              ref = row.get('tableReference') or {}
              table_id = ref.get('tableId') or row.get('id') or ''
              if table_id:
                  names.append(str(table_id).split('.')[-1])

          required = {
              'ExportLog',
              'searchdata_url_impression',
              'searchdata_site_impression',
          }
          present = set(names)
          missing = sorted(required - present)
          Path('/tmp/table-state.env').write_text(
              'TABLES=' + ','.join(sorted(present)) + '\n'
              + 'REQUIRED_PRESENT=' + ','.join(sorted(required & present)) + '\n'
              + 'REQUIRED_MISSING=' + ','.join(missing) + '\n'
              + 'TABLE_SET_READY=' + ('true' if not missing else 'false') + '\n',
              encoding='utf-8',
          )
          PY

          if [ ! -s /tmp/table-state.env ]; then
            echo 'status=NOT_READY'
            echo 'reason=table_state_not_generated'
            exit 0
          fi
          cat /tmp/table-state.env
          # shellcheck disable=SC1091
          source /tmp/table-state.env

          if [ "$TABLE_SET_READY" != 'true' ]; then
            echo 'status=NOT_READY'
            if [ -z "$TABLES" ]; then
              echo 'reason=tables_not_created_yet'
            else
              echo 'reason=required_tables_missing'
            fi
            echo "required_tables=$REQUIRED_TABLES"
            exit 0
          fi

          count_rows() {
            local table="$1"
            local target_var="$2"
            local output="/tmp/${table}.csv"
            local error="/tmp/${table}.err"
            if ! bq --project_id="$PROJECT" --format=csv query --use_legacy_sql=false \
              "SELECT COUNT(*) AS rows FROM \`$PROJECT.$DATASET.$table\`" \
              > "$output" 2> "$error"; then
              echo "${table}_query=failed"
              sed -n '1,10p' "$error"
              return 1
            fi
            local count
            count=$(tail -n 1 "$output" | tr -d '\r"')
            if [[ ! "$count" =~ ^[0-9]+$ ]]; then
              echo "${table}_query=invalid_count"
              return 1
            fi
            echo "${table}_rows=$count"
            printf -v "$target_var" '%s' "$count"
          }

          count_rows ExportLog EXPORT_ROWS || {
            echo 'status=NOT_READY'
            echo 'reason=exportlog_query_failed'
            exit 0
          }
          count_rows searchdata_url_impression URL_ROWS || {
            echo 'status=NOT_READY'
            echo 'reason=url_impression_query_failed'
            exit 0
          }
          count_rows searchdata_site_impression SITE_ROWS || {
            echo 'status=NOT_READY'
            echo 'reason=site_impression_query_failed'
            exit 0
          }

          if [ "$EXPORT_ROWS" -gt 0 ] && { [ "$URL_ROWS" -gt 0 ] || [ "$SITE_ROWS" -gt 0 ]; }; then
            echo 'status=READY'
            echo 'reason=usable_export_data_present'
          else
            echo 'status=NOT_READY'
            echo 'reason=tables_present_without_usable_rows'
          fi
