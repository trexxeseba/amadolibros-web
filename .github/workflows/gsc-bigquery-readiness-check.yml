name: GSC BigQuery readiness check

on:
  push:
    branches:
      - automation/gsc-bigquery-readiness
    paths:
      - '.github/workflows/gsc-bigquery-readiness-check.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: amado-libros-analytics

      - name: Check Search Console bulk export tables
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          ready=1
          : > /tmp/gsc-ready-summary.txt

          echo '=== DATASET ==='
          if ! bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET" >/tmp/dataset.json 2>/tmp/dataset.err; then
            echo 'dataset_exists=false' | tee -a /tmp/gsc-ready-summary.txt
            ready=0
          else
            echo 'dataset_exists=true' | tee -a /tmp/gsc-ready-summary.txt
            echo '=== TABLE LIST ==='
            bq --project_id="$PROJECT" ls --format=prettyjson "$PROJECT:$DATASET" | tee /tmp/tables.json
          fi

          for table in ExportLog searchdata_url_impression searchdata_site_impression; do
            if [ "$ready" -eq 0 ] && [ ! -f /tmp/dataset.json ]; then
              echo "$table exists=false numRows=0" | tee -a /tmp/gsc-ready-summary.txt
              continue
            fi
            echo "=== $table ==="
            if ! bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET.$table" >/tmp/${table}.json 2>/tmp/${table}.err; then
              echo "$table exists=false numRows=0" | tee -a /tmp/gsc-ready-summary.txt
              ready=0
              continue
            fi
            rows=$(jq -r '.numRows // "0"' /tmp/${table}.json)
            echo "$table exists=true numRows=$rows" | tee -a /tmp/gsc-ready-summary.txt
            if [ "$rows" = "0" ]; then ready=0; fi
            if [ "$table" != 'ExportLog' ]; then
              result=$(bq --project_id="$PROJECT" query --quiet --use_legacy_sql=false --format=csv \
                "SELECT COUNT(*) AS rows, CAST(MAX(data_date) AS STRING) AS max_data_date FROM \`${PROJECT}.${DATASET}.${table}\`" 2>/tmp/query-${table}.err || true)
              echo "$result"
              max_date=$(printf '%s\n' "$result" | tail -n 1 | awk -F, '{print $2}' | tr -d '"')
              echo "$table max_data_date=${max_date:-unknown}" | tee -a /tmp/gsc-ready-summary.txt
            fi
          done

          if [ "$ready" -eq 1 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'GSC_BIGQUERY_READY=true'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'GSC_BIGQUERY_READY=false'
          fi

      - name: Comment tracking issue only when export is usable
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- AUTOMATION_GSC_BIGQUERY_READY -->'
            echo '## Search Console → BigQuery listo'
            echo
            echo 'La exportación masiva de Search Console ya está presente y utilizable en `amado-libros-analytics.searchconsole`.'
            echo
            echo '```text'
            cat /tmp/gsc-ready-summary.txt
            echo '```'
          } > /tmp/comment.md
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Mark not-ready run without notifying
        if: steps.readiness.outputs.ready != 'true'
        run: exit 3

