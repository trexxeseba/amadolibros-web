name: GSC BigQuery readiness probe temporary

on:
  push:
    branches:
      - automation/gsc-bigquery-readiness
    paths:
      - '.github/workflows/gsc-bigquery-readiness-probe-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: amado-libros-analytics
      - name: Probe tables and rows via BigQuery REST metadata
        shell: bash
        run: |
          set -euo pipefail
          P='amado-libros-analytics'; D='searchconsole'; O=/tmp/result.txt
          : > "$O"
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$O"
          TOKEN=$(gcloud auth print-access-token)
          ds_code=$(curl -sS -o /tmp/dataset.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://bigquery.googleapis.com/bigquery/v2/projects/$P/datasets/$D")
          if [ "$ds_code" = '200' ]; then echo 'dataset_present=true' >> "$O"; else echo 'dataset_present=false' >> "$O"; fi
          ready=1
          [ "$ds_code" = '200' ] || ready=0
          for T in ExportLog searchdata_url_impression searchdata_site_impression; do
            code=$(curl -sS -o "/tmp/$T.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://bigquery.googleapis.com/bigquery/v2/projects/$P/datasets/$D/tables/$T")
            if [ "$code" = '200' ]; then
              R=$(python -c "import json; print(json.load(open('/tmp/$T.json')).get('numRows','0'))")
              echo "$T.present=true" >> "$O"
              echo "$T.rows=$R" >> "$O"
              [ "${R:-0}" -gt 0 ] || ready=0
            else
              echo "$T.present=false" >> "$O"
              echo "$T.rows=0" >> "$O"
              ready=0
            fi
          done
          echo "READY=$ready" >> "$O"
          cat "$O"
      - name: Comment issue 190 with probe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## GSC BigQuery readiness probe'; echo; echo '```text'; cat /tmp/result.txt 2>/dev/null || echo 'probe_failed=true'; echo '```'; } >/tmp/comment.md
          gh issue comment 190 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
