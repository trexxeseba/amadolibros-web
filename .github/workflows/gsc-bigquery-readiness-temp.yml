name: GSC BigQuery readiness temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap
    paths:
      - '.github/workflows/gsc-bigquery-readiness-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect Search Console BigQuery export
        shell: bash
        run: |
          set -u
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          REPORT=/tmp/gsc-readiness.txt
          : > "$REPORT"
          {
            echo "checked_at=$(date -u +%FT%TZ)"
            if ! bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET" >/tmp/dataset.json 2>/tmp/dataset.err; then
              echo 'GSC_DATASET_PRESENT=false'
              cat /tmp/dataset.err
            else
              echo 'GSC_DATASET_PRESENT=true'
              echo 'TABLE_LIST:'
              bq --project_id="$PROJECT" ls --format=csv "$PROJECT:$DATASET" || true
              for T in ExportLog searchdata_url_impression searchdata_site_impression; do
                if bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET.$T" >/tmp/${T}.json 2>/tmp/${T}.err; then
                  echo "TABLE_${T}_PRESENT=true"
                  echo -n "ROWS_${T}="
                  bq --project_id="$PROJECT" query --use_legacy_sql=false --format=csv "SELECT COUNT(*) AS row_count FROM \`$PROJECT.$DATASET.$T\`" | tail -n 1 || true
                else
                  echo "TABLE_${T}_PRESENT=false"
                fi
              done
            fi
          } | tee "$REPORT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## GSC BigQuery readiness probe'; echo; echo '```text'; cat /tmp/gsc-readiness.txt 2>/dev/null || echo 'probe failed before report'; echo '```'; } > /tmp/comment.md
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
