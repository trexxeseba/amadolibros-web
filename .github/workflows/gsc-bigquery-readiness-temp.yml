name: GSC BigQuery readiness temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap
    paths:
      - '.github/workflows/gsc-bigquery-readiness-temp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe GSC export tables
        shell: bash
        run: |
          set -u
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT=/tmp/gsc-bq-readiness.txt
          : > "$OUT"
          log(){ echo "$*" | tee -a "$OUT"; }

          log "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          log "project=$PROJECT"
          log "dataset=$DATASET"

          if bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET" 2>/tmp/dataset.err | sed '/^WARNING:/d' >/tmp/dataset.json; then
            log 'dataset_exists=true'
          else
            log 'dataset_exists=false'
            sed 's/^/dataset_error=/' /tmp/dataset.err | tee -a "$OUT" || true
            exit 0
          fi

          if bq --project_id="$PROJECT" ls --format=prettyjson "$PROJECT:$DATASET" 2>/tmp/tables.err | sed '/^WARNING:/d' >/tmp/tables.json; then
            IDS=$(jq -r '.[].tableReference.tableId' /tmp/tables.json 2>/dev/null | sort | paste -sd, -)
            log "table_ids=$IDS"
          else
            log 'table_list_failed=true'
            sed 's/^/table_list_error=/' /tmp/tables.err | tee -a "$OUT" || true
          fi

          READY=1
          for T in ExportLog searchdata_url_impression searchdata_site_impression; do
            if bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET.$T" 2>/tmp/$T.err | sed '/^WARNING:/d' >/tmp/$T.json; then
              ROWS=$(jq -r '.numRows // "0"' /tmp/$T.json)
              MOD=$(jq -r '.lastModifiedTime // ""' /tmp/$T.json)
              log "$T.exists=true"
              log "$T.numRows=$ROWS"
              log "$T.lastModifiedTime=$MOD"
              if [[ "$ROWS" == "0" ]]; then READY=0; fi
            else
              log "$T.exists=false"
              log "$T.numRows=0"
              READY=0
            fi
          done
          log "ready=$READY"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## GSC BigQuery readiness probe'; echo; echo '```text'; cat /tmp/gsc-bq-readiness.txt 2>/dev/null || echo 'probe did not produce output'; echo '```'; } > /tmp/comment.md
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
