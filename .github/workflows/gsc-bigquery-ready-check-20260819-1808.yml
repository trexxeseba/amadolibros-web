name: GSC BigQuery readiness probe 20260819-1808

on:
  push:
    branches:
      - agent/gsc-bigquery-ready-check-20260819-1808

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check Search Console bulk export tables
        shell: bash
        run: |
          set -uo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT=/tmp/gsc-bq-ready.txt
          : > "$OUT"
          if bq ls --project_id="$PROJECT" --format=json "$PROJECT:$DATASET" >/tmp/tables.json 2>/tmp/bqerr.txt; then
            echo 'dataset_present=true' >> "$OUT"
            echo 'tables_listable=true' >> "$OUT"
          else
            echo 'dataset_present=false' >> "$OUT"
            echo 'tables_listable=false' >> "$OUT"
            cat /tmp/bqerr.txt >> "$OUT"
            cat "$OUT"
            exit 0
          fi
          ready=1
          for table in ExportLog searchdata_url_impression searchdata_site_impression; do
            if jq -e --arg t "$table" '.[] | select(.tableReference.tableId==$t)' /tmp/tables.json >/dev/null; then
              echo "$table.present=true" >> "$OUT"
              if count=$(bq query --project_id="$PROJECT" --use_legacy_sql=false --format=csv "SELECT COUNT(*) AS row_count FROM \`$PROJECT.$DATASET.$table\`" 2>/tmp/qerr.txt | tail -n +2 | tr -d '\r'); then
                echo "$table.rows=${count:-0}" >> "$OUT"
                if [ "${count:-0}" -le 0 ] 2>/dev/null; then ready=0; fi
              else
                echo "$table.query_error=true" >> "$OUT"
                cat /tmp/qerr.txt >> "$OUT"
                ready=0
              fi
            else
              echo "$table.present=false" >> "$OUT"
              ready=0
            fi
          done
          echo "READY=$ready" >> "$OUT"
          cat "$OUT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## GSC BigQuery readiness'; echo; echo '```text'; cat /tmp/gsc-bq-ready.txt 2>/dev/null || true; echo '```'; } >/tmp/comment.md
          gh issue comment 186 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
