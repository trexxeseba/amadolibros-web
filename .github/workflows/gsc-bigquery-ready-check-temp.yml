name: GSC BigQuery readiness temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check Search Console BigQuery export
        id: check
        shell: bash
        run: |
          set +e
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          RESULT=''

          if bq --project_id="$PROJECT" show "$PROJECT:$DATASET" >/dev/null 2>&1; then
            RESULT='dataset=present'
          else
            RESULT='dataset=missing'
          fi

          for T in ExportLog searchdata_url_impression searchdata_site_impression; do
            if bq --project_id="$PROJECT" show "$PROJECT:$DATASET.$T" >/dev/null 2>&1; then
              COUNT=$(bq --project_id="$PROJECT" query --use_legacy_sql=false --format=csv "SELECT COUNT(*) AS row_count FROM \`$PROJECT.$DATASET.$T\`" 2>/dev/null | tail -n 1 | tr -d '\r')
              if [[ -z "$COUNT" || ! "$COUNT" =~ ^[0-9]+$ ]]; then COUNT='query_error'; fi
              RESULT="$RESULT; $T=$COUNT"
            else
              RESULT="$RESULT; $T=missing"
            fi
          done

          echo "$RESULT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment readiness result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body "GSC BigQuery readiness check run $GITHUB_RUN_ID: $RESULT"
