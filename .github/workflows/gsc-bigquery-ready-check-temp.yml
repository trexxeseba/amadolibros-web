name: GSC BigQuery readiness temporary

on:
  push:
    branches:
      - agent/gsc-bigquery-ready-check-20260820-1804
    paths:
      - '.github/workflows/gsc-bigquery-ready-check-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
      - name: Inspect Search Console BigQuery export through metadata API
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          ROOT="https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT}/datasets/${DATASET}"
          OUT=/tmp/gsc-bq-status.md

          request() {
            local url="$1" body="$2"
            curl -sS -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Accept: application/json' -o "$body" -w '%{http_code}' "$url"
          }

          DATASET_HTTP=$(request "$ROOT" /tmp/dataset.json)
          TABLES_HTTP=$(request "$ROOT/tables?maxResults=1000" /tmp/tables.json)
          TABLE_IDS=''
          if [ "$TABLES_HTTP" = '200' ]; then
            TABLE_IDS=$(jq -r '[.tables[]?.tableReference.tableId] | join(",")' /tmp/tables.json)
          fi

          table_meta() {
            local table="$1" prefix="$2" body="/tmp/${prefix}.json" http rows
            http=$(request "$ROOT/tables/${table}" "$body")
            rows=0
            if [ "$http" = '200' ]; then rows=$(jq -r '.numRows // "0"' "$body"); fi
            printf '%s %s\n' "$http" "$rows"
          }

          read -r LOG_HTTP LOG_ROWS < <(table_meta 'ExportLog' 'exportlog')
          read -r URL_HTTP URL_ROWS < <(table_meta 'searchdata_url_impression' 'url')
          read -r SITE_HTTP SITE_ROWS < <(table_meta 'searchdata_site_impression' 'site')
          read -r ANON_HTTP ANON_ROWS < <(table_meta 'searchdata_anonymized_query' 'anon')

          READY=false
          if [ "$LOG_HTTP" = '200' ] && [ "$URL_HTTP" = '200' ] && [ "$SITE_HTTP" = '200' ] && { [ "${URL_ROWS:-0}" -gt 0 ] || [ "${SITE_ROWS:-0}" -gt 0 ]; }; then
            READY=true
          fi

          cat > "$OUT" <<EOF
<!-- GSC-BQ-AUTOMATION-CHECK -->
## GSC BigQuery readiness check — $(date -u +%Y-%m-%dT%H:%M:%SZ)

\`\`\`text
dataset_http=$DATASET_HTTP
tables_http=$TABLES_HTTP
table_ids=$TABLE_IDS
ExportLog_http=$LOG_HTTP
ExportLog_rows=$LOG_ROWS
url_http=$URL_HTTP
url_rows=$URL_ROWS
site_http=$SITE_HTTP
site_rows=$SITE_ROWS
anonymized_http=$ANON_HTTP
anonymized_rows=$ANON_ROWS
READY=$READY
\`\`\`
EOF
          cat "$OUT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-bq-status.md
