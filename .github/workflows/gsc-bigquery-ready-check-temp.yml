name: GSC BigQuery readiness temporary

on:
  push:
    branches:
      - agent/gsc-bigquery-ready-check-20260820-1804
    paths:
      - '.github/workflows/gsc-bigquery-ready-check-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect Search Console BigQuery export
        id: inspect
        shell: bash
        run: |
          set +e
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT=/tmp/gsc-bq-status.md
          echo '# GSC BigQuery readiness check' > "$OUT"
          echo >> "$OUT"
          echo "- Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT"
          echo '- Project: `amado-libros-analytics`' >> "$OUT"
          echo '- Dataset: `searchconsole`' >> "$OUT"
          echo >> "$OUT"

          echo '## Dataset listing' >> "$OUT"
          echo '```' >> "$OUT"
          bq ls --project_id="$PROJECT" "$PROJECT:$DATASET" >> "$OUT" 2>&1
          LS_RC=$?
          echo '```' >> "$OUT"
          echo "- bq ls exit: $LS_RC" >> "$OUT"
          echo >> "$OUT"

          SQL="SELECT table_name FROM \`$PROJECT.$DATASET.INFORMATION_SCHEMA.TABLES\` ORDER BY table_name"
          echo '## Tables' >> "$OUT"
          echo '```' >> "$OUT"
          bq query --project_id="$PROJECT" --use_legacy_sql=false --format=csv "$SQL" >> "$OUT" 2>&1
          TABLE_RC=$?
          echo '```' >> "$OUT"
          echo "- table query exit: $TABLE_RC" >> "$OUT"
          echo >> "$OUT"

          for T in ExportLog searchdata_url_impression searchdata_site_impression searchdata_anonymized_query; do
            echo "## $T" >> "$OUT"
            echo '```' >> "$OUT"
            bq query --project_id="$PROJECT" --use_legacy_sql=false --format=csv "SELECT COUNT(*) AS rows FROM \`$PROJECT.$DATASET.$T\`" >> "$OUT" 2>&1
            RC=$?
            echo '```' >> "$OUT"
            echo "- count exit: $RC" >> "$OUT"
            echo >> "$OUT"
          done

          if [ "$TABLE_RC" -eq 0 ]; then
            TABLES=$(bq query --project_id="$PROJECT" --use_legacy_sql=false --format=csv "$SQL" 2>/dev/null | tail -n +2 | tr -d '\r')
            if echo "$TABLES" | grep -qx 'ExportLog' && echo "$TABLES" | grep -qx 'searchdata_url_impression' && echo "$TABLES" | grep -qx 'searchdata_site_impression'; then
              URL_ROWS=$(bq query --project_id="$PROJECT" --use_legacy_sql=false --format=csv "SELECT COUNT(*) AS rows FROM \`$PROJECT.$DATASET.searchdata_url_impression\`" 2>/dev/null | tail -n 1 | tr -d '\r')
              SITE_ROWS=$(bq query --project_id="$PROJECT" --use_legacy_sql=false --format=csv "SELECT COUNT(*) AS rows FROM \`$PROJECT.$DATASET.searchdata_site_impression\`" 2>/dev/null | tail -n 1 | tr -d '\r')
              LOG_ROWS=$(bq query --project_id="$PROJECT" --use_legacy_sql=false --format=csv "SELECT COUNT(*) AS rows FROM \`$PROJECT.$DATASET.ExportLog\`" 2>/dev/null | tail -n 1 | tr -d '\r')
              echo "- Parsed row counts: ExportLog=$LOG_ROWS url=$URL_ROWS site=$SITE_ROWS" >> "$OUT"
              if [ "${URL_ROWS:-0}" -gt 0 ] || [ "${SITE_ROWS:-0}" -gt 0 ]; then
                echo '- READY: yes' >> "$OUT"
              else
                echo '- READY: no (tables exist but impression tables are empty)' >> "$OUT"
              fi
            else
              echo '- READY: no (required tables are not all present)' >> "$OUT"
            fi
          else
            echo '- READY: unknown (unable to query dataset metadata)' >> "$OUT"
          fi
          cat "$OUT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-bq-status.md
