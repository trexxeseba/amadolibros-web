name: GSC BigQuery readiness check temporary

on:
  push:
    branches:
      - agent/gsc-bigquery-ready-check-20260820
    paths:
      - '.github/workflows/gsc-bigquery-ready-check-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: amado-libros-analytics
      - name: Check Search Console export tables
        shell: bash
        run: |
          set +e
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT=/tmp/gsc-ready.txt
          : > "$OUT"
          echo '### GSC BigQuery readiness' >> "$OUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$OUT"
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT"
          echo "project=$PROJECT" >> "$OUT"
          echo "dataset=$DATASET" >> "$OUT"

          bq --project_id="$PROJECT" ls --format=csv "$PROJECT:$DATASET" >/tmp/tables.csv 2>/tmp/list.err
          rc=$?
          echo "list_rc=$rc" >> "$OUT"
          if [ "$rc" -ne 0 ]; then
            echo 'ready=false' >> "$OUT"
            echo 'list_error:' >> "$OUT"
            sed -n '1,10p' /tmp/list.err >> "$OUT"
            cat "$OUT"
            exit 0
          fi

          echo 'table_list:' >> "$OUT"
          cat /tmp/tables.csv >> "$OUT"

          grep -q 'ExportLog' /tmp/tables.csv; [ $? -eq 0 ] && export_present=true || export_present=false
          grep -q 'searchdata_url_impression' /tmp/tables.csv; [ $? -eq 0 ] && url_present=true || url_present=false
          grep -q 'searchdata_site_impression' /tmp/tables.csv; [ $? -eq 0 ] && site_present=true || site_present=false
          echo "ExportLog_present=$export_present" >> "$OUT"
          echo "url_present=$url_present" >> "$OUT"
          echo "site_present=$site_present" >> "$OUT"

          url_usable=false
          site_usable=false
          export_usable=false

          if [ "$export_present" = true ]; then
            bq --project_id="$PROJECT" --format=csv head -n 1 "$PROJECT:$DATASET.ExportLog" >/tmp/export.head 2>/tmp/export.err
            [ $? -eq 0 ] && [ "$(wc -l </tmp/export.head)" -gt 1 ] && export_usable=true
          fi
          if [ "$url_present" = true ]; then
            bq --project_id="$PROJECT" --format=csv head -n 1 "$PROJECT:$DATASET.searchdata_url_impression" >/tmp/url.head 2>/tmp/url.err
            [ $? -eq 0 ] && [ "$(wc -l </tmp/url.head)" -gt 1 ] && url_usable=true
          fi
          if [ "$site_present" = true ]; then
            bq --project_id="$PROJECT" --format=csv head -n 1 "$PROJECT:$DATASET.searchdata_site_impression" >/tmp/site.head 2>/tmp/site.err
            [ $? -eq 0 ] && [ "$(wc -l </tmp/site.head)" -gt 1 ] && site_usable=true
          fi

          echo "ExportLog_usable=$export_usable" >> "$OUT"
          echo "url_usable=$url_usable" >> "$OUT"
          echo "site_usable=$site_usable" >> "$OUT"

          ready=false
          if [ "$export_present" = true ] && [ "$url_present" = true ] && [ "$site_present" = true ] && [ "$url_usable" = true ] && [ "$site_usable" = true ]; then
            ready=true
          fi
          echo "ready=$ready" >> "$OUT"
          cat "$OUT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-ready.txt
