name: GSC BigQuery readiness check temporary

on:
  push:
    branches:
      - agent/gsc-bigquery-ready-check-20260820
    paths:
      - '.github/workflows/gsc-bigquery-ready-check-temp.yml'
  pull_request:
    paths:
      - '.github/workflows/gsc-bigquery-ready-check-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: amado-libros-analytics
      - name: Check Search Console export tables
        id: check
        shell: bash
        run: |
          set +e
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          LOCATION='US'
          OUT=/tmp/gsc-ready.txt
          : > "$OUT"

          echo '### GSC BigQuery readiness' >> "$OUT"
          echo >> "$OUT"
          echo "project=$PROJECT" >> "$OUT"
          echo "dataset=$DATASET" >> "$OUT"

          bq --project_id="$PROJECT" ls --format=csv "$PROJECT:$DATASET" >/tmp/tables.csv 2>/tmp/bqerr.txt
          RC=$?
          echo "list_rc=$RC" >> "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo 'dataset_access=ERROR' >> "$OUT"
            echo 'ready=false' >> "$OUT"
            echo 'error:' >> "$OUT"
            sed -n '1,12p' /tmp/bqerr.txt >> "$OUT"
            cat "$OUT"
            exit 0
          fi

          awk -F, 'NR>1 {gsub(/\r/,"",$1); gsub(/^"|"$/,"",$1); if($1!="") print $1}' /tmp/tables.csv >/tmp/table-names.txt
          echo 'tables:' >> "$OUT"
          sed 's/^/- /' /tmp/table-names.txt >> "$OUT"

          has(){ grep -Fxq "$1" /tmp/table-names.txt; }
          EXPORT='ExportLog'
          URL='searchdata_url_impression'
          SITE='searchdata_site_impression'
          ALTURL='searchdata_url_impression_by_hour'

          has "$EXPORT"; [ $? -eq 0 ] && export_present=true || export_present=false
          has "$URL"; [ $? -eq 0 ] && url_present=true || url_present=false
          has "$SITE"; [ $? -eq 0 ] && site_present=true || site_present=false
          if [ "$url_present" = false ]; then
            has "$ALTURL"; [ $? -eq 0 ] && URL="$ALTURL" && url_present=true
          fi

          echo "ExportLog_present=$export_present" >> "$OUT"
          echo "url_table=$URL" >> "$OUT"
          echo "url_present=$url_present" >> "$OUT"
          echo "site_table=$SITE" >> "$OUT"
          echo "site_present=$site_present" >> "$OUT"

          count_table(){
            local t="$1"
            local raw
            raw=$(bq query --project_id="$PROJECT" --location="$LOCATION" --use_legacy_sql=false --format=csv --quiet \
              "SELECT COUNT(*) AS c FROM \`$PROJECT.$DATASET.$t\`" 2>/tmp/queryerr.txt)
            local rc=$?
            if [ "$rc" -ne 0 ]; then echo 0; return 0; fi
            echo "$raw" | tail -n 1 | tr -d '\r'
          }

          export_rows=0; url_rows=0; site_rows=0
          [ "$export_present" = true ] && export_rows=$(count_table "$EXPORT")
          [ "$url_present" = true ] && url_rows=$(count_table "$URL")
          [ "$site_present" = true ] && site_rows=$(count_table "$SITE")

          echo "ExportLog_rows=${export_rows:-0}" >> "$OUT"
          echo "url_rows=${url_rows:-0}" >> "$OUT"
          echo "site_rows=${site_rows:-0}" >> "$OUT"

          ready=false
          if [ "$export_present" = true ] && [ "$url_present" = true ] && [ "$site_present" = true ] \
             && [ "${url_rows:-0}" -gt 0 ] 2>/dev/null && [ "${site_rows:-0}" -gt 0 ] 2>/dev/null; then
            ready=true
          fi
          echo "ready=$ready" >> "$OUT"
          cat "$OUT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-ready.txt
