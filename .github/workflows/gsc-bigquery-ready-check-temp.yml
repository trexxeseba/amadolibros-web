name: GSC BigQuery readiness check temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap
    paths:
      - '.github/workflows/gsc-bigquery-ready-check-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    if: github.event.head_commit.message == 'Run GSC BigQuery readiness check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: amado-libros-analytics
      - name: Inspect Search Console export tables
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT='/tmp/gsc-bq-status.txt'
          : > "$OUT"
          echo 'GSC_BQ_READY_CHECK' >> "$OUT"
          if ! bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET" >/tmp/dataset.json 2>/tmp/dataset.err; then
            echo 'dataset_exists=false' >> "$OUT"
            cat /tmp/dataset.err >> "$OUT" || true
          else
            echo 'dataset_exists=true' >> "$OUT"
            for TABLE in ExportLog searchdata_url_impression searchdata_site_impression; do
              if bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET.$TABLE" >/tmp/${TABLE}.json 2>/tmp/${TABLE}.err; then
                ROWS=$(python3 - <<PY
import json
p='/tmp/${TABLE}.json'
try:
    d=json.load(open(p))
    print(d.get('numRows','0'))
except Exception:
    print('0')
PY
)
                echo "table_${TABLE}_exists=true" >> "$OUT"
                echo "table_${TABLE}_numRows=${ROWS}" >> "$OUT"
              else
                echo "table_${TABLE}_exists=false" >> "$OUT"
                echo "table_${TABLE}_numRows=0" >> "$OUT"
              fi
            done
            for TABLE in searchdata_url_impression searchdata_site_impression; do
              if grep -q "table_${TABLE}_exists=true" "$OUT"; then
                if bq --project_id="$PROJECT" query --quiet --use_legacy_sql=false --format=csv \
                  "SELECT COUNT(*) AS rows, CAST(MAX(data_date) AS STRING) AS max_data_date FROM \`${PROJECT}.${DATASET}.${TABLE}\`" \
                  >/tmp/${TABLE}-query.csv 2>/tmp/${TABLE}-query.err; then
                  tail -n 1 /tmp/${TABLE}-query.csv | awk -F, -v t="$TABLE" '{gsub(/\"/,"",$0); print "query_" t "_rows=" $1; print "query_" t "_max_data_date=" $2}' >> "$OUT"
                else
                  echo "query_${TABLE}_error=true" >> "$OUT"
                  head -c 500 /tmp/${TABLE}-query.err >> "$OUT" || true
                  echo >> "$OUT"
                fi
              fi
            done
          fi
          cat "$OUT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## GSC BigQuery readiness check'; echo; echo '```text'; cat /tmp/gsc-bq-status.txt 2>/dev/null || echo 'check_failed_before_output'; echo '```'; } > /tmp/comment.md
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
