name: GSC BigQuery readiness check temporary

on:
  push:
    branches:
      - agent/gsc-bigquery-ready-check-20260820
    paths:
      - '.github/workflows/gsc-bigquery-ready-check-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: amado-libros-analytics
      - name: Check Search Console export tables
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          LOCATION='US'
          OUT=/tmp/gsc-ready.txt
          : > "$OUT"

          echo '### GSC BigQuery readiness' >> "$OUT"
          echo >> "$OUT"
          echo "project=$PROJECT" >> "$OUT"
          echo "dataset=$DATASET" >> "$OUT"

          if ! bq --project_id="$PROJECT" ls --format=json "$PROJECT:$DATASET" >/tmp/tables.json 2>/tmp/bqerr.txt; then
            echo 'dataset_access=ERROR' >> "$OUT"
            echo 'ready=false' >> "$OUT"
            echo 'error:' >> "$OUT"
            cat /tmp/bqerr.txt >> "$OUT"
            cat "$OUT"
            exit 0
          fi

          node <<'NODE' >/tmp/table-names.txt
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/tables.json','utf8')||'[]');
          for (const r of rows) {
            const name=r.tableReference?.tableId || r.id?.split('.').pop() || '';
            if (name) console.log(name);
          }
          NODE

          echo 'tables:' >> "$OUT"
          sed 's/^/- /' /tmp/table-names.txt >> "$OUT"

          has(){ grep -Fxq "$1" /tmp/table-names.txt; }
          EXPORT='ExportLog'
          URL='searchdata_url_impression'
          SITE='searchdata_site_impression'
          ALTURL='searchdata_url_impression_by_hour'

          has "$EXPORT" && export_present=true || export_present=false
          has "$URL" && url_present=true || url_present=false
          has "$SITE" && site_present=true || site_present=false
          if [ "$url_present" = false ] && has "$ALTURL"; then URL="$ALTURL"; url_present=true; fi

          echo "ExportLog_present=$export_present" >> "$OUT"
          echo "url_table=$URL" >> "$OUT"
          echo "url_present=$url_present" >> "$OUT"
          echo "site_table=$SITE" >> "$OUT"
          echo "site_present=$site_present" >> "$OUT"

          count_table(){
            local t="$1"
            bq query --project_id="$PROJECT" --location="$LOCATION" --use_legacy_sql=false --format=csv --quiet \
              "SELECT COUNT(*) AS c FROM \`$PROJECT.$DATASET.$t\`" | tail -n 1 | tr -d '\r'
          }

          export_rows=0; url_rows=0; site_rows=0
          if [ "$export_present" = true ]; then export_rows=$(count_table "$EXPORT" || echo 0); fi
          if [ "$url_present" = true ]; then url_rows=$(count_table "$URL" || echo 0); fi
          if [ "$site_present" = true ]; then site_rows=$(count_table "$SITE" || echo 0); fi

          echo "ExportLog_rows=$export_rows" >> "$OUT"
          echo "url_rows=$url_rows" >> "$OUT"
          echo "site_rows=$site_rows" >> "$OUT"

          ready=false
          if [ "$export_present" = true ] && [ "$url_present" = true ] && [ "$site_present" = true ] \
             && [ "${url_rows:-0}" -gt 0 ] && [ "${site_rows:-0}" -gt 0 ]; then
            ready=true
          fi
          echo "ready=$ready" >> "$OUT"
          cat "$OUT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-ready.txt
