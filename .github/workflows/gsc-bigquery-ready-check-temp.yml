name: GSC BigQuery readiness check temporary

on:
  push:
    branches:
      - agent/gsc-bigquery-ready-check-20260820
    paths:
      - '.github/workflows/gsc-bigquery-ready-check-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
      - name: Check Search Console export tables through BigQuery REST
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set +e
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          API='https://bigquery.googleapis.com/bigquery/v2'
          OUT=/tmp/gsc-ready.txt
          : > "$OUT"
          echo '### GSC BigQuery readiness' >> "$OUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$OUT"
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT"
          echo "project=$PROJECT" >> "$OUT"
          echo "dataset=$DATASET" >> "$OUT"

          request(){
            local url="$1" body="$2" codefile="$3"
            curl -sS -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Accept: application/json' \
              -o "$body" -w '%{http_code}' "$url" > "$codefile"
          }

          request "$API/projects/$PROJECT/datasets/$DATASET" /tmp/dataset.json /tmp/dataset.code
          dataset_http=$(cat /tmp/dataset.code)
          echo "dataset_http=$dataset_http" >> "$OUT"

          request "$API/projects/$PROJECT/datasets/$DATASET/tables?maxResults=1000" /tmp/tables.json /tmp/tables.code
          tables_http=$(cat /tmp/tables.code)
          echo "tables_http=$tables_http" >> "$OUT"
          if [ "$tables_http" = 200 ]; then
            node - <<'NODE' >/tmp/table-names.txt
            const fs=require('fs');
            const x=JSON.parse(fs.readFileSync('/tmp/tables.json','utf8')||'{}');
            for (const t of x.tables||[]) console.log(t.tableReference?.tableId||'');
            NODE
          else
            : > /tmp/table-names.txt
          fi
          echo "table_ids=$(paste -sd, /tmp/table-names.txt)" >> "$OUT"

          check_table(){
            local t="$1" key="$2"
            request "$API/projects/$PROJECT/datasets/$DATASET/tables/$t" "/tmp/$key.json" "/tmp/$key.code"
            local http=$(cat "/tmp/$key.code")
            local rows=0
            local present=false
            if [ "$http" = 200 ]; then
              present=true
              rows=$(node -e "const x=require('/tmp/$key.json'); console.log(Number(x.numRows||0))" 2>/dev/null)
              [ -z "$rows" ] && rows=0
            fi
            echo "${key}_http=$http" >> "$OUT"
            echo "${key}_present=$present" >> "$OUT"
            echo "${key}_rows=$rows" >> "$OUT"
          }

          check_table 'ExportLog' 'ExportLog'
          check_table 'searchdata_url_impression' 'url'
          check_table 'searchdata_site_impression' 'site'

          export_present=$(grep '^ExportLog_present=' "$OUT" | cut -d= -f2)
          url_present=$(grep '^url_present=' "$OUT" | cut -d= -f2)
          site_present=$(grep '^site_present=' "$OUT" | cut -d= -f2)
          url_rows=$(grep '^url_rows=' "$OUT" | cut -d= -f2)
          site_rows=$(grep '^site_rows=' "$OUT" | cut -d= -f2)

          ready=false
          if [ "$dataset_http" = 200 ] && [ "$tables_http" = 200 ] && \
             [ "$export_present" = true ] && [ "$url_present" = true ] && [ "$site_present" = true ] && \
             [ "${url_rows:-0}" -gt 0 ] 2>/dev/null && [ "${site_rows:-0}" -gt 0 ] 2>/dev/null; then
            ready=true
          fi
          echo "ready=$ready" >> "$OUT"
          cat "$OUT"
      - name: Comment tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gsc-ready.txt
