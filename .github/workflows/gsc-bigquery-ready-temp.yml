name: GSC BigQuery readiness temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap
    paths:
      - '.github/workflows/gsc-bigquery-ready-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check Search Console dataset and usable rows
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          SA='ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com'
          MEMBER="serviceAccount:${SA}"
          REPORT=/tmp/gsc-bq.txt
          : > "$REPORT"

          cleanup() {
            gcloud projects remove-iam-policy-binding "$PROJECT" --member="$MEMBER" --role='roles/bigquery.dataViewer' --condition=None --quiet >/dev/null 2>&1 || true
            gcloud projects remove-iam-policy-binding "$PROJECT" --member="$MEMBER" --role='roles/bigquery.jobUser' --condition=None --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud projects add-iam-policy-binding "$PROJECT" --member="$MEMBER" --role='roles/bigquery.metadataViewer' --condition=None --quiet >/dev/null
          gcloud projects add-iam-policy-binding "$PROJECT" --member="$MEMBER" --role='roles/bigquery.dataViewer' --condition=None --quiet >/dev/null
          gcloud projects add-iam-policy-binding "$PROJECT" --member="$MEMBER" --role='roles/bigquery.jobUser' --condition=None --quiet >/dev/null

          echo "checked_at=$(date -u +%FT%TZ)" >> "$REPORT"
          if bq --project_id="$PROJECT" show "$PROJECT:$DATASET" >/dev/null 2>&1; then
            echo 'DATASET_PRESENT=1' >> "$REPORT"
          else
            echo 'DATASET_PRESENT=0' >> "$REPORT"
            echo 'READY=0' >> "$REPORT"
            cat "$REPORT"
            exit 0
          fi

          TABLES=$(bq --project_id="$PROJECT" ls --format=csv "$PROJECT:$DATASET" 2>/dev/null | tail -n +2 | cut -d, -f1 | tr '\n' ',' | sed 's/,$//')
          echo "TABLES=${TABLES}" >> "$REPORT"

          READY=1
          for T in ExportLog searchdata_url_impression searchdata_site_impression; do
            if bq --project_id="$PROJECT" show "$PROJECT:$DATASET.$T" >/dev/null 2>&1; then
              echo "TABLE_${T}_PRESENT=1" >> "$REPORT"
              ROWS=$(bq --project_id="$PROJECT" query --use_legacy_sql=false --format=csv --quiet "SELECT COUNT(*) AS c FROM \`${PROJECT}.${DATASET}.${T}\`" 2>/dev/null | tail -n 1 | tr -d '\r' || echo 0)
              case "$ROWS" in ''|*[!0-9]*) ROWS=0;; esac
              echo "TABLE_${T}_ROWS=${ROWS}" >> "$REPORT"
            else
              echo "TABLE_${T}_PRESENT=0" >> "$REPORT"
              echo "TABLE_${T}_ROWS=0" >> "$REPORT"
              ROWS=0
              READY=0
            fi
            if [ "$T" != 'ExportLog' ] && [ "${ROWS:-0}" -le 0 ]; then READY=0; fi
          done
          echo "READY=$READY" >> "$REPORT"
          cat "$REPORT"
      - name: Comment tracking issue with result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- GSC-BQ-USABLE-CHECK -->'; echo '## GSC BigQuery usable-data check'; echo; echo '```text'; cat /tmp/gsc-bq.txt 2>/dev/null || echo 'check did not produce report'; echo '```'; } > /tmp/comment.md
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

# usable-data-monitor-ping 2026-08-20T12:52:00Z
