name: GSC BigQuery readiness probe 2

on:
  push:
    branches:
      - agent/gsc-bigquery-watch
    paths:
      - 'scripts/ops/check-gsc-bq-temp.sh'
      - '.github/workflows/gsc-bq-probe2-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run read-only probe
        run: bash scripts/ops/check-gsc-bq-temp.sh
      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```text'; cat /tmp/gsc-bq-status.txt 2>/dev/null || echo 'status=ERROR'; echo '```'; } >/tmp/comment.md
          gh issue comment 186 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
