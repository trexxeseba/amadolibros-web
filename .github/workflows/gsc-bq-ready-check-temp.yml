name: GSC BigQuery readiness check temporary

on:
  push:
    branches:
      - agent/gsc-bq-ready-check
    paths:
      - '.github/workflows/gsc-bq-ready-check-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: amado-libros-analytics
      - name: Check Search Console export tables
        shell: bash
        run: |
          set -u
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT='/tmp/gsc-bq-ready.txt'
          {
            date -u +"CHECKED_AT=%Y-%m-%dT%H:%M:%SZ"
            echo "PROJECT=$PROJECT"
            echo "DATASET=$DATASET"
            if ! bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET" >/tmp/dataset.json 2>/tmp/dataset.err; then
              echo 'DATASET_EXISTS=false'
              echo 'READY=false'
            else
              echo 'DATASET_EXISTS=true'
              ready=true
              for T in ExportLog searchdata_url_impression searchdata_site_impression; do
                if bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET.$T" > "/tmp/$T.json" 2>"/tmp/$T.err"; then
                  rows=$(python - <<PY
import json
p=json.load(open('/tmp/$T.json'))
print(p.get('numRows','0'))
PY
)
                  echo "TABLE=$T EXISTS=true ROWS=$rows"
                  if [ "${rows:-0}" = "0" ]; then ready=false; fi
                else
                  echo "TABLE=$T EXISTS=false ROWS=0"
                  ready=false
                fi
              done
              echo "READY=$ready"
            fi
          } > "$OUT"
          cat "$OUT"
      - name: Report readiness to probe issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## GSC BigQuery readiness'; echo; echo '```text'; cat /tmp/gsc-bq-ready.txt 2>/dev/null || echo 'CHECK_FAILED=true'; echo '```'; } > /tmp/comment.md
          gh issue comment 190 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
