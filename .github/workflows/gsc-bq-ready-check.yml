name: GSC BigQuery readiness check

on:
  push:
    branches:
      - automation/gsc-bq-ready-check
    paths:
      - '.github/workflows/gsc-bq-ready-check.yml'

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/gsc-bq-ready-check

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: amado-libros-analytics

      - name: Check Search Console export tables
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          OUT='.automation/gsc-bigquery-status.json'
          mkdir -p .automation

          dataset_exists=false
          exportlog_exists=false
          url_exists=false
          site_exists=false
          exportlog_rows=0
          url_rows=0
          site_rows=0
          url_max_date=''
          site_max_date=''

          if bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET" >/tmp/dataset.json 2>/tmp/dataset.err; then
            dataset_exists=true
          fi

          get_rows() {
            local table="$1"
            local tmp="/tmp/${table}.json"
            if bq --project_id="$PROJECT" show --format=prettyjson "$PROJECT:$DATASET.$table" >"$tmp" 2>/tmp/${table}.err; then
              jq -r '.numRows // "0"' "$tmp"
              return 0
            fi
            echo 0
            return 1
          }

          if [[ "$dataset_exists" == true ]]; then
            if exportlog_rows=$(get_rows ExportLog); then exportlog_exists=true; fi
            if url_rows=$(get_rows searchdata_url_impression); then url_exists=true; fi
            if site_rows=$(get_rows searchdata_site_impression); then site_exists=true; fi

            if [[ "$url_exists" == true ]]; then
              url_max_date=$(bq --project_id="$PROJECT" query --quiet --use_legacy_sql=false --format=csv \
                "SELECT CAST(MAX(data_date) AS STRING) FROM \`$PROJECT.$DATASET.searchdata_url_impression\`" 2>/dev/null | tail -n 1 | tr -d '"' || true)
            fi
            if [[ "$site_exists" == true ]]; then
              site_max_date=$(bq --project_id="$PROJECT" query --quiet --use_legacy_sql=false --format=csv \
                "SELECT CAST(MAX(data_date) AS STRING) FROM \`$PROJECT.$DATASET.searchdata_site_impression\`" 2>/dev/null | tail -n 1 | tr -d '"' || true)
            fi
          fi

          ready=false
          if [[ "$dataset_exists" == true && "$exportlog_exists" == true && "$url_exists" == true && "$site_exists" == true ]] \
             && (( exportlog_rows > 0 )) && (( url_rows > 0 || site_rows > 0 )); then
            ready=true
          fi

          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg project "$PROJECT" \
            --arg dataset "$DATASET" \
            --argjson ready "$ready" \
            --argjson dataset_exists "$dataset_exists" \
            --argjson exportlog_exists "$exportlog_exists" \
            --argjson url_exists "$url_exists" \
            --argjson site_exists "$site_exists" \
            --argjson exportlog_rows "$exportlog_rows" \
            --argjson url_rows "$url_rows" \
            --argjson site_rows "$site_rows" \
            --arg url_max_date "$url_max_date" \
            --arg site_max_date "$site_max_date" \
            '{checked_at:$checked_at,project:$project,dataset:$dataset,ready:$ready,dataset_exists:$dataset_exists,tables:{ExportLog:{exists:$exportlog_exists,rows:$exportlog_rows},searchdata_url_impression:{exists:$url_exists,rows:$url_rows,max_data_date:$url_max_date},searchdata_site_impression:{exists:$site_exists,rows:$site_rows,max_data_date:$site_max_date}}}' > "$OUT"

          cat "$OUT"

      - name: Persist check result on automation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .automation/gsc-bigquery-status.json
          git commit -m 'automation: record GSC BigQuery readiness' || exit 0
          git push origin HEAD:automation/gsc-bq-ready-check
