name: GSC BigQuery readiness temporary

on:
  push:
    branches:
      - agent/gcp-bigquery-org-bootstrap
    paths:
      - '.github/workflows/gsc-bq-ready-temp.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe Search Console export tables
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='amado-libros-analytics'
          DATASET='searchconsole'
          READY=0
          if ! bq ls --project_id="$PROJECT" --format=prettyjson "$PROJECT:$DATASET" >/tmp/tables.json 2>/tmp/bq.err; then
            echo 'ready=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE' >/tmp/table_names.txt
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/tables.json','utf8'));
          for (const r of rows) console.log(r.tableReference?.tableId || r.view?.tableReference?.tableId || '');
          NODE
          has(){ grep -Fxq "$1" /tmp/table_names.txt; }
          if has ExportLog && has searchdata_url_impression && has searchdata_site_impression; then
            EXPORT_ROWS=$(bq query --use_legacy_sql=false --format=csv --quiet "SELECT COUNT(*) AS n FROM \`$PROJECT.$DATASET.ExportLog\`" | tail -n1 | tr -d '\r' || echo 0)
            URL_ROWS=$(bq query --use_legacy_sql=false --format=csv --quiet "SELECT COUNT(*) AS n FROM \`$PROJECT.$DATASET.searchdata_url_impression\`" | tail -n1 | tr -d '\r' || echo 0)
            SITE_ROWS=$(bq query --use_legacy_sql=false --format=csv --quiet "SELECT COUNT(*) AS n FROM \`$PROJECT.$DATASET.searchdata_site_impression\`" | tail -n1 | tr -d '\r' || echo 0)
            if [[ "${EXPORT_ROWS:-0}" =~ ^[0-9]+$ ]] && [[ "${URL_ROWS:-0}" =~ ^[0-9]+$ ]] && [[ "${SITE_ROWS:-0}" =~ ^[0-9]+$ ]] && (( EXPORT_ROWS > 0 )) && (( URL_ROWS > 0 || SITE_ROWS > 0 )); then
              READY=1
              printf 'EXPORT_ROWS=%s\nURL_ROWS=%s\nSITE_ROWS=%s\n' "$EXPORT_ROWS" "$URL_ROWS" "$SITE_ROWS" >/tmp/counts.env
            fi
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
      - name: Comment only when export is usable
        if: steps.probe.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source /tmp/counts.env
          gh issue comment 181 --repo "$GITHUB_REPOSITORY" --body "GSC_BIGQUERY_READY: Search Console bulk export is usable in amado-libros-analytics.searchconsole. ExportLog rows=$EXPORT_ROWS; searchdata_url_impression rows=$URL_ROWS; searchdata_site_impression rows=$SITE_ROWS."
