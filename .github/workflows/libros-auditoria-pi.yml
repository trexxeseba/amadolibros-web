name: Libros auditoría PI (solo lectura)

# Recorre las publicaciones de Amado Libros (440298103) con el filtro de propiedad intelectual de
# Vintage y lista las riesgosas. Sólo GET: no cambia ninguna publicación. Ver
# scripts/vintage-cloud/auditoria-libros.mjs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libros-auditoria-pi
  cancel-in-progress: false

jobs:
  leer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar Amado Libros con el filtro de propiedad intelectual
        run: node scripts/vintage-cloud/auditoria-libros.mjs
