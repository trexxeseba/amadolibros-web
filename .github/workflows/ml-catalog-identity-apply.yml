name: ML catalog identity one-shot

on:
  push:
    branches:
      - agent/ml-catalog-identity-audit-1
    paths:
      - '.github/workflows/ml-catalog-identity-apply.yml'

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ml-catalog-identity-audit-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply catalog identity patch
        run: |
          python scripts/ops/ml-catalog-identity-patch.py
          node --check worker-sync/meli-catalog.js
          node --check worker-sync/index.js
          node --test worker-sync/__tests__/meli-catalog.test.js
          git diff --check
      - name: Commit implementation and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-sync/meli-catalog.js worker-sync/index.js worker-sync/__tests__/meli-catalog.test.js
          git commit -m 'ML-CATALOG-IDENTITY-1: preserve catalog listing identity signals'
          git rm .github/workflows/ml-catalog-identity-apply.yml scripts/ops/ml-catalog-identity-patch.py
          git commit -m 'ML catalog identity: remove temporary helpers'
          git push origin HEAD:agent/ml-catalog-identity-audit-1
