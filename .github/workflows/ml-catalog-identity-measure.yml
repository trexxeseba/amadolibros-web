name: ML catalog identity isolated measure

on:
  push:
    branches:
      - agent/ml-catalog-identity-audit-1
    paths:
      - '.github/workflows/ml-catalog-identity-measure.yml'

permissions:
  contents: write

jobs:
  measure-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ml-catalog-identity-audit-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Upload isolated Worker version
        id: upload
        working-directory: worker-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx wrangler@4.107.0 versions upload --preview-alias catalog-identity-audit --keep-vars --message "ML catalog identity read-only audit")
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
      - name: Measure without publishing
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          RESPONSE=$(curl -sS --max-time 900 -w "\nHTTP_STATUS:%{http_code}" -X POST "$PREVIEW_URL/measure" -H "Authorization: Bearer $SYNC_SECRET")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP status: $HTTP_STATUS"
          echo "$BODY" | node -e '
            let input=""; process.stdin.on("data",c=>input+=c); process.stdin.on("end",()=>{
              const r=JSON.parse(input); if(r.status!=="measured"||r.published!==false) throw new Error("measure did not remain read-only");
              console.log("CATALOG_IDENTITY="+JSON.stringify(r.catalog.catalog_identity));
              console.log("CATALOG_TOTALS="+JSON.stringify({total:r.catalog.total,active:r.catalog.active,paused:r.catalog.paused}));
            });'
          test "$HTTP_STATUS" = "200"
      - name: Remove temporary measure workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ml-catalog-identity-measure.yml
          git commit -m 'ML catalog identity: remove temporary measure workflow'
          git push origin HEAD:agent/ml-catalog-identity-audit-1
