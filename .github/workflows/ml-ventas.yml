name: ML ventas (motor de reposición)

# Ventas reales de Mercado Libre guardadas en D1 por el Worker amadolibros-sync
# (worker-sync/ml-sales.js). Sólo lee ML. El cron de 5 minutos del Worker ya
# avanza el backfill y la actualización horaria; este workflow sirve para
# completarlo de una vez y ver conteos. El repo es público: los logs de Actions
# también, así que acá NUNCA se imprimen ventas por ISBN, títulos ni precios.
# Las consultas por ISBN/título van directo al Worker (POST /sales/query).

# Sólo manual: editar este archivo no dispara nada contra producción.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'status | backfill | incremental | sweep'
        type: choice
        options: [status, backfill, incremental, sweep]
        default: status

concurrency:
  group: ml-ventas
  cancel-in-progress: false

jobs:
  ventas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    env:
      WORKER: https://amadolibros-sync.undiaes.workers.dev
      SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      ACCION: ${{ inputs.accion }}
    steps:
      - name: Esperar a que el Worker exponga /sales
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SYNC_SECRET" "$WORKER/sales/status")
            [ "$code" = "200" ] && exit 0
            echo "HTTP $code, esperando deploy..."; sleep 15
          done
          exit 1

      - name: Ejecutar
        run: |
          set -euo pipefail
          call() { curl -sS --max-time 120 -H "Authorization: Bearer $SYNC_SECRET" -H 'Content-Type: application/json' "$@"; }
          case "$ACCION" in
            backfill|incremental|sweep)
              mode=$([ "$ACCION" = backfill ] && echo auto || echo "$ACCION")
              for i in $(seq 1 60); do
                r=$(call -X POST "$WORKER/sales/sync" -d "{\"pages\":20,\"mode\":\"$mode\"}")
                echo "$r" | jq -c '{state,pages,code}'
                state=$(echo "$r" | jq -r .state)
                code=$(echo "$r" | jq -r '.code // ""')
                [ "$code" = "ml_http_429" ] && break
                case "$state" in
                  backfill|partial) mode=auto ;;
                  busy) sleep 20 ;;
                  error) sleep 30 ;;
                  *) break ;;
                esac
              done
              ;;
          esac

      - name: Estado
        if: always()
        run: |
          curl -sS -H "Authorization: Bearer $SYNC_SECRET" "$WORKER/sales/status"             | jq '{lines_with_isbn_pct:(if .lines>0 then (100*.lines_with_isbn/.lines|floor) else null end),phase:.cursor.phase,filter:.cursor.inc_filter.name,last_state:.last_result.state,errors_in_row:.last_result.errors_in_row}'             | tee -a "$GITHUB_STEP_SUMMARY"
