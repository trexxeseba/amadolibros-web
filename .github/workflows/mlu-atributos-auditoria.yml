name: MLU — auditoría de atributos de libros

# SOLO LECTURA. Recorre las publicaciones activas de Amado Libros a través de la
# ruta /attribute-audit del Worker (protegida por SYNC_SECRET) y genera el informe
# de atributos faltantes. No escribe en Mercado Libre ni toca el sitio.
# Sólo corre a mano (workflow_dispatch) y exige que el Worker ya esté desplegado.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlu-atributos-auditoria
  cancel-in-progress: false

jobs:
  audit:
    name: Auditoría de atributos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Leer atributos crudos (solo lectura)
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: node scripts/mercadolibre/attribute-audit-fetch.mjs "$RUNNER_TEMP/mlu-items-raw.json"

      - name: Generar informe
        run: node scripts/mercadolibre/attribute-audit.mjs --raw "$RUNNER_TEMP/mlu-items-raw.json" --out reports/mlu-atributos

      - name: Publicar resumen
        if: always()
        run: |
          if [ -f reports/mlu-atributos/README.md ]; then
            cat reports/mlu-atributos/README.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlu-atributos-${{ github.run_id }}
          path: reports/mlu-atributos/
          if-no-files-found: warn
          retention-days: 30
