name: MLU — auditoría de atributos de libros
on:
  workflow_dispatch:
    inputs:
      review_ids:
        description: '1 a 100 IDs propios separados por comas'
        required: false
        type: string
      operation:
        description: 'Operación sobre la tanda autorizada de 90 propuestas'
        type: choice
        default: read
        options: [read, preflight90, apply90, verify90, export90]
      authorization_hash:
        description: 'Hash explícito requerido para la carga autorizada'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: mlu-review-hundred-groups
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/codex/attribute-review-100-links'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Test read-only guards
        run: node --test scripts/__tests__/read-hundred-groups.test.mjs scripts/__tests__/apply-approved-hundred.test.mjs scripts/__tests__/apply-approved-ninety.test.mjs
      - name: Read groups without writes or deployments
        if: inputs.operation == 'read' || inputs.operation == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REVIEW_IDS: ${{ inputs.review_ids }}
        run: node scripts/mercadolibre/read-approved-ninety-groups.mjs artifacts/ninety-review
      - name: Revalidate ninety-approved scope without item writes
        if: inputs.operation == 'preflight90' || inputs.operation == 'apply90'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/mercadolibre/apply-approved-ninety.mjs preflight artifacts/ninety-review
      - name: Apply only authorized still-missing bibliographic attributes
        if: inputs.operation == 'apply90'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTHORIZED_REVIEW_HASH: ${{ inputs.authorization_hash }}
        run: node scripts/mercadolibre/apply-approved-ninety.mjs apply artifacts/ninety-review
      - name: Verify receipts and protected fields
        if: always() && (inputs.operation == 'apply90' || inputs.operation == 'verify90')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/mercadolibre/apply-approved-ninety.mjs verify artifacts/ninety-review
      - name: Export receipts and full readback evidence
        if: always() && (inputs.operation == 'apply90' || inputs.operation == 'verify90' || inputs.operation == 'export90')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/mercadolibre/apply-approved-ninety.mjs export artifacts/ninety-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ninety-groups-${{ github.run_id }}
          path: artifacts/ninety-review/
          retention-days: 30
          if-no-files-found: warn
