name: MLU — auditoría de atributos de libros
on:
  workflow_dispatch:
    inputs:
      review_ids:
        description: '1 a 100 IDs propios separados por comas'
        required: false
        type: string
      operation:
        description: 'Tanda autorizada de 33 cambios'
        type: choice
        default: read
        options: [read, preflight33, apply33, verify33, export33]
      authorization_hash:
        description: 'Hash de la autorización concreta; requerido para cargar'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: mlu-review-hundred-groups
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/codex/attribute-review-100-links'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Test read-only guards
        run: node --test scripts/__tests__/read-hundred-groups.test.mjs scripts/__tests__/apply-approved-hundred.test.mjs scripts/__tests__/apply-approved-ninety.test.mjs scripts/__tests__/apply-approved-thirty-three.test.mjs
      - name: Read groups without writes or deployments
        if: inputs.operation == 'read' || inputs.operation == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REVIEW_IDS: ${{ inputs.review_ids }}
        run: node scripts/mercadolibre/read-approved-ninety-groups.mjs artifacts/ninety-review
      - name: Revalidate all 33 approved changes without item writes
        if: inputs.operation == 'preflight33' || inputs.operation == 'apply33'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/mercadolibre/apply-approved-thirty-three.mjs preflight artifacts/thirty-three-review
      - name: Apply approved changes with durable backups
        if: inputs.operation == 'apply33'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTHORIZED_REVIEW_HASH: ${{ inputs.authorization_hash }}
        run: node scripts/mercadolibre/apply-approved-thirty-three.mjs apply artifacts/thirty-three-review
      - name: Verify all linked values and protected fields
        if: always() && (inputs.operation == 'apply33' || inputs.operation == 'verify33')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/mercadolibre/apply-approved-thirty-three.mjs verify artifacts/thirty-three-review
      - name: Export receipts and full readback
        if: always() && (inputs.operation == 'apply33' || inputs.operation == 'verify33' || inputs.operation == 'export33')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/mercadolibre/apply-approved-thirty-three.mjs export artifacts/thirty-three-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thirty-three-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
