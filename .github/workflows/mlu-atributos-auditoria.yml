name: MLU — auditoría de atributos de libros
on:
  workflow_dispatch:
    inputs:
      review_ids:
        description: '100 IDs propios separados por comas (lectura)'
        required: false
        type: string
      operation:
        description: 'Operación fija sobre revisión autorizada de 280 atributos'
        required: true
        default: read
        type: choice
        options:
          - read
          - preflight
          - apply
          - verify
      authorization_hash:
        description: 'Hash del informe autorizado, obligatorio para apply'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mlu-attributes-authorized-writes
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/codex/attribute-review-100-links'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Test authorization and preservation guards
        run: node --test scripts/__tests__/apply-approved-hundred.test.mjs scripts/__tests__/read-hundred-groups.test.mjs scripts/__tests__/approved-twenty.test.mjs scripts/__tests__/approved-four.test.mjs
      - name: Read groups
        if: inputs.operation == 'read'
        env:
          REVIEW_IDS: ${{ inputs.review_ids }}
        run: node scripts/mercadolibre/read-hundred-groups.mjs artifacts/hundred-review
      - name: Preflight all 100 groups without writes
        if: inputs.operation == 'preflight' || inputs.operation == 'apply'
        run: node scripts/mercadolibre/apply-approved-hundred.mjs preflight artifacts/hundred-apply
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'preflight' || inputs.operation == 'apply'
        with:
          name: hundred-preflight-${{ github.run_id }}
          path: artifacts/hundred-apply/preflight.json
          retention-days: 30
          if-no-files-found: error
      - name: Apply only the authorized unchanged fields with persistent receipts
        if: inputs.operation == 'apply'
        env:
          AUTHORIZED_REVIEW_HASH: ${{ inputs.authorization_hash }}
        run: node scripts/mercadolibre/apply-approved-hundred.mjs apply artifacts/hundred-apply
      - name: Final verification of all attempted groups
        if: (success() && inputs.operation == 'apply') || inputs.operation == 'verify'
        run: node scripts/mercadolibre/apply-approved-hundred.mjs verify artifacts/hundred-apply
      - name: Export persistent receipts even after interruption
        if: always() && (inputs.operation == 'apply' || inputs.operation == 'verify')
        run: node scripts/mercadolibre/apply-approved-hundred.mjs export artifacts/hundred-apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hundred-operation-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
