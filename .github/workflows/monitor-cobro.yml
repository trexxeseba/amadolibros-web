name: Checkly - baja de controles

# Baja autorizada por Seba el 26/11/2026, después de confirmar UptimeRobot.
# Este workflow ya no crea, activa ni prueba controles en Checkly.
# Puede repetirse: apaga, silencia y desuscribe los seis controles conocidos.
on:
  workflow_dispatch:
  push:
    branches: [main, codex/checkly-retire-20261126]
    paths:
      - scripts/monitoring/checkly-retire.mjs
      - scripts/monitoring/checkly-cobro.mjs
      - .github/workflows/monitor-cobro.yml

permissions:
  contents: read

concurrency:
  group: monitor-cobro
  cancel-in-progress: false

jobs:
  retire:
    if: github.repository == 'trexxeseba/amadolibros-web'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar alcance y protección contra reactivación
        run: node --test functions/__tests__/checkly-retire.test.js
      - name: Desactivar y verificar Checkly
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          OWNER_CHECKLY_RETIRE: '2026-11-26'
        run: node scripts/monitoring/checkly-retire.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkly-retired
          path: artifacts/checkly-retired/
          retention-days: 30
