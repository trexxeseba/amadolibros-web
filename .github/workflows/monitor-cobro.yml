name: Alarmas del cobro (Checkly)

# Estado, alta y simulacro de las alarmas del cobro en Checkly.
#   estado     solo lee: plan, controles y canales de aviso.
#   aplicar    crea o actualiza los controles del cobro y los canales de correo.
#   simulacro  control temporal que falla y se recupera; manda los dos avisos y se borra.
# Al fusionar cambios de estas alarmas a main se aplica solo, después de
# esperar a que /api/checkout-health esté publicado y responda bien.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'estado, aplicar o simulacro'
        type: choice
        options: [estado, aplicar, simulacro]
        default: estado
  push:
    branches: [main, agent/alarmas-cobro]
    paths:
      - scripts/monitoring/checkly-cobro.mjs
      - .github/workflows/monitor-cobro.yml
      - scripts/monitoring/accion-en-rama.txt

permissions:
  contents: read

concurrency:
  group: monitor-cobro
  cancel-in-progress: false

jobs:
  checkly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Elegir acción
        id: accion
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then accion="${{ inputs.accion }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then accion="aplicar"
          else accion="$(tr -d '[:space:]' < scripts/monitoring/accion-en-rama.txt 2>/dev/null || echo estado)"; fi
          case "$accion" in estado|simulacro) ;; aplicar) [ "${{ github.ref_name }}" = "main" ] || accion="estado" ;; *) accion="estado" ;; esac
          echo "accion=$accion" >> "$GITHUB_OUTPUT"
      - name: Ejecutar
        run: node scripts/monitoring/checkly-cobro.mjs "${{ steps.accion.outputs.accion }}"
