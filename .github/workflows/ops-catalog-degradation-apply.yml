name: OPS catalog degradation one-shot

on:
  push:
    branches:
      - agent/ops-catalog-degradation-1
    paths:
      - '.github/workflows/ops-catalog-degradation-apply.yml'

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-catalog-degradation-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply patch
        run: node scripts/ops/apply-catalog-degradation.mjs
      - name: Validate
        run: |
          node --check functions/catalogo.js
          node --test functions/__tests__/catalogo-degradation.test.js functions/__tests__/catalogo-categories.test.js
          git diff --check
      - name: Commit and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/catalogo.js functions/__tests__/catalogo-degradation.test.js
          git commit -m 'OPS-CATALOG-DEGRADATION-1: return 503 when active catalog is unavailable'
          git rm -f .github/workflows/ops-catalog-degradation-apply.yml scripts/ops/apply-catalog-degradation.mjs
          git commit -m 'OPS catalog: remove temporary degradation helpers'
          git push origin HEAD:agent/ops-catalog-degradation-1
