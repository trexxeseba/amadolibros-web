name: OPS hardening compose one-shot

on:
  push:
    branches:
      - agent/ops-hardening-batch-1
    paths:
      - '.github/workflows/ops-hardening-compose.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-hardening-batch-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Merge A2 and A4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/ops-sync-ratelimit-observability-1 agent/ops-status-freshness-policy-1 agent/ops-catalog-degradation-1
          git merge --no-edit origin/agent/ops-sync-ratelimit-observability-1
          git merge --no-edit origin/agent/ops-status-freshness-policy-1
      - name: Merge A3 or stop on conflict
        run: git merge --no-edit origin/agent/ops-catalog-degradation-1
      - name: Validate combined hardening
        run: |
          node --check worker-sync/meli-catalog.js
          node --check worker-sync/index.js
          node --check 'functions/api/[[route]].js'
          node --check functions/catalogo.js
          node --test worker-sync/__tests__/mlget-rate-limit.test.js worker-sync/__tests__/run-sync-no-partial-publish.test.js
          node --test functions/__tests__/status-freshness-policy.test.js functions/__tests__/catalogo-degradation.test.js functions/__tests__/catalogo-paginacion.test.js
          git diff --check
      - name: Remove helper and push
        run: |
          git rm .github/workflows/ops-hardening-compose.yml
          git commit -m 'OPS hardening: remove temporary compose workflow'
          git push origin HEAD:agent/ops-hardening-batch-1
