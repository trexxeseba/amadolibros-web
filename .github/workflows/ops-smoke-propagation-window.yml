name: OPS smoke propagation window one-shot

on:
  push:
    branches:
      - agent/ops-hardening-batch-1
    paths:
      - '.github/workflows/ops-smoke-propagation-window.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-hardening-batch-1
      - name: Extend propagation wait without weakening assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy.yml')
          s=p.read_text()
          old="          SMOKE_MAX_ATTEMPTS: '6'"
          new="          # Pages/custom-domain propagation can exceed 60s; assertions remain unchanged.\n          SMOKE_MAX_ATTEMPTS: '18'"
          if s.count(old) != 1:
              raise SystemExit(f'expected one smoke attempts marker, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          grep -A6 'Smoke test production' .github/workflows/deploy.yml
      - name: Commit and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy.yml
          git commit -m 'OPS-SMOKE-PROPAGATION-1: allow three-minute Pages propagation'
          git rm .github/workflows/ops-smoke-propagation-window.yml
          git commit -m 'OPS smoke: remove temporary propagation helper'
          git push origin HEAD:agent/ops-hardening-batch-1
