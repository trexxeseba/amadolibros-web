name: OPS smoke robots expectation one-shot

on:
  push:
    branches:
      - agent/ops-hardening-batch-1
    paths:
      - '.github/workflows/ops-smoke-robots-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-hardening-batch-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Align smoke with canonical noindex follow policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke-production.js')
          s=p.read_text()
          old="{ path: '/catalogo?q=zzzinexistente999', kind: 'html', canonical: `${BASE_URL}/catalogo`, robots: 'noindex' }"
          new="{ path: '/catalogo?q=zzzinexistente999', kind: 'html', canonical: `${BASE_URL}/catalogo`, robots: 'noindex, follow' }"
          if s.count(old) != 1:
              raise SystemExit(f'expected one route marker, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --check scripts/smoke-production.js
          grep "catalogo?q=zzzinexistente999" scripts/smoke-production.js
      - name: Commit implementation and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-production.js
          git commit -m 'OPS-SMOKE-ROBOTS-1: require noindex follow for search results'
          git rm .github/workflows/ops-smoke-robots-fix.yml
          git commit -m 'OPS smoke: remove temporary robots helper'
          git push origin HEAD:agent/ops-hardening-batch-1
