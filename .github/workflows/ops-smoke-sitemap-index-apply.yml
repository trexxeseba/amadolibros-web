name: OPS smoke sitemap index one-shot

on:
  push:
    branches:
      - agent/ops-smoke-sitemap-index-1
    paths:
      - '.github/workflows/ops-smoke-sitemap-index-apply.yml'

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-smoke-sitemap-index-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply smoke patch
        run: node scripts/ops/apply-smoke-sitemap-index.mjs
      - name: Validate sitemap smoke
        run: |
          node --check scripts/smoke-production.js
          node --test functions/__tests__/smoke-sitemap-index.test.js
          git diff --check
      - name: Commit implementation and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-production.js functions/__tests__/smoke-sitemap-index.test.js
          git commit -m 'OPS-SMOKE-SITEMAP-1: validate sitemap index and segments'
          git rm .github/workflows/ops-smoke-sitemap-index-apply.yml scripts/ops/apply-smoke-sitemap-index.mjs
          git commit -m 'OPS smoke: remove temporary sitemap helpers'
          git push origin HEAD:agent/ops-smoke-sitemap-index-1
