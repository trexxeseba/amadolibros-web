name: OPS status freshness policy one-shot

on:
  push:
    branches:
      - agent/ops-status-freshness-policy-1
    paths:
      - '.github/workflows/ops-status-freshness-policy-apply.yml'

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-status-freshness-policy-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply policy patch
        run: node scripts/ops/apply-status-freshness-policy.mjs
      - name: Validate
        run: |
          node --check 'functions/api/[[route]].js'
          node --check functions/_shared/status-policy.js
          node --test functions/__tests__/status-freshness-policy.test.js
          git diff --check
      - name: Commit and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'functions/api/[[route]].js' functions/_shared/status-policy.js functions/__tests__/status-freshness-policy.test.js
          git commit -m 'OPS-STATUS-FRESHNESS-1: centralize status thresholds'
          git rm -f .github/workflows/ops-status-freshness-policy-apply.yml scripts/ops/apply-status-freshness-policy.mjs
          git commit -m 'OPS status: remove temporary policy helpers'
          git push origin HEAD:agent/ops-status-freshness-policy-1
