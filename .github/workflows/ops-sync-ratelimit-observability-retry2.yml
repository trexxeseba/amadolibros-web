name: OPS sync 429 observability retry2 one-shot

on:
  push:
    branches:
      - agent/ops-sync-ratelimit-observability-1
    paths:
      - '.github/workflows/ops-sync-ratelimit-observability-retry2.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-sync-ratelimit-observability-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Fix generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/ops/apply-sync-ratelimit-observability.mjs')
          s = p.read_text()

          # 1) Fix nested template literal in inserted test.
          old = '  const serialized = `${summaryEntry.value}${detailEntry.value}`;'
          new = '  const serialized = summaryEntry.value + detailEntry.value;'
          if s.count(old) != 1:
              raise SystemExit(f'expected interpolation match once, got {s.count(old)}')
          s = s.replace(old, new)

          # 2) Add replaceFirst helper so the first identical mlGet call is scan;
          # after that replacement the second call is uniquely details.
          anchor = '''function replaceOnce(source, from, to, label) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: esperado 1 match, encontrados ${count}`);
            return source.replace(from, to);
          }
          '''
          helper = anchor + '''\nfunction replaceFirst(source, from, to, label) {
            const index = source.indexOf(from);
            if (index < 0) throw new Error(`${label}: pattern no encontrado`);
            return source.slice(0, index) + to + source.slice(index + from.length);
          }
          '''
          if s.count(anchor) != 1:
              raise SystemExit(f'helper anchor count {s.count(anchor)}')
          s = s.replace(anchor, helper)

          call = '''  s = replaceOnce(
            s,
            `      const data = await mlGet(url, accessToken, { ...mlGetDeps, retryBudget });`,
          '''
          if s.count(call) != 2:
              raise SystemExit(f'expected two mlGet replacement calls, got {s.count(call)}')
          s = s.replace(call, call.replace('replaceOnce', 'replaceFirst'), 1)
          p.write_text(s)
          PY
          node --check scripts/ops/apply-sync-ratelimit-observability.mjs
      - name: Apply patch
        run: node scripts/ops/apply-sync-ratelimit-observability.mjs
      - name: Validate targeted tests
        run: |
          node --check worker-sync/meli-catalog.js
          node --check worker-sync/index.js
          node --test worker-sync/__tests__/mlget-rate-limit.test.js worker-sync/__tests__/run-sync-no-partial-publish.test.js
          git diff --check
      - name: Commit implementation and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-sync/meli-catalog.js worker-sync/index.js worker-sync/__tests__/mlget-rate-limit.test.js worker-sync/__tests__/run-sync-no-partial-publish.test.js
          git commit -m 'OPS-SYNC-RATELIMIT-1: instrument ML retry context'
          git rm \
            .github/workflows/ops-sync-ratelimit-observability-apply.yml \
            .github/workflows/ops-sync-ratelimit-observability-retry.yml \
            .github/workflows/ops-sync-ratelimit-observability-retry2.yml \
            scripts/ops/apply-sync-ratelimit-observability.mjs
          git commit -m 'OPS sync: remove temporary observability helpers'
          git push origin HEAD:agent/ops-sync-ratelimit-observability-1
