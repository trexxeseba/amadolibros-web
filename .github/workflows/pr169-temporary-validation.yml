name: PR 169 temporary validation

on:
  push:
    branches:
      - agent/gsc-demand-priority-links

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Syntax, tests and both checkout builds
        id: ci
        run: bash scripts/validate-ci.sh

      - name: Install Astro dependencies
        working-directory: astro-front
        run: npm ci --no-audit --no-fund

      - name: Build protected Preview
        id: build_preview
        working-directory: astro-front
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_GA_ID: ''
          PUBLIC_CHECKOUT_ENABLED: 'false'
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAD6E9kz8K3comwjj'
          PUBLIC_TURNSTILE_ALLOWED_HOSTS: '.amadolibros-web.pages.dev'
        run: npm run build

      - name: Deploy isolated PR 169 Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx wrangler@3.114.17 pages deploy ./astro-front/dist \
            --project-name amadolibros-web --branch pr-169)
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' | tail -1)
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for Preview propagation
        id: propagation
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            HOME_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PREVIEW_URL/")
            FEED_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PREVIEW_URL/feed.xml")
            [ "$HOME_CODE" = "200" ] && [ "$FEED_CODE" = "200" ] && exit 0
            echo "Preview propagándose: intento $attempt/8, home HTTP $HOME_CODE, feed HTTP $FEED_CODE."
            sleep 10
          done
          exit 1

      - name: Audit protected Preview commerce
        id: commerce
        env:
          COMMERCE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          COMMERCE_OUTPUT_DIR: artifacts/commerce-preview
          COMMERCE_IMAGE_LIMIT: '80'
          COMMERCE_PAGE_LIMIT: '80'
          COMMERCE_CONCURRENCY: '10'
          COMMERCE_EXPECT_INDEXABLE: 'false'
          COMMERCE_FAIL_ON_CRITICAL: 'true'
        run: node scripts/commerce/full-commerce-audit.mjs

      - name: Audit by-request hub link graph
        id: seo
        env:
          SEO_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SEO_EXPECT_INDEXABLE: 'false'
          SEO_OUTPUT_DIR: artifacts/seo-order-hub-preview
          SEO_CONCURRENCY: '8'
        run: node scripts/seo/order-hub-live-audit.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr169-temporary-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Report result on PR 169
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_OUTCOME: ${{ steps.ci.outcome }}
          BUILD_OUTCOME: ${{ steps.build_preview.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          COMMERCE_OUTCOME: ${{ steps.commerce.outcome }}
          SEO_OUTCOME: ${{ steps.seo.outcome }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          {
            echo '## Validación temporal automática PR #169'
            echo
            echo "- Syntax/tests/builds: **${CI_OUTCOME}**"
            echo "- Preview build: **${BUILD_OUTCOME}**"
            echo "- Preview deploy: **${DEPLOY_OUTCOME}**"
            echo "- Commerce audit: **${COMMERCE_OUTCOME}**"
            echo "- SEO hub audit: **${SEO_OUTCOME}**"
            if [ -n "$PREVIEW_URL" ]; then echo "- Preview: ${PREVIEW_URL}"; fi
            if [ -f artifacts/seo-order-hub-preview/order-hub-live-audit.json ]; then
              echo
              echo '### SEO hub'
              jq -r '"- sitemapBooks: \(.sitemapBooks)\n- pages: \(.pagesAudited)\n- linkedBooks: \(.linkedBooks)\n- priorityBookLinks: \(.priorityBookLinks)\n- failures: \(.failures | length)\n- mobile primary parity: \(.mobileParity.primary)\n- mobile priority parity: \(.mobileParity.priority)"' artifacts/seo-order-hub-preview/order-hub-live-audit.json
            fi
            if [ -f artifacts/commerce-preview/full-commerce-audit-2026-08-18.json ]; then
              echo
              echo '### Commerce'
              jq -r '"- result: \(.result)\n- critical: \(.critical)\n- feed items: \(.feed.feed_items)\n- pages passed: \(.pages.passed)/\(.pages.inspected)"' artifacts/commerce-preview/full-commerce-audit-2026-08-18.json
            fi
            echo
            echo 'Workflow temporal de rama; no despliega producción.'
          } > /tmp/pr169-validation.md
          cat /tmp/pr169-validation.md
          gh pr comment 169 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr169-validation.md
