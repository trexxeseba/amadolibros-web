name: Precio Ganador

# Precio ganador automático en Mercado Libre para Amado Libros (440298103) y
# Amado Vintage (2341378249). Reglas por cuenta en precio-ganador/src/config.mjs.
#
# Cada 2 horas de 09:00 a 21:00 de Montevideo (UTC-3), las dos cuentas (Seba, 06/11/2026).
# El mail diario sale con la de las 21:00.
# Modo real si precio-ganador/modo.json dice "real" para la cuenta. Para pausar sin
# tocar código: variable del repo PRECIO_GANADOR_DRY_RUN = true (consulta y reporta,
# no cambia nada), o desactivar el workflow.
#
# Estado (precio original de cada publicación bajada) y reportes en la rama
# estado/precio-ganador del repo PRIVADO trexxeseba/amadolibros-privado (Seba,
# 08/11/2026): precios y estrategia no quedan públicos. Secreto ESTADO_TOKEN: token
# fine-grained con Contents read/write sólo sobre ese repo.
on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      accion:
        description: 'correr = corrida normal (con auditoría) · auditar = sólo la auditoría, no cambia nada · restaurar = volver al precio original (todo, o sólo los IDs de abajo) · ventas = cruce de ventas, sólo lee · baratos = libros que ganamos muy por debajo del competidor, sólo lee'
        type: choice
        options: [correr, auditar, restaurar, diagnosticar, ventas, baratos]
        default: correr
      max_marcadas:
        description: 'Cortar al encontrar N marcadas (vacío = todas)'
        required: false
      ids:
        description: 'Sólo para diagnosticar: IDs separados por coma (sólo lee)'
        required: false
      cuenta:
        description: 'Cuenta (a mano corre una sola; las programadas corren las dos)'
        type: choice
        options: [libros, vintage, ambas]
        default: libros
      prueba:
        description: 'Prueba: consulta y reporta, no cambia ningún precio'
        type: boolean
        default: false
      correo:
        description: 'Mandar el mail de resumen'
        type: boolean
        default: false

concurrency:
  group: precio-ganador
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # El Worker de Cloudflare dispara la corrida puntual; el cron de GitHub queda de
  # respaldo. Si una programada llega tarde y ya hubo una corrida en la última
  # hora, se saltea para no duplicar (las franjas están cada 2 horas).
  franja:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      saltar: ${{ steps.chequeo.outputs.saltar }}
    steps:
      - id: chequeo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          saltar=no
          # Una programada atrasada que cae fuera de horario (antes de las 09:00 o desde las
          # 23:00 de Montevideo) no corre (Seba, 12/11/2026: la de la 1:00 bajó 30 precios).
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            hora=$(TZ=America/Montevideo date +%-H)
            if [ "$hora" -lt 9 ] || [ "$hora" -ge 23 ]; then saltar=si; echo "Programada fuera de horario ($hora h de Montevideo): se saltea"; fi
          fi
          if [ "$saltar" = "no" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/precio-ganador.yml/runs?branch=main&per_page=15" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.event == \"schedule\" or .event == \"workflow_dispatch\") | select((now - (.created_at | fromdateiso8601)) < 3600) | select(.status != \"completed\" or .conclusion == \"success\")] | length" 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then saltar=si; echo "Ya hubo una corrida en la última hora: se saltea"; fi
          fi
          echo "saltar=$saltar" >> "$GITHUB_OUTPUT"

  run:
    needs: franja
    if: needs.franja.outputs.saltar != 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # Libros corre en todas las franjas programadas (cada 2 horas). Vintage sólo en las de las 09:00 y las
        # 21:00 de Montevideo (12:00 y 00:00 UTC), mientras Mercado Libre lo tenga restringido para ganar
        # en catálogo (Seba, 11/11/2026). A mano, la cuenta que se pida.
        cuenta: ${{ fromJSON(((github.event_name == 'schedule' && (github.event.schedule == '0 12 * * *' || github.event.schedule == '0 0 * * *')) || inputs.cuenta == 'ambas') && '["libros","vintage"]' || inputs.cuenta == 'vintage' && '["vintage"]' || '["libros"]') }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PRECIO_GANADOR_EMAIL_TO: undiaes@gmail.com
      ESTADO_RAMA: estado/precio-ganador
      ESTADO_REPO: trexxeseba/amadolibros-privado
      ESTADO_TOKEN: ${{ secrets.ESTADO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sin la credencial del repo público: el estado va al repo privado con ESTADO_TOKEN.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node --test precio-ganador/test/*.test.mjs

      - name: Traer el estado
        shell: bash
        run: |
          git config user.name "precio-ganador[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nunca volver a escribir en la rama pública: sin ESTADO_TOKEN se corta.
          [ -n "$ESTADO_TOKEN" ] || { echo "Falta el secreto ESTADO_TOKEN (repo privado del estado)"; exit 1; }
          git remote add privado "https://x-access-token:${ESTADO_TOKEN}@github.com/${ESTADO_REPO}.git"
          # Distinguir "la rama no existe" (2) de cualquier otra falla: en ese caso se
          # corta acá, nunca se arranca con un estado vacío por un error de red.
          set +e; git ls-remote --exit-code --heads privado "$ESTADO_RAMA" >/dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then
            git fetch privado "$ESTADO_RAMA"
            git worktree add estado "privado/$ESTADO_RAMA" -B "$ESTADO_RAMA"
            if [ "${{ matrix.cuenta }}" = "libros" ] && [ ! -f estado/state/libros.json ] && git -C estado log --oneline -- state/libros.json | grep -q .; then
              echo "La rama tuvo state/libros.json y ya no está: se corta"; exit 1
            fi
          elif [ $rc -eq 2 ]; then
            git worktree add --orphan -b "$ESTADO_RAMA" estado
            echo "Rama de estado nueva"
          else
            echo "No se pudo consultar la rama de estado"; exit 1
          fi
          mkdir -p estado/state

      - name: Correr
        id: correr
        shell: bash
        env:
          DRY_VAR: ${{ vars.PRECIO_GANADOR_DRY_RUN }}
          EVENTO: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_ACCION: ${{ inputs.accion }}
          IN_MAX: ${{ inputs.max_marcadas }}
          IN_CORREO: ${{ inputs.correo }}
          IN_PRUEBA: ${{ inputs.prueba }}
          IN_IDS: ${{ inputs.ids }}
          CUENTA: ${{ matrix.cuenta }}
        run: |
          ARGS=(--cuenta "$CUENTA" --estado estado/state)
          REAL=no
          MODO=$(node -e "console.log(require('./precio-ganador/modo.json')[process.argv[1]] ?? 'dry_run')" "$CUENTA")
          if [ "$MODO" = "real" ] && [ "$DRY_VAR" != "true" ] && [ "$EVENTO" != "push" ] && [ "$IN_PRUEBA" != "true" ]; then REAL=si; ARGS+=(--real); fi
          echo "real=$REAL" >> "$GITHUB_OUTPUT"
          echo "Modo: $([ $REAL = si ] && echo REAL || echo DRY_RUN)"
          if [ "$IN_ACCION" = "restaurar" ]; then
            if [ -n "$IN_IDS" ]; then ARGS+=(--ids "$IN_IDS"); fi
            node precio-ganador/src/restaurar.mjs "${ARGS[@]}"
            exit $?
          fi
          if [ "$IN_ACCION" = "ventas" ]; then
            node precio-ganador/src/ventas.mjs --cuenta "$CUENTA" --estado estado/state --salida estado/ultima
            exit $?
          fi
          if [ "$IN_ACCION" = "baratos" ]; then
            node precio-ganador/src/baratos.mjs --cuenta "$CUENTA" --salida estado/ultima
            exit $?
          fi
          if [ "$EVENTO" = "push" ] || [ "$REAL" = "no" ]; then SALIDA="estado/pruebas/$GITHUB_RUN_ID"; else SALIDA="estado/ultima"; fi
          echo "salida=$SALIDA" >> "$GITHUB_OUTPUT"
          if [ "$IN_ACCION" = "auditar" ]; then echo "Sólo auditoría"; exit 0; fi
          if [ "$IN_ACCION" = "diagnosticar" ]; then node precio-ganador/src/diagnostico.mjs --cuenta "$CUENTA" --ids "$IN_IDS" --salida "estado/pruebas/$GITHUB_RUN_ID"; exit $?; fi
          if [[ "$IN_MAX" =~ ^[0-9]+$ ]]; then ARGS+=(--max-marcadas "$IN_MAX"); fi
          if [ "$SCHEDULE" = "0 0 * * *" ] || [ "$IN_CORREO" = "true" ]; then ARGS+=(--correo-diario); fi
          node precio-ganador/src/run.mjs "${ARGS[@]}" --salida "$SALIDA"

      # Auditoría independiente (sólo lee): 10 publicaciones de catálogo al azar,
      # todas las que el sistema bajó y la regla recalculada sobre las marcadas.
      # Si encuentra una discrepancia, el workflow falla y GitHub manda el mail.
      - name: Auditoría
        if: success() && inputs.accion != 'restaurar' && inputs.accion != 'diagnosticar' && inputs.accion != 'ventas' && inputs.accion != 'baratos'
        shell: bash
        env:
          CUENTA: ${{ matrix.cuenta }}
          SALIDA: ${{ steps.correr.outputs.salida }}
        run: node precio-ganador/src/auditoria.mjs --cuenta "$CUENTA" --estado estado/state --salida "$SALIDA" --muestra 10

      # Siempre, aunque la corrida haya fallado a mitad: lo que se alcanzó a bajar
      # ya está en state/ y tiene que quedar guardado para poder revertirlo.
      - name: Guardar estado (repo privado, rama estado/precio-ganador)
        if: always()
        shell: bash
        run: |
          cd estado
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios de estado"; exit 0; fi
          git commit -q -m "Precio Ganador ${{ matrix.cuenta }}: corrida $GITHUB_RUN_ID [skip ci]"
          for i in 1 2 3 4 5; do
            if git push -q privado "HEAD:$ESTADO_RAMA"; then
              # Confirmar que lo que quedó en el remoto es este commit.
              git fetch -q privado "$ESTADO_RAMA"
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse "privado/$ESTADO_RAMA")" ]; then echo "Estado guardado"; exit 0; fi
              echo "El remoto no quedó con este commit"; exit 1
            fi
            sleep $((i * 5))
            git pull -q --rebase privado "$ESTADO_RAMA" || { git rebase --abort || true; echo "Conflicto al integrar el estado: queda en el artefacto"; exit 1; }
          done
          echo "No se pudo subir el estado"; exit 1

      # Cualquier paso que falle (corrida, auditoría, guardado): alarma inmediata por mail.
      - name: Alarma
        if: failure()
        env:
          DETALLE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CUENTA: ${{ matrix.cuenta }}
        run: |
          node precio-ganador/src/alarma.mjs "falló la corrida ($CUENTA)" "Falló un paso de Precio Ganador. Detalle en $DETALLE"

      # Respaldo del estado SÓLO si falló el guardado en el repo privado (los artefactos de
      # un repo público los puede bajar cualquiera: se guardan 3 días y sólo en ese caso).
      - name: Respaldo del estado
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: estado-${{ matrix.cuenta }}-${{ github.run_id }}
          path: estado/state/
          retention-days: 3
          if-no-files-found: ignore
