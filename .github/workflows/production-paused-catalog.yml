name: Production paused catalog

# CF-R2-2-BRIDGE: publica el catálogo productivo separado (activo + pausado
# + manifest, prefijo catalog/*) mediante una versión aislada del Worker de
# sync — nunca la versión "current" que corre el cron. No toca catalog.json
# ni meta.json.
#
# Antes corría en cada deploy de Pages (unos 8 minutos de Actions cada vez,
# varias veces por día) aunque el cambio no tocara nada del catálogo. El
# contenido depende del código del Worker y de Mercado Libre, no del sitio:
# alcanza con publicarlo una vez por día, después del sync de las 07:15 UTC,
# y cada vez que cambia el código del Worker. El sitio no depende de este
# job para desplegarse.
on:
  schedule:
    - cron: '50 7 * * *'
  push:
    branches: [main]
    paths:
      - 'worker-sync/**'
      - '.github/workflows/production-paused-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-paused-catalog
  cancel-in-progress: false

jobs:
  publish-production-catalog:
    name: Publish production paused catalog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Upload isolated Worker version
        id: upload
        working-directory: worker-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx wrangler@4.107.0 versions upload \
            --preview-alias production-catalog-publish \
            --keep-vars \
            --var PRODUCTION_PAUSED_CATALOG_PUBLISH_ENABLED:true \
            --message "CF-R2-2-BRIDGE publicacion catalogo pausado productivo")
          echo "$OUTPUT"

          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "ERROR: Wrangler no devolvió la URL de la versión aislada."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish production paused/active catalog
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          # Publicación por partes: en una sola llamada el Worker superaba sus
          # límites (Cloudflare "error code: 1102") con ~17.000 publicaciones.
          # step=start arma la lista de IDs; cada step=continue hace una sola
          # fase (un tramo de detalles, el índice, un rango de bloques o la
          # verificación + manifest). El manifest se escribe recién en la última
          # parte, después de verificar con head cada artefacto: si algo falla
          # antes, el sitio sigue en la versión anterior.
          sleep 10

          call_step() {
            local query="$1"
            local response
            response=$(curl -sS --max-time 600 -w "
HTTP_STATUS:%{http_code}"               -X POST "$PREVIEW_URL/publish-production-catalog?$query"               -H "Authorization: Bearer $SYNC_SECRET" || true)
            HTTP_STATUS=$(echo "$response" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
            BODY=$(echo "$response" | sed '/HTTP_STATUS:/d')
          }

          json_field() {
            echo "$BODY" | node -e '
              let input="";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try { const value = JSON.parse(input)[process.argv[1]]; process.stdout.write(value == null ? "" : String(value)); }
                catch { process.stdout.write(""); }
              });
            ' "$1"
          }

          call_step "step=start"
          echo "start: HTTP $HTTP_STATUS $BODY"
          RUN_ID=$(json_field run_id)
          if [ "$HTTP_STATUS" != "200" ] || [ -z "$RUN_ID" ]; then
            echo "ERROR: /publish-production-catalog?step=start respondió HTTP $HTTP_STATUS."
            exit 1
          fi

          PUBLISHED=""
          FAILURES=0
          for STEP in $(seq 1 80); do
            call_step "step=continue&run=$RUN_ID"
            if [ "$HTTP_STATUS" != "200" ]; then
              FAILURES=$((FAILURES + 1))
              echo "parte $STEP: HTTP $HTTP_STATUS (intento fallido $FAILURES de 4) $BODY"
              if [ "$FAILURES" -ge 4 ]; then
                echo "ERROR: /publish-production-catalog?step=continue respondió HTTP $HTTP_STATUS."
                exit 1
              fi
              # La misma parte se rehace: sus claves son deterministas.
              sleep 20
              continue
            fi
            FAILURES=0
            if [ "$(json_field published)" = "true" ]; then
              PUBLISHED="yes"
              break
            fi
            echo "parte $STEP: fase=$(json_field phase) tramos=$(json_field chunks_done)/$(json_field chunks_total) bloques=$(json_field blocks_done)/$(json_field block_count)"
          done

          echo "HTTP status: $HTTP_STATUS"
          echo "PRODUCTION_CATALOG_RESULT=$BODY"

          if [ -z "$PUBLISHED" ]; then
            echo "ERROR: la publicación por partes no terminó."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"published":true'; then
            echo "ERROR: la respuesta no confirmó published=true."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"production_catalog_modified":false'; then
            echo "ERROR: no se confirmó que catalog.json quedó intacto."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"key":"catalog/manifest.json"'; then
            echo "ERROR: el Worker no confirmó el manifest fijo productivo."
            exit 1
          fi
          echo "$BODY" | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              const paused = result.paused_catalog || {};
              const active = result.active_catalog || {};
              if (!(active.total > 0 && active.index_bytes > 0)) {
                throw new Error(`Índice activo inválido: ${active.index_bytes}`);
              }
              if (!(active.index_gzip_bytes > 0 && active.index_gzip_bytes < active.index_bytes)) {
                throw new Error(`Gzip activo inválido: ${active.index_gzip_bytes}`);
              }
              if (!(paused.index_bytes > 0)) {
                throw new Error(`Índice pausado inválido: ${paused.index_bytes}`);
              }
              if (!(paused.index_gzip_bytes > 0 && paused.index_gzip_bytes < paused.index_bytes)) {
                throw new Error(`Gzip pausado inválido: ${paused.index_gzip_bytes}`);
              }
              if (!(paused.block_count >= 64 && paused.block_count <= 256)) {
                throw new Error(`Cantidad de bloques inválida: ${paused.block_count}`);
              }
            });
          '
