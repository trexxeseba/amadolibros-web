name: R2 card inventory - read only
on:
  push:
    branches: [codex/r2-card-inventory-29c5dce]
    paths:
      - '.github/workflows/r2-card-inventory-readonly.yml'
      - 'scripts/images/inventory-readonly.py'
      - 'scripts/images/inventory-external-ids.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: r2-card-inventory-readonly
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read existing production variant inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/images/inventory-readonly.py
