name: Publish approved card readiness index only
on:
  push:
    branches: [codex/r2-card-inventory-29c5dce]
    paths: ['.github/workflows/r2-card-readiness-publish.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: approved-card-readiness-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: card-readiness-39045624433
          run-id: 39045624433
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-readiness
      - name: Publish one approved immutable JSON object and verify stored bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CARD_READINESS_ARTIFACT: ${{ runner.temp }}/approved-readiness
          CARD_READINESS_WRITE_APPROVAL: fdc59f13a42150ac77cd6cb5c700bc0b963eed3efc48259891ef77f32a49adcf
          CARD_READINESS_PUBLICATION_REPORT: ${{ runner.temp }}/card-readiness-publication.json
        run: node scripts/images/publish-card-readiness.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: card-readiness-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/card-readiness-publication.json
          if-no-files-found: error
          retention-days: 90
