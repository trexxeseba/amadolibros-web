name: RADAR WEB V1 deploy

on:
  push:
    branches:
      - radar/web-v1-competition-285
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-web-v1
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: astro-front/package-lock.json

      - name: Validate shared suite
        run: bash scripts/validate-ci.sh

      - name: Upload isolated Radar API Worker version
        working-directory: worker-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.107.0 versions upload \
            --preview-alias radar-api \
            --keep-vars \
            --message "RADAR WEB V1 API aislada — no production deploy"

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.107.0 pages project create radar-amado --production-branch main || true

      - name: Deploy Radar private Pages site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.107.0 pages deploy ./radar-web/public \
            --project-name radar-amado \
            --branch main \
            --commit-dirty=true

      - name: Verify private gate
        run: |
          sleep 8
          CODE=$(curl -sS -o /tmp/radar-body -w '%{http_code}' --max-time 30 https://radar-amado.pages.dev/)
          echo "Unauthenticated HTTP: $CODE"
          if [ "$CODE" != "401" ]; then
            echo "ERROR: Radar debe responder 401 sin credenciales."
            cat /tmp/radar-body
            exit 1
          fi
