name: Reconcile six universes temporary

on:
  push:
    branches:
      - agent/reconcile-six-universes

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Patch absolute product links in audit parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit/reconcile-six-universes.mjs')
          s = p.read_text()
          old = r'''matchAll(/href=["']\/libro\/(MLU\d+)(?:\/|["'])/gi)'''
          new = r'''matchAll(/href=["'][^"']*\/libro\/(MLU\d+)(?:\/|["'])/gi)'''
          if old not in s:
              raise SystemExit('No se encontró el patrón esperado para parchear')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Authenticate to Google Merchant API
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/content
          create_credentials_file: false

      - name: Run read-only reconciliation
        env:
          MERCHANT_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          MERCHANT_ACCOUNT_ID: '5330457716'
          AUDIT_OUTPUT_DIR: artifacts/reconcile-six-universes
          AUDIT_CONCURRENCY: '8'
        run: node scripts/audit/reconcile-six-universes.mjs

      - name: Upload reconciliation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-six-universes-${{ github.run_id }}
          path: artifacts/reconcile-six-universes/
          if-no-files-found: error
          retention-days: 30

      - name: Comment summary on issue 171
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s artifacts/reconcile-six-universes/report-summary.md ]; then
            gh issue comment 171 --repo "$GITHUB_REPOSITORY" --body "## Segunda pasada corregida (URLs absolutas)" 
            gh issue comment 171 --repo "$GITHUB_REPOSITORY" --body-file artifacts/reconcile-six-universes/report-summary.md
          else
            gh issue comment 171 --repo "$GITHUB_REPOSITORY" --body "La segunda pasada 0A no generó resumen. Revisar el run asociado al commit $GITHUB_SHA."
          fi
