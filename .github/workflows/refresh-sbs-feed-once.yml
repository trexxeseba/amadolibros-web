name: SBS stock refresh (no publication writes)

on:
  workflow_dispatch:
  schedule:
    # 02:17 and 14:17 Uruguay. Provider report dates remain authoritative.
    - cron: '17 5,17 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-sbs-feed-once.yml'
      - 'scripts/mercadolibre/refresh-sbs-stock.mjs'
      - 'scripts/mercadolibre/prepare-supplier-feed.py'

permissions:
  contents: read

concurrency:
  group: sbs-stock-ingestion
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate entire stock into isolated supplier tables
        run: node scripts/mercadolibre/refresh-sbs-stock.mjs
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          # The public link supplied by SBS is the runner default. Optional
          # secret overrides it without disclosing a private supplier URL.
          SUPPLIER_FEED_URL: ${{ secrets.SUPPLIER_FEED_URL }}
          SUPPLIER_FEED_AUTHORIZATION: ${{ secrets.SUPPLIER_FEED_AUTHORIZATION }}
          SUPPLIER_WEIGHT_UNIT: ${{ vars.SUPPLIER_WEIGHT_UNIT || 'kg' }}
