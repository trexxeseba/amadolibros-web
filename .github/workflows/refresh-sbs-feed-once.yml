name: Refresh SBS feed once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-sbs-feed-once.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Download, sample and import fresh SBS feed only
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mercadolibre/publisher-control.mjs | tee /tmp/sbs-refresh.log
          FEED_ID="$(python3 - <<'PY'
import json
feed=None
for raw in open('/tmp/sbs-refresh.log', encoding='utf-8'):
    try:
        row=json.loads(raw)
    except Exception:
        continue
    if row.get('state')=='feed_ready':
        feed=row.get('feed_id')
if not feed:
    raise SystemExit('feed_ready not found')
print(feed)
PY
)"
          echo "feed_id=$FEED_ID" >> "$GITHUB_OUTPUT"
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          PUBLISHER_ACTION: refresh
          PUBLISHER_REFRESH_ONLY: 'true'
          SUPPLIER_FEED_URL: ${{ secrets.SUPPLIER_FEED_URL }}
          SUPPLIER_FEED_AUTHORIZATION: ${{ secrets.SUPPLIER_FEED_AUTHORIZATION }}
          SUPPLIER_WEIGHT_UNIT: ${{ vars.SUPPLIER_WEIGHT_UNIT || 'kg' }}
          PUBLISHER_POLICY_JSON: ${{ secrets.PUBLISHER_POLICY_JSON }}
          PUBLISHER_SAMPLE_SIZE: '20000'
          PUBLISHER_SAMPLE_SEED: '2026101702'

      - name: Create 10k target run in preflight only
        run: node scripts/mercadolibre/publisher-control.mjs
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          PUBLISHER_ACTION: create_run_from_source
          PUBLISHER_RUN_ID: eb70a953-6504-4359-b109-b4c18be38fc0
          PUBLISHER_FEED_ID: ${{ steps.refresh.outputs.feed_id }}
          PUBLISHER_AVAILABILITY_DAYS: '18'
          PUBLISHER_DAILY_CAP: '10000'
          PUBLISHER_PREFLIGHT_LIMIT: '20'
          PUBLISHER_TARGET_PUBLISHED: '10000'
          PUBLISHER_CYCLES: '10'
