name: SBS stock refresh (no publication writes)

# Solo manual. El enlace público de SBS quedó congelado el 25/08/2026, así que
# cada corrida programada terminaba en supplier_stock_stale_or_future dos veces
# por día. El stock vigente lo carga la PC entrando al portal de SBS
# (scripts/vintage-local/renew.mjs). Si SBS vuelve a actualizar el enlace, o se
# configura SUPPLIER_FEED_URL con una fuente viva, se puede correr a mano.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbs-stock-ingestion
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate entire stock into isolated supplier tables
        run: node scripts/mercadolibre/refresh-sbs-stock.mjs
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          # The public link supplied by SBS is the runner default. Optional
          # secret overrides it without disclosing a private supplier URL.
          SUPPLIER_FEED_URL: ${{ secrets.SUPPLIER_FEED_URL }}
          SUPPLIER_FEED_AUTHORIZATION: ${{ secrets.SUPPLIER_FEED_AUTHORIZATION }}
          SUPPLIER_WEIGHT_UNIT: ${{ vars.SUPPLIER_WEIGHT_UNIT || 'kg' }}
