name: SEO canonical one-shot apply

on:
  push:
    branches:
      - agent/seo-url-canonical-enforcement-1
    paths:
      - '.github/workflows/seo-canonical-apply.yml'
      - 'scripts/seo/apply-product-canonical-slug.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-url-canonical-enforcement-1

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Apply canonical slug patch
        run: node scripts/seo/apply-product-canonical-slug.mjs

      - name: Validate targeted behavior
        run: |
          node --check 'functions/libro/[[path]].js'
          node --test functions/__tests__/product-canonical-slug.test.js
          git diff --check

      - name: Commit generated patch
        run: |
          if git diff --quiet -- 'functions/libro/[[path]].js'; then
            echo 'No generated change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'functions/libro/[[path]].js'
          git commit -m 'SEO canonical: enforce product slug redirect'
          git push origin HEAD:agent/seo-url-canonical-enforcement-1
