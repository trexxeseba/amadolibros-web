name: SEO link graph C1 apply one-shot

on:
  push:
    branches:
      - agent/seo-internal-link-graph-5
    paths:
      - '.github/workflows/seo-link-graph-apply.yml'
      - 'scripts/seo/apply-link-graph-5.mjs'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-internal-link-graph-5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply C1 patch
        run: node scripts/seo/apply-link-graph-5.mjs
      - name: Validate targeted behavior
        run: |
          node --check functions/catalogo.js
          node --check 'functions/libros/[[path]].js'
          node --check scripts/seo/link-graph-audit.mjs
          node --test \
            functions/__tests__/catalogo-paginacion.test.js \
            functions/__tests__/seo-category-pages.test.js \
            functions/__tests__/seo-category-pagination.test.js
          git diff --check
      - name: Commit C1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/catalogo.js 'functions/libros/[[path]].js' \
            functions/__tests__/catalogo-paginacion.test.js \
            scripts/seo/link-graph-audit.mjs
          git commit -m 'SEO-INTERNAL-LINK-GRAPH-5: add crawlable pagination'
          git push origin HEAD:agent/seo-internal-link-graph-5
