name: SEO link graph filtered canonical fix one-shot

on:
  push:
    branches:
      - agent/seo-internal-link-graph-5
    paths:
      - '.github/workflows/seo-link-graph-canonical-fix.yml'
      - 'scripts/seo/fix-link-graph-canonical.mjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-internal-link-graph-5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply fix
        run: node scripts/seo/fix-link-graph-canonical.mjs
      - name: Validate
        run: |
          node --check functions/catalogo.js
          node --test functions/__tests__/catalogo-paginacion.test.js functions/__tests__/catalogo-categories.test.js
          git diff --check
      - name: Commit and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/catalogo.js functions/__tests__/catalogo-paginacion.test.js
          git commit -m 'SEO link graph: keep filtered catalog canonical strict'
          git rm .github/workflows/seo-link-graph-canonical-fix.yml scripts/seo/fix-link-graph-canonical.mjs
          git commit -m 'SEO link graph: remove canonical fix helpers'
          git push origin HEAD:agent/seo-internal-link-graph-5
