name: SEO link graph cleanup one-shot

on:
  push:
    branches:
      - agent/seo-internal-link-graph-5
    paths:
      - '.github/workflows/seo-link-graph-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-internal-link-graph-5
      - name: Remove temporary helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/seo-link-graph-port.yml \
            .github/workflows/seo-link-graph-apply.yml \
            .github/workflows/seo-link-graph-cleanup.yml \
            scripts/seo/apply-link-graph-5.mjs
          git commit -m 'SEO link graph: remove temporary helpers'
          git push origin HEAD:agent/seo-internal-link-graph-5
