name: SEO link graph sync main 2 one-shot

on:
  push:
    branches:
      - agent/seo-internal-link-graph-5
    paths:
      - '.github/workflows/seo-link-graph-sync-main-2.yml'

permissions:
  contents: write

jobs:
  sync-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-internal-link-graph-5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Validate pagination after smoke fix
        run: |
          node --check functions/catalogo.js
          node --check 'functions/libros/[[path]].js'
          node --check scripts/seo/link-graph-audit.mjs
          node --test functions/__tests__/catalogo-paginacion.test.js functions/__tests__/seo-category-pagination.test.js functions/__tests__/smoke-sitemap-index.test.js
          git diff --check
      - name: Remove helper and push
        run: |
          git rm .github/workflows/seo-link-graph-sync-main-2.yml
          git commit -m 'SEO link graph: remove second temporary sync workflow'
          git push origin HEAD:agent/seo-internal-link-graph-5
