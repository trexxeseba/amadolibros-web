name: SEO sitemap sync main one-shot

on:
  push:
    branches:
      - agent/seo-sitemap-architecture-4
    paths:
      - '.github/workflows/seo-sitemap-sync-main.yml'

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-sitemap-architecture-4
          fetch-depth: 0

      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:agent/seo-sitemap-architecture-4
