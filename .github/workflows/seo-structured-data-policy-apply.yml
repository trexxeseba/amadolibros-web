name: SEO structured data policy one-shot

on:
  push:
    branches:
      - agent/seo-structured-data-return-policy-1
    paths:
      - '.github/workflows/seo-structured-data-policy-apply.yml'
      - 'scripts/seo/apply-structured-data-return-policy.mjs'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-structured-data-return-policy-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply real merchant return policy link
        run: |
          node scripts/seo/apply-structured-data-return-policy.mjs
          node --check 'functions/libro/[[path]].js'
          node --test functions/__tests__/product-structured-data-policy.test.js
          git diff --check
      - name: Commit implementation and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'functions/libro/[[path]].js' functions/__tests__/product-structured-data-policy.test.js
          git commit -m 'SEO-STRUCTURED-DATA-9: link real merchant return policy'
          git rm .github/workflows/seo-structured-data-policy-apply.yml scripts/seo/apply-structured-data-return-policy.mjs
          git commit -m 'SEO structured data: remove temporary helpers'
          git push origin HEAD:agent/seo-structured-data-return-policy-1
