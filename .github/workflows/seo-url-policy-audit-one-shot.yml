name: SEO URL policy audit one-shot

on:
  push:
    branches:
      - agent/seo-url-inventory-1
    paths:
      - '.github/workflows/seo-url-policy-audit-one-shot.yml'

permissions:
  contents: write

jobs:
  audit-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-url-inventory-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Audit current production URL policy
        run: |
          node --check scripts/seo/url-policy-audit.mjs
          node scripts/seo/url-policy-audit.mjs
          git diff --check
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/seo-url-policy-audit-one-shot.yml
          git commit -m 'SEO URL policy: remove temporary audit workflow'
          git push origin HEAD:agent/seo-url-inventory-1
