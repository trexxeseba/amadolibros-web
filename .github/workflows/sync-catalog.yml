name: Sync Catalog

on:
  schedule:
    - cron: '0 * * * *'  # CADA HORA
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Sync catalog from MELI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MELI_TOKEN: ${{ secrets.MELI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔄 Sincronizando catálogo desde Mercado Libre..."
          echo "Timestamp: $(date)"
          
          if [ -f src/amadolibros-sync.js ]; then
            echo "✅ Archivo sync encontrado"
            node src/amadolibros-sync.js
          else
            echo "⚠️  No se encontró src/amadolibros-sync.js"
            echo "Creando directorio si es necesario..."
            mkdir -p src
            echo "Workflow puede continuar pero necesita implementar el sync"
          fi
          
          echo "✅ Catálogo sincronizado"
