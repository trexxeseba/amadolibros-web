name: Test Google Books OAuth temporary

on:
  push:
    branches:
      - agent/audit-gsc-demand-bibliography

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate cloud-platform
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable Books API
        run: gcloud services enable books.googleapis.com --project=amado-libros-analytics --quiet
      - name: Authenticate Books scope
        id: books
        uses: google-github-actions/auth@v3
        with:
          project_id: amado-libros-analytics
          workload_identity_provider: projects/667747565315/locations/global/workloadIdentityPools/github-actions/providers/amadolibros-web
          service_account: ga4-reporter@amado-libros-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/books
          create_credentials_file: false
      - name: Probe one ISBN
        env:
          TOKEN: ${{ steps.books.outputs.access_token }}
        run: |
          set +e
          HTTP=$(curl -sS -o /tmp/body.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'https://www.googleapis.com/books/v1/volumes?q=isbn%3A9791387869380&maxResults=5')
          echo "http=$HTTP" > /tmp/result.txt
          head -c 1000 /tmp/body.json >> /tmp/result.txt
          exit 0
      - name: Comment issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## Google Books OAuth probe'; echo; echo '```'; cat /tmp/result.txt 2>/dev/null || echo 'No probe output'; echo; echo '```'; } > /tmp/comment.md
          gh issue comment 182 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
