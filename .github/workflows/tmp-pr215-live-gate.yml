name: TEMP PR215 live gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tmp-pr215-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-gate:
    if: github.event.pull_request.number == 215 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Wait until PR alias contains duplicate-param hardening
        env:
          PREVIEW_URL: https://pr-215.amadolibros-web.pages.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/dup.json -w '%{http_code}' --max-time 20 \
              "$PREVIEW_URL/api/tarot-finder-alternatives?system=tarot&system=oraculo")
            if [ "$code" = '400' ] && grep -qi 'repetido' /tmp/dup.json; then
              echo "Preview actualizado: duplicate-param hardening activo."
              exit 0
            fi
            echo "Esperando deploy actualizado ($attempt/24): HTTP $code"
            sleep 5
          done
          echo 'ERROR: el alias de Preview no recibió el head actualizado.'
          exit 1

      - name: Measure page and lazy endpoint
        env:
          PREVIEW_URL: https://pr-215.amadolibros-web.pages.dev
          PRODUCTION_URL: https://www.amadolibros.com
        run: |
          set -euo pipefail
          PATHNAME='/libros/esoterismo-tarot'

          measure_page() {
            base="$1"; prefix="$2"
            curl -sS -L --raw --max-time 60 -H 'Accept-Encoding: identity' \
              -D "/tmp/${prefix}.raw.headers" -o "/tmp/${prefix}.raw" \
              -w '%{http_code}\n' "$base$PATHNAME" > "/tmp/${prefix}.http"
            curl -sS -L --raw --max-time 60 -H 'Accept-Encoding: gzip' \
              -D "/tmp/${prefix}.gzip.headers" -o "/tmp/${prefix}.gzip" \
              "$base$PATHNAME"
            : > "/tmp/${prefix}.ttfb"
            for i in 1 2 3 4 5; do
              curl -sS -L --max-time 60 -o /dev/null -H 'Accept-Encoding: gzip' \
                -w '%{time_starttransfer}\n' "$base$PATHNAME" >> "/tmp/${prefix}.ttfb"
            done
            eval "${prefix}_RAW=$(wc -c < /tmp/${prefix}.raw | tr -d ' ')"
            eval "${prefix}_GZIP=$(wc -c < /tmp/${prefix}.gzip | tr -d ' ')"
            eval "${prefix}_TTFB=$(sort -n /tmp/${prefix}.ttfb | sed -n '3p')"
          }

          measure_page "$PRODUCTION_URL" PROD
          measure_page "$PREVIEW_URL" PREVIEW
          DELTA=$((PREVIEW_GZIP - PROD_GZIP))
          PCT=$(awk -v p="$PREVIEW_GZIP" -v b="$PROD_GZIP" 'BEGIN { printf "%.1f", ((p-b)/b)*100 }')

          echo "PAGE PROD raw=$PROD_RAW gzip=$PROD_GZIP ttfb_median=${PROD_TTFB}s"
          echo "PAGE PREVIEW raw=$PREVIEW_RAW gzip=$PREVIEW_GZIP ttfb_median=${PREVIEW_TTFB}s"
          echo "PAGE DELTA gzip=${DELTA}B pct=${PCT}%"

          if grep -Fq 'tarot-finder-fallback-dataset' /tmp/PREVIEW.raw; then
            echo 'ERROR: fallback dataset embebido.'; exit 1
          fi
          echo 'PAGE fallback_dataset=0'

          ENDPOINT="$PREVIEW_URL/api/tarot-finder-alternatives?system=tarot&deckFamily=thoth&language=espanol&guide=si"
          curl -sS --raw --max-time 60 -H 'Accept-Encoding: identity' -D /tmp/ep.headers -o /tmp/ep.json \
            -w '%{http_code}\n' "$ENDPOINT" > /tmp/ep.http
          curl -sS --raw --max-time 60 -H 'Accept-Encoding: gzip' -o /tmp/ep.gzip "$ENDPOINT"
          curl -sS --raw --max-time 60 -H 'Accept-Encoding: identity' -D /tmp/ep2.headers -o /dev/null "$ENDPOINT"
          : > /tmp/ep.ttfb
          for i in 1 2 3 4 5; do
            curl -sS --max-time 60 -o /dev/null -w '%{time_starttransfer}\n' "$ENDPOINT" >> /tmp/ep.ttfb
          done

          EP_HTTP=$(cat /tmp/ep.http)
          EP_RAW=$(wc -c < /tmp/ep.json | tr -d ' ')
          EP_GZIP=$(wc -c < /tmp/ep.gzip | tr -d ' ')
          EP_TTFB=$(sort -n /tmp/ep.ttfb | sed -n '3p')
          EP_CACHE=$(tr -d '\r' < /tmp/ep2.headers | sed -n 's/^cache-control:[[:space:]]*//Ip' | tail -1)
          EP_ROBOTS=$(tr -d '\r' < /tmp/ep2.headers | sed -n 's/^x-robots-tag:[[:space:]]*//Ip' | tail -1)
          EP_CF=$(tr -d '\r' < /tmp/ep2.headers | sed -n 's/^cf-cache-status:[[:space:]]*//Ip' | tail -1)
          EP_AGE=$(tr -d '\r' < /tmp/ep2.headers | sed -n 's/^age:[[:space:]]*//Ip' | tail -1)
          [ -n "$EP_CF" ] || EP_CF='ausente'
          [ -n "$EP_AGE" ] || EP_AGE='ausente'
          EP_COUNT=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/ep.json","utf8"));const c=Array.isArray(j.candidates)?j.candidates:[];if(c.length>3)throw new Error("more than 3");for(const x of c){if(x.price!==null||x.stock!==null||x.status!=="paused")throw new Error("invented price/stock or wrong status")};process.stdout.write(String(c.length));')

          echo "ENDPOINT http=$EP_HTTP candidates=$EP_COUNT raw=$EP_RAW gzip=$EP_GZIP ttfb_median=${EP_TTFB}s"
          echo "ENDPOINT cache-control='$EP_CACHE' x-robots-tag='$EP_ROBOTS' cf-cache-status='$EP_CF' age='$EP_AGE'"
          echo "ENDPOINT body=$(cat /tmp/ep.json)"

          [ "$EP_HTTP" = '200' ]
          [ "$EP_ROBOTS" = 'noindex, nofollow' ]
          # Preview global middleware intentionally forces no-store on every
          # non-hashed response. The route's own `public,max-age=300` contract
          # is asserted in unit tests/CI; do not weaken Preview isolation.
          [ "$EP_CACHE" = 'no-store' ]

          {
            echo '## PR #215 live gate'
            echo ''
            echo '| Entorno | HTML raw | gzip transfer | TTFB mediana (5) |'
            echo '|---|---:|---:|---:|'
            echo "| Producción | $PROD_RAW B | $PROD_GZIP B | ${PROD_TTFB}s |"
            echo "| Preview | $PREVIEW_RAW B | $PREVIEW_GZIP B | ${PREVIEW_TTFB}s |"
            echo ''
            echo "Delta gzip Preview vs Producción: **${DELTA} B (${PCT}%)**."
            echo ''
            echo "Endpoint: **$EP_COUNT candidatos**, $EP_RAW B raw, $EP_GZIP B gzip, TTFB mediana ${EP_TTFB}s."
            echo "Preview runtime headers: Cache-Control=\`$EP_CACHE\`, X-Robots-Tag=\`$EP_ROBOTS\`, CF-Cache-Status=\`$EP_CF\`, Age=\`$EP_AGE\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install temporary browser driver
        run: |
          mkdir -p /tmp/pr215-puppeteer
          cd /tmp/pr215-puppeteer
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund puppeteer-core@24.17.0

      - name: Real browser flow and fail-open
        env:
          PREVIEW_URL: https://pr-215.amadolibros-web.pages.dev
        run: |
          set -euo pipefail
          cat > /tmp/pr215-puppeteer/live.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';

          const base = process.env.PREVIEW_URL;
          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-gpu'],
          });
          const page = await browser.newPage();
          const requests = [];
          const pageErrors = [];
          page.on('request', r => requests.push(r.url()));
          page.on('pageerror', e => pageErrors.push(String(e)));

          await page.goto(`${base}/libros/esoterismo-tarot`, { waitUntil: 'networkidle2', timeout: 60000 });
          assert.equal(requests.filter(u => u.includes('/api/tarot-finder-alternatives')).length, 0, 'normal visit must not fetch paused endpoint');
          assert.equal(await page.$('#tarot-finder-fallback-dataset'), null, 'fallback dataset must not exist in DOM');

          const zero = await page.evaluate(() => {
            const data = JSON.parse(document.querySelector('#tarot-finder-dataset')?.textContent || '[]');
            const hooks = window.__AmadoTarotFinderTestHooks;
            const families = ['rider_waite_smith', 'marsella', 'thoth'];
            const languages = ['espanol', 'ingles', 'multilingue'];
            const guides = ['si', 'no_importante'];
            for (const deckFamily of families) {
              for (const language of languages) {
                for (const guide of guides) {
                  const answers = { intent: 'sin_preferencia', system: 'tarot', deckFamily, language, guide };
                  if (hooks.rankCandidates(data, answers).length === 0) return answers;
                }
              }
            }
            return null;
          });
          assert.ok(zero, 'need one real zero-exact combination for e2e');
          console.log('E2E zero-exact answers=' + JSON.stringify(zero));

          async function click(selector) {
            await page.waitForSelector(selector, { timeout: 10000 });
            await page.click(selector);
          }
          async function driveToZero() {
            await click('#tarot-finder-start');
            await click('[data-field="opening"][data-value="explorar"]');
            await click('.tf-refine-cta');
            await click(`[data-field="system"][data-value="${zero.system}"]`);
            await click(`[data-field="deckFamily"][data-value="${zero.deckFamily}"]`);
            await click(`[data-field="language"][data-value="${zero.language}"]`);
            await click(`[data-field="guide"][data-value="${zero.guide}"]`);
            await page.waitForSelector('.tf-reveal-alternatives', { timeout: 10000 });
          }

          await driveToZero();
          const beforeLazy = requests.length;
          await click('.tf-reveal-alternatives');
          const sawLoading = await page.$('.tf-loading');
          assert.ok(sawLoading, 'loading state must render synchronously');
          await page.waitForFunction(() => !document.querySelector('.tf-loading'), { timeout: 15000 });
          const lazyRequests = requests.slice(beforeLazy).filter(u => u.includes('/api/tarot-finder-alternatives'));
          assert.equal(lazyRequests.length, 1, 'explicit reveal must issue exactly one lazy endpoint request');

          const result = await page.evaluate(() => ({
            alternatives: document.querySelectorAll('.tf-alternatives-grid .tf-result-card').length,
            paused: document.querySelectorAll('.tf-result-card-paused').length,
            pausedCtas: [...document.querySelectorAll('.tf-result-card-paused .tf-result-link')].map(a => ({ text: a.textContent.trim(), href: a.getAttribute('href') })),
            whatsapp: !!document.querySelector('.tf-wa-cta'),
            heading: document.querySelector('#tf-heading')?.textContent?.trim() || '',
          }));
          assert.ok(result.alternatives <= 3, 'UI must render max 3 alternatives');
          assert.ok(result.whatsapp, 'WhatsApp recovery must remain available');
          for (const cta of result.pausedCtas) {
            assert.equal(cta.text, 'Ver este mazo');
            assert.match(cta.href || '', /\/libro\//);
          }
          console.log('E2E live result=' + JSON.stringify(result));

          // Fail-open: restart, drive to same zero-exact state, then make only
          // the lazy endpoint fail. Finder must recover and retain WhatsApp.
          await click('.tf-restart');
          await page.evaluate(() => {
            const original = window.fetch.bind(window);
            window.fetch = function(input, init) {
              if (String(input).includes('/api/tarot-finder-alternatives')) return Promise.reject(new Error('synthetic lazy failure'));
              return original(input, init);
            };
          });
          await click('[data-field="opening"][data-value="explorar"]');
          await click('.tf-refine-cta');
          await click(`[data-field="system"][data-value="${zero.system}"]`);
          await click(`[data-field="deckFamily"][data-value="${zero.deckFamily}"]`);
          await click(`[data-field="language"][data-value="${zero.language}"]`);
          await click(`[data-field="guide"][data-value="${zero.guide}"]`);
          await page.waitForSelector('.tf-reveal-alternatives', { timeout: 10000 });
          await click('.tf-reveal-alternatives');
          await page.waitForFunction(() => !document.querySelector('.tf-loading'), { timeout: 10000 });
          const failOpen = await page.evaluate(() => ({
            whatsapp: !!document.querySelector('.tf-wa-cta'),
            rootVisible: !document.querySelector('#tarot-finder-app')?.hidden,
            text: document.querySelector('#tarot-finder-app')?.textContent || '',
          }));
          assert.ok(failOpen.rootVisible, 'Finder remains visible after endpoint failure');
          assert.ok(failOpen.whatsapp, 'WhatsApp remains after endpoint failure');
          assert.equal(pageErrors.length, 0, 'no pageerror expected: ' + pageErrors.join(' | '));
          console.log('E2E fail-open=' + JSON.stringify({ whatsapp: failOpen.whatsapp, rootVisible: failOpen.rootVisible }));

          await browser.close();
          NODE
          cd /tmp/pr215-puppeteer
          node live.mjs
