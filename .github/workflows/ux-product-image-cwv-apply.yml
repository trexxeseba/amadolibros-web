name: UX product image CWV one-shot

on:
  push:
    branches:
      - agent/ux-product-image-cwv-1
    paths:
      - '.github/workflows/ux-product-image-cwv-apply.yml'

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-product-image-cwv-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply UX image/CWV patch
        run: |
          node scripts/ux-apply-product-image-cwv-1.mjs
          node --check 'functions/libro/[[path]].js'
          node --test functions/__tests__/product-image-cwv.test.js
          git diff --check
      - name: Commit implementation and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'functions/libro/[[path]].js' functions/__tests__/product-image-cwv.test.js
          git commit -m 'UX-PRODUCT-IMAGE-1: prioritize cover and reduce hidden image cost'
          git rm scripts/ux-apply-product-image-cwv-1.mjs .github/workflows/ux-product-image-cwv-apply.yml
          git commit -m 'UX product: remove temporary image/CWV helpers'
          git push origin HEAD:agent/ux-product-image-cwv-1
