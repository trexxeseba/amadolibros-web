name: UX transfer discount one-shot

on:
  push:
    branches:
      - agent/ux-product-image-cwv-1
    paths:
      - '.github/workflows/ux-transfer-discount-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-product-image-cwv-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply transfer discount emphasis
        run: |
          python scripts/ops/ux-transfer-discount-patch.py
          node --check 'functions/libro/[[path]].js'
          node --test functions/__tests__/product-image-cwv.test.js
          git diff --check
      - name: Commit and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'functions/libro/[[path]].js' functions/__tests__/product-image-cwv.test.js
          git commit -m 'UX-PRODUCT-PRICE-1: emphasize 12 percent transfer discount'
          git rm .github/workflows/ux-transfer-discount-one-shot.yml scripts/ops/ux-transfer-discount-patch.py
          git commit -m 'UX product: remove temporary transfer discount helpers'
          git push origin HEAD:agent/ux-product-image-cwv-1
