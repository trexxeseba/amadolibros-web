name: Vintage pausar riesgosas

# Pausa las publicaciones de Amado Vintage (2341378249) de la lista aprobada por Seba el 08/11/2026
# (scripts/vintage-cloud/eliminar-2026-11-09.txt), por riesgo de propiedad intelectual. Pausar es
# reversible y conserva el historial. Con "eliminar" las cierra y borra (irreversible). Sin "real"
# sólo lee e informa. Nunca toca Amado Libros.
on:
  workflow_dispatch:
    inputs:
      real:
        description: 'Hacerlo de verdad (sin tildar: sólo informa)'
        type: boolean
        default: false
      eliminar:
        description: 'Eliminar en vez de pausar (irreversible; exige escribir ELIMINAR)'
        type: boolean
        default: false
      confirmar:
        description: 'Para eliminar de verdad escribí ELIMINAR'
        required: false

permissions:
  contents: read

concurrency:
  group: vintage-eliminar
  cancel-in-progress: false

jobs:
  eliminar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: node --experimental-sqlite --test functions/__tests__/vintage-eliminar.test.js
      - name: Pausar o eliminar
        env:
          REAL: ${{ inputs.real }}
          ELIMINAR: ${{ inputs.eliminar }}
          CONFIRMAR: ${{ inputs.confirmar }}
        shell: bash
        run: |
          ARGS=(--lista scripts/vintage-cloud/eliminar-2026-11-09.txt)
          if [ "$REAL" = "true" ]; then ARGS+=(--real); fi
          if [ "$ELIMINAR" = "true" ]; then
            if [ "$CONFIRMAR" != "ELIMINAR" ]; then echo "Para eliminar de verdad hay que escribir ELIMINAR"; exit 1; fi
            ARGS+=(--eliminar)
          fi
          node scripts/vintage-cloud/eliminar.mjs "${ARGS[@]}"
