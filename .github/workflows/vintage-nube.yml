name: Vintage publicador (nube)

# Publicador de Amado Vintage (seller 2341378249) sin la PC. Nunca Amado Libros.
# Código: scripts/vintage-cloud/run.mjs (usa el mismo motor que la PC, scripts/vintage-local/).
# Detalle y cómo prenderlo: docs/vintage-nube.md.
#
# Llaves en scripts/vintage-local/campaign.json:
#   "ejecutor": "pc" | "nube"         quién publica. Con "nube" la PC queda en espera sola.
#   "nube": {"modo": "prueba" | "real" | "apagado", "tanda", "tope_diario", "minutos"}
# Publica de verdad sólo con "ejecutor": "nube" y "modo": "real" a la vez.
#
# Cada hora: con las dos llaves, publica una tanda (hasta "minutos" y el tope del día); si no, sólo mantiene vivo el token
# de Vintage (lo usa Precio Ganador). Nunca toca precios: eso es de Precio Ganador.
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      accion:
        description: 'auto = lo mismo que la programada (la lanza el Worker cada hora) · prueba = números + qué pausaría + 5 altas preparadas sin enviar · numeros = sólo lista y conteo · publicar = real (exige las dos llaves) · keepalive = sólo el token'
        type: choice
        options: [prueba, numeros, publicar, keepalive, auto]
        default: prueba
      tanda:
        description: 'Altas máximas en esta corrida (vacío = la de campaign.json)'
        required: false
      tope:
        description: 'Tope de altas del día (vacío = el de campaign.json)'
        required: false

concurrency:
  group: vintage-nube
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  correr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      SBS_EMAIL: ${{ secrets.SBS_EMAIL }}
      SBS_PASSWORD: ${{ secrets.SBS_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node --experimental-sqlite --test functions/__tests__/vintage-cloud.test.js functions/__tests__/vintage-stock-sync-local.test.js

      - name: Decidir qué hacer
        id: decidir
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          IN_ACCION: ${{ inputs.accion }}
        shell: bash
        run: |
          REAL=$(node -e "const c=require('./scripts/vintage-local/campaign.json');console.log(c.ejecutor==='nube'&&c.nube?.modo==='real'?'si':'no')")
          # "auto" lo manda el Worker de Cloudflare cada hora: se comporta como la programada.
          if [ "$EVENTO" = "schedule" ] || [ "$IN_ACCION" = "auto" ]; then EVENTO=schedule; fi
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$REAL" = "si" ]; then ACCION=publicar; else ACCION=keepalive; fi
          else
            ACCION="$IN_ACCION"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Faltan los secretos de Cloudflare"; exit 1; fi
          if [ "$ACCION" != "keepalive" ] && { [ -z "$SBS_EMAIL" ] || [ -z "$SBS_PASSWORD" ]; }; then
            echo "Faltan los secretos SBS_EMAIL y SBS_PASSWORD en GitHub (ver docs/vintage-nube.md): esta vuelta sólo cuida el token."
            if [ "$EVENTO" != "schedule" ]; then exit 1; fi
            ACCION=keepalive
          fi
          # Precio Ganador y el publicador no se cruzan: si está corriendo, esta vuelta sólo cuida el token.
          if [ "$ACCION" = "publicar" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/precio-ganador.yml/runs?status=in_progress&per_page=5" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "Precio Ganador está corriendo: esta vuelta no publica"; ACCION=keepalive; fi
          fi
          echo "Acción: $ACCION (publicación real habilitada: $REAL)"
          echo "accion=$ACCION" >> "$GITHUB_OUTPUT"

      # Clave de un solo uso para /operations/vintage-renew: el hash va a D1 y vence en 4 h.
      # Así no hace falta un secreto VINTAGE_RENEW_SECRET en GitHub.
      - name: Clave de corrida
        run: node scripts/vintage-cloud/key.mjs crear

      # La base del motor (recorrido del inventario, trabajos) se guarda entre corridas: el recorrido
      # completo (~1 h) se hace una vez por lista nueva y no en cada corrida. Si se pierde, se rehace.
      - name: Traer la base del motor
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vintage/*.sqlite
          key: vintage-motor-${{ github.run_id }}
          restore-keys: vintage-motor-

      - name: Correr
        env:
          ACCION: ${{ steps.decidir.outputs.accion }}
          IN_TANDA: ${{ inputs.tanda }}
          IN_TOPE: ${{ inputs.tope }}
        shell: bash
        run: |
          ARGS=(--accion "$ACCION" --dir "$RUNNER_TEMP/vintage" --salida "$RUNNER_TEMP/reporte")
          if [[ "$IN_TANDA" =~ ^[0-9]+$ ]]; then ARGS+=(--tanda "$IN_TANDA"); fi
          if [[ "$IN_TOPE" =~ ^[0-9]+$ ]]; then ARGS+=(--tope "$IN_TOPE"); fi
          node --experimental-sqlite scripts/vintage-cloud/run.mjs "${ARGS[@]}"

      - name: Guardar la base del motor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vintage/*.sqlite
          key: vintage-motor-${{ github.run_id }}

      # Sólo el reporte (conteos y estados). La conexión y la lista quedan en RUNNER_TEMP y se borran.
      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vintage-nube-${{ github.run_id }}
          path: ${{ runner.temp }}/reporte/
          retention-days: 30
          if-no-files-found: ignore

      - name: Borrar la clave de corrida
        if: always()
        run: node scripts/vintage-cloud/key.mjs borrar || true
