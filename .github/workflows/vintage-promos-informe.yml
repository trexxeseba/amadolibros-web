name: Vintage promos informe (solo lectura)

# Informe de promociones y cupones de Amado Vintage (2341378249): cuánto descuento aguanta
# cada libro sin bajar de su piso y qué campañas le cierran. SOLO GET a Mercado Libre y
# SELECT a D1: no crea, pausa ni cambia nada. Verifica con /users/me que el token es de
# Vintage antes de leer. Código: vintage-promos/. El log lleva agregados; el detalle por
# libro queda en el archivo adjunto de la corrida (7 días).
on:
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama con el código a probar (solo lectura)'
        default: 'main'
      limite_items:
        description: 'Máximo de publicaciones activas a leer'
        default: '5000'

permissions:
  contents: read

concurrency:
  group: vintage-promos-informe
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIMITE_ITEMS: ${{ inputs.limite_items }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: node --test vintage-promos/test/*.test.mjs
      - name: Informe
        run: node vintage-promos/src/informe.mjs "$RUNNER_TEMP/informe-vintage-promos.json"
      - name: Adjuntar el detalle por libro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-vintage-promos
          path: ${{ runner.temp }}/informe-vintage-promos.json
          retention-days: 7
          if-no-files-found: ignore
