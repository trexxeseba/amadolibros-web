name: Vintage SBS probe (temporal)
# Temporal: comprueba si el portal de SBS responde desde los servidores de GitHub.
# Sólo GET de la página de login, sin credenciales. Se borra antes de mergear.
on:
  push:
    branches: [claude/modest-hypatia-2b2nna]
    paths: ['.github/workflows/vintage-sbs-probe-temp.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET login de SBS
        run: |
          curl -sS -o page.html -w "login http=%{http_code} type=%{content_type} ip=%{remote_ip} time=%{time_total}\n" --max-time 60 "https://ag.sbs.com.ar/Account/Login?ReturnUrl=%2FHome%2FAllPriceList" || echo "login falló"
          echo "token antifalsificación presente: $(grep -c '__RequestVerificationToken' page.html 2>/dev/null || echo 0)"
          grep -o '<title>[^<]*' page.html | head -1 || true
          curl -sS -I --max-time 60 "https://sbs-distribuidora-lista.s3.sa-east-1.amazonaws.com/Listado+completo+de+libros.xlsx" | grep -iE "^(HTTP|last-modified|content-length)" || echo "s3 falló"
          curl -sS -o /dev/null -w "runner ip: " https://api.ipify.org; curl -sS https://api.ipify.org; echo
