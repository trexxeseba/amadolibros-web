name: Vintage sondeo de listas de SBS

# Sólo lectura: baja las listas de precios del portal de SBS (menú Catálogo) y cuenta filas, fecha y
# ISBN únicos. No escribe en D1, no toca Mercado Libre. Ver scripts/vintage-cloud/sbs-sondeo.mjs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vintage-sbs-sondeo
  cancel-in-progress: false

jobs:
  sondear:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SBS_EMAIL: ${{ secrets.SBS_EMAIL }}
      SBS_PASSWORD: ${{ secrets.SBS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sondear las listas
        run: node --experimental-sqlite scripts/vintage-cloud/sbs-sondeo.mjs
