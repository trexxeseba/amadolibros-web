name: Vintage status (read-only)

# Estado de la campaña de Amado Vintage leído de D1 de producción, donde la PC
# reserva y confirma cada alta. Sólo SELECT: no escribe en D1 ni llama a Mercado Libre.
# Sirve para ver el progreso sin acceso a la PC (manual o cada 3 horas).
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */3 * * *'

permissions:
  contents: read

concurrency:
  group: vintage-status
  cancel-in-progress: false

jobs:
  # El volcado de estado queda a pedido: la tarjeta de Vintage del panel ya
  # muestra lo mismo sin gastar minutos de Actions cada 3 horas. El cron sigue
  # existiendo para el job salud-panel de abajo.
  status:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Vintage campaign state from production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() { npx --yes wrangler@3.114.17 d1 execute ORDERS_DB --env production --remote --json --command "$1" || echo "(consulta fallida)"; }
          echo '### Recibos de Vintage por estado'
          q "SELECT state, COUNT(*) AS n, datetime(MAX(updated_at)/1000,'unixepoch','-3 hours') AS ultimo_uy FROM ml_vintage_pub_receipts WHERE seller_id='2341378249' GROUP BY state ORDER BY n DESC"
          echo '### Altas por día (hora de Uruguay)'
          q "SELECT date(created_at/1000,'unixepoch','-3 hours') AS dia, COUNT(*) AS altas FROM ml_vintage_pub_receipts WHERE seller_id='2341378249' AND state='published' GROUP BY dia ORDER BY dia DESC LIMIT 7"
          echo '### Lote Vintage'
          q "SELECT state, feed_id, daily_cap, json_extract(policy_json,'$.margin') AS margen, json_extract(policy_json,'$.minimumSaleUyu') AS minimo_uyu, json_extract(policy_json,'$.supplierDiscount') AS descuento_sbs, json_extract(policy_json,'$.arsPerUyu') AS ars_por_uyu, json_extract(policy_json,'$.competitive') AS competitivo, json_extract(policy_json,'$.competitiveFloorMargin') AS piso_competitivo, json_extract(policy_json,'$.competitiveMinimumSaleUyu') AS minimo_competitivo_uyu, datetime(updated_at/1000,'unixepoch','-3 hours') AS actualizado_uy FROM ml_vintage_pub_runs WHERE id='23413782-4900-4000-8000-000000010000'"
          echo '### Cambios de política registrados'
          q "SELECT substr(old_hash,1,12) AS desde, substr(new_hash,1,12) AS hacia, json_extract(new_policy_json,'$.competitive') AS competitivo, datetime(created_at/1000,'unixepoch','-3 hours') AS cuando_uy FROM ml_vintage_bulk_policy_amendments WHERE run_id='23413782-4900-4000-8000-000000010000' ORDER BY created_at DESC LIMIT 5"
          echo '### Altas por hora, últimas 12 horas (hora de Uruguay)'
          q "SELECT strftime('%Y-%m-%d %H:00',created_at/1000,'unixepoch','-3 hours') AS hora, COUNT(*) AS altas FROM ml_vintage_pub_receipts WHERE seller_id='2341378249' AND state='published' AND created_at > (strftime('%s','now')-12*3600)*1000 GROUP BY hora ORDER BY hora DESC"
          echo '### Últimas 5 altas con precio enviado'
          q "SELECT r.isbn, r.item_id, json_extract(j.payload_json,'$.price') AS precio_uyu, datetime(r.updated_at/1000,'unixepoch','-3 hours') AS cuando_uy FROM ml_vintage_pub_receipts r LEFT JOIN ml_vintage_pub_jobs j ON j.run_id=r.run_id AND j.isbn=r.isbn WHERE r.seller_id='2341378249' AND r.state='published' ORDER BY r.updated_at DESC LIMIT 5"
          echo '### Conexión de la PC'
          q "SELECT enabled, datetime(expires_at/1000,'unixepoch','-3 hours') AS vence_uy, datetime(last_at/1000,'unixepoch','-3 hours') AS ultima_actividad_uy FROM ml_vintage_local_access"
          echo '### Stock del proveedor cargado'
          q "SELECT id, source_date, state, expected_rows FROM sbs_supplier_feeds ORDER BY source_date DESC LIMIT 3"

  # Estado de los reportes para la sección Salud del panel. Con el repo privado
  # GitHub no le contesta al panel sin credencial; este job ya tiene el token
  # del workflow y deja el resultado en la caché de KV que el panel lee.
  # Se guarda por 8 horas: cubre la demora habitual de los cron de GitHub.
  salud-panel:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer las últimas corridas de los workflows vigilados
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops/panel-salud-cache.mjs "$RUNNER_TEMP/salud.json"
      - name: Guardar en la caché del panel (KV)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.107.0 kv key put panel:salud:workflows             --path "$RUNNER_TEMP/salud.json"             --namespace-id 6ea0ff4682d647118442a24fe384abc4             --ttl 28800 --remote >/dev/null
          echo "Caché de Salud actualizada."
