# worker-sync/wrangler.toml
# Worker independiente de sync — escribe catalog.json en R2.
# Separado del proyecto Pages: no comparte código, solo comparte KV namespace
# (auth:refresh_token) y R2 bucket (amadolibros-catalog).

name = "amadolibros-sync"
# RADAR DATA 2: entrada compuesta que delega todo el comportamiento histórico
# a index.js y añade únicamente rutas/ingesta read-only de ventas ML.
main = "radar-data-worker.js"
compatibility_date = "2024-09-23"

# ── Cron: sincronización automática 1 vez por día — 07:15 UTC (04:15 Montevideo)
[triggers]
crons = ["15 7 * * *", "*/5 * * * *"]

# ── Variables no sensibles ────────────────────────────────────────────────────
[vars]
APP_ID          = "4741021817925208"
USER_ID         = "440298103"
# Mínimo de items activos aceptables — aborta si R2 se quedaría con menos.
MIN_ACTIVE_ITEMS = "500"
# Descripciones ML: endpoint individual. El primer lote vidriera acelera el
# cupo de 100 a 300 por día, con la misma pausa y caché de 90 días. No intenta
# hacer 1.000 requests en una sola corrida ni pone en riesgo el sync completo.
ML_DESCRIPTION_ENRICH_LIMIT = "300"
ML_DESCRIPTION_REFRESH_DAYS = "90"
ML_DESCRIPTION_SLEEP_MS = "100"
# Galerías oficiales de productos de catálogo: se cachean en R2 y se
# completan incrementalmente para no repetir miles de consultas en cada sync.
# La edición especial de My Hero Academia se prioriza en la primera corrida.
ML_CATALOG_GALLERY_ENRICH_LIMIT = "300"
ML_CATALOG_GALLERY_REFRESH_DAYS = "90"
ML_CATALOG_GALLERY_SLEEP_MS = "75"
ML_CATALOG_GALLERY_PRIORITY_IDS = "MLU63131903"
# Copia incremental de portadas y galerías. El cron de 5 minutos completa el
# primer backfill y luego baja automáticamente a mantenimiento horario para
# cambios y revalidaciones de copias de más de 30 días.
COVER_MIRROR_BATCH_SIZE = "100"
# No generar detalles de portadas automáticamente. Las fuentes insuficientes
# quedan en covers/v1/quality-report.json para conseguir un original mejor.
COVER_ALLOW_GENERATIVE_UPSCALE = "false"
CANONICAL_ORIGIN = "https://www.amadolibros.com"
INDEXNOW_ENABLED = "true"
# RADAR DATA 2 permanece apagado aun si el código se fusionara. Habilitar sólo
# después de aplicar la migración D1 y validar /sales/verify read-only.
ML_SALES_SYNC_ENABLED = "false"
ML_SALES_BACKFILL_DAYS = "90"
ML_SALES_MAINTENANCE_DAYS = "7"
# Clave pública verificada por el archivo homónimo en astro-front/public.
INDEXNOW_KEY = "944e65e97fd0a8c242c495ccf458d3c3"
SALES_NOTIFICATION_FROM = "Amado Libros <web@notificaciones.amadolibros.com>"
GA4_MEASUREMENT_ID = "G-SDX45VEPP3"

# ── R2: destino del catálogo ──────────────────────────────────────────────────
# Binding name: CATALOG_R2
# Bucket real:  amadolibros-catalog (mismo que usa local_sync.py)
# URL pública:  https://pub-b2b408811ae24e3da04cda79c6ff084d.r2.dev/
[[r2_buckets]]
binding     = "CATALOG_R2"
bucket_name = "amadolibros-catalog"

[[r2_buckets]]
binding     = "COVER_R2"
bucket_name = "amadolibros-images-production"

# Cloudflare Images disponible; el mirror prioriza fuentes nativas medidas.
# El Worker usa upscale=generate (IA) sólo cuando el lado corto es menor a
# 1024 px y conserva el original en R2 si la transformación falla.
[images]
binding = "IMAGES"

# ── KV: compartido con Pages — solo para auth:refresh_token ──────────────────
# NO escribir aquí catalog_index, item:*, catalog:full ni ningún esquema viejo.
[[kv_namespaces]]
binding = "AMADO_KV"
id      = "6ea0ff4682d647118442a24fe384abc4"

# D1 productiva: órdenes web + waitlist + telemetría operativa RADAR.
[[d1_databases]]
binding = "ORDERS_DB"
database_name = "amadolibros-orders-production"
database_id = "6dc8dc3a-2d4f-4045-b428-14323c7b0bcd"

# ── Secrets a configurar via `wrangler secret put` ───────────────────────────
# CLIENT_SECRET  — secreto OAuth de la app MercadoLibre
# SYNC_SECRET    — token para rutas internas, incluido GET /bing-webmaster/summary
# BING_WEBMASTER_API_KEY — secret de la API de Bing Webmaster Tools (solo lectura)
# GA4_API_SECRET — secret de Measurement Protocol del stream productivo
# RESEND_API_KEY — envío automático al cliente cuando vuelve el stock
# (No hay env REFRESH_TOKEN — el token rotativo vive en KV: auth:refresh_token)
