# worker-sync/wrangler.toml
# Worker independiente de sync — escribe catalog.json en R2.
# Separado del proyecto Pages: no comparte código, solo comparte KV namespace
# (auth:refresh_token) y R2 bucket (amadolibros-catalog).

name = "amadolibros-sync"
main = "index.js"
compatibility_date = "2024-09-23"

# ── Cron: sincronización automática 1 vez por día — 07:15 UTC (04:15 Montevideo)
[triggers]
crons = ["15 7 * * *"]

# ── Variables no sensibles ────────────────────────────────────────────────────
[vars]
APP_ID          = "4741021817925208"
USER_ID         = "440298103"
# Mínimo de items activos aceptables — aborta si R2 se quedaría con menos.
MIN_ACTIVE_ITEMS = "500"
# Descripciones ML: endpoint individual. Se completa un cupo diario y se
# reutiliza por 90 días para no convertir 7.000 ítems en 7.000 requests/día.
ML_DESCRIPTION_ENRICH_LIMIT = "100"
ML_DESCRIPTION_REFRESH_DAYS = "90"
ML_DESCRIPTION_SLEEP_MS = "100"
CANONICAL_ORIGIN = "https://www.amadolibros.com"
INDEXNOW_ENABLED = "true"
# Clave pública verificada por el archivo homónimo en astro-front/public.
INDEXNOW_KEY = "944e65e97fd0a8c242c495ccf458d3c3"
SALES_NOTIFICATION_FROM = "Amado Libros <web@notificaciones.amadolibros.com>"

# ── R2: destino del catálogo ──────────────────────────────────────────────────
# Binding name: CATALOG_R2
# Bucket real:  amadolibros-catalog (mismo que usa local_sync.py)
# URL pública:  https://pub-b2b408811ae24e3da04cda79c6ff084d.r2.dev/
[[r2_buckets]]
binding     = "CATALOG_R2"
bucket_name = "amadolibros-catalog"

# ── KV: compartido con Pages — solo para auth:refresh_token ──────────────────
# NO escribir aquí catalog_index, item:*, catalog:full ni ningún esquema viejo.
[[kv_namespaces]]
binding = "AMADO_KV"
id      = "6ea0ff4682d647118442a24fe384abc4"

# D1 productiva: únicamente lee y actualiza solicitudes de aviso de stock.
[[d1_databases]]
binding = "ORDERS_DB"
database_name = "amadolibros-orders-production"
database_id = "6dc8dc3a-2d4f-4045-b428-14323c7b0bcd"

# ── Secrets a configurar via `wrangler secret put` ───────────────────────────
# CLIENT_SECRET  — secreto OAuth de la app MercadoLibre
# SYNC_SECRET    — token para rutas internas, incluido GET /bing-webmaster/summary
# BING_WEBMASTER_API_KEY — secret de la API de Bing Webmaster Tools (solo lectura)
# RESEND_API_KEY — envío automático al cliente cuando vuelve el stock
# (No hay env REFRESH_TOKEN — el token rotativo vive en KV: auth:refresh_token)
