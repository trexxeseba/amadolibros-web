# wrangler.toml - Configuración de AmadoLibros.com (Pages)
# Pages es solo lectura. El Worker (worker-sync/) escribe el catálogo en R2.
# IMPORTANTE: CLIENT_SECRET y REFRESH_TOKEN se configuran como secretos
# en el Dashboard de Cloudflare Pages > Settings > Environment Variables

name = "amadolibros-web"
compatibility_date = "2024-09-23"

# Requerido para que wrangler.toml sea reconocido por Pages deploy
pages_build_output_dir = "./public"

# KV: usado por webhooks/mercadolibre.js (audit log, orders, stock)
# y por /api/status para leer sync:last_ok / sync:last_error del Worker.
# NO se usa para datos de catálogo.
[[kv_namespaces]]
binding = "AMADO_KV"
id = "6ea0ff4682d647118442a24fe384abc4"

[[env.preview.kv_namespaces]]
binding = "AMADO_KV"
id = "6ea0ff4682d647118442a24fe384abc4"

[[env.preview.d1_databases]]
binding = "ORDERS_DB"
database_name = "amadolibros-orders-preview"
database_id = "6fa387af-f29e-46dc-97e5-30298568b4a6"

# Vars no secretas de Preview — env.preview.vars aplica a TODOS los
# preview deployments del proyecto, no solo a esta rama. CANONICAL_ORIGIN
# queda fijado al alias de esta rama porque Cloudflare Pages no permite
# vars por-rama; otras ramas de preview que usen checkout recibirán un
# origen canónico incorrecto hasta que 2-N-E2 resuelva ese alcance (ver
# docs/environments.md, sección "Riesgos pendientes").
[env.preview.vars]
APP_ENV           = "preview"
MP_COLLECTOR_ID   = "3559407834"
CHECKOUT_ENABLED  = "true"
CANONICAL_ORIGIN  = "https://feature-2-n-e1-production-re.amadolibros-web.pages.dev"

# ── Producción (2-K-E2) ───────────────────────────────────────────────────
# Base D1 propia, con database_id DISTINTO al de Preview — nunca reutilizar
# el de env.preview. Creada y migrada (0001+0002) en 2-K-E2, verificada
# vacía y con el esquema correcto antes de conectarla acá.
[[env.production.kv_namespaces]]
binding = "AMADO_KV"
id = "6ea0ff4682d647118442a24fe384abc4"

[[env.production.d1_databases]]
binding = "ORDERS_DB"
database_name = "amadolibros-orders-production"
database_id = "6dc8dc3a-2d4f-4045-b428-14323c7b0bcd"

# CHECKOUT_ENABLED en "true" (2-N-H1): el kill switch queda encendido, así que
# POST /api/orders y POST /api/preferences aceptan pedidos reales. Para apagar
# los cobros de forma inmediata, cambiar esta variable a "false" en el
# dashboard de Cloudflare Pages (Production) — el webhook y /api/orders/status
# siguen funcionando igual, así que un pago ya iniciado se confirma sin
# problemas. Ver docs/environments.md, "Procedimiento operativo".
# MP_COLLECTOR_ID confirmado en 2-N-G2 (440298103) — NO es el número de
# aplicación de Mercado Pago (6816864196905927, solo informativo, no se usa
# en runtime). MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET y TURNSTILE_SECRET_KEY
# siguen sin declararse acá — son secrets, viven únicamente en el dashboard
# de Cloudflare Pages.
[env.production.vars]
APP_ENV           = "production"
CHECKOUT_ENABLED  = "true"
CANONICAL_ORIGIN  = "https://www.amadolibros.com"
ALLOWED_HOSTS     = "amadolibros.com,www.amadolibros.com"
MP_COLLECTOR_ID   = "440298103"
