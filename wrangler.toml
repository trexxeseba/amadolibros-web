# wrangler.toml - Configuración de AmadoLibros.com
# IMPORTANTE: CLIENT_SECRET y REFRESH_TOKEN se configuran como secretos
# en el Dashboard de Cloudflare Pages > Settings > Environment Variables

name = "amadolibros-web"
compatibility_date = "2024-09-23"

# Requerido para que wrangler.toml sea reconocido por Pages deploy
pages_build_output_dir = "./public"

# Variables de entorno no sensibles
[vars]
APP_ID = "4741021817925208"
USER_ID = "440298103"

# Binding al KV Namespace para el caché del catálogo
[[kv_namespaces]]
binding = "AMADO_KV"
id = "6ea0ff4682d647118442a24fe384abc4"
